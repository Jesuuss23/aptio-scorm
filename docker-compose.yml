services:
  postgres:
    image: postgres:16-alpine
    container_name: aptio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: aptio_scorm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aptio-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  s3:
    image: localstack/localstack:3.8.0
    container_name: aptio-s3
    restart: always
    ports:
      - '9000:4566'
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - s3_data:/var/lib/localstack

volumes:
  postgres_data:
  redis_data:
  s3_data:
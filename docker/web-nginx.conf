# HU-1405 · Solo para probar la imagen web en local: la SPA cae en index.html; los recursos con hash son inmutables.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

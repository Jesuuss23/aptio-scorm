          minimum: 1
        textoBoton:
          type: string
          maxLength: 40
          example: Suscribirme
        destacado:
          type: boolean
          description: Al destacarlo, los demás dejan de estarlo
        visible:
          type: boolean
        caracteristicas:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/CaracteristicaPlan'
        ficticio:
          type: boolean
    Plan:
      type: object
      required: [id, slug, nombre, descripcion, precioMes, precioAnual, precioAnualEfectivo, precioMesUsd, precioAnualUsd, precioAnualUsdEfectivo, capsulasMes, usuarios, capsulaAdicional, textoBoton, destacado, visible, caracteristicas, orden, ficticio, actualizadoEn]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: productora
        nombre:
          type: string
          example: Productora
        descripcion:
          type: string
        precioMes:
          type: integer
          nullable: true
          example: 1290
        precioAnual:
          type: integer
          nullable: true
        precioAnualEfectivo:
          type: integer
          nullable: true
          example: 12384
          description: El precio anual propio o el mensual × 12 con el descuento; null si es a medida
        precioMesUsd:
          type: integer
          nullable: true
          example: 349
          description: HU-1704 · Dólares enteros sin IGV; null = el plan no se cobra en dólares
        precioAnualUsd:
          type: integer
          nullable: true
          description: HU-1704 · Anual propio en USD; null = precioMesUsd × 12 con el descuento anual
        precioAnualUsdEfectivo:
          type: integer
          nullable: true
          example: 3350
          description: HU-1704 · El anual en USD que se cobra; null si no hay precio en dólares
        capsulasMes:
          type: integer
          nullable: true
        usuarios:
          type: integer
          nullable: true
        capsulaAdicional:
          type: integer
          nullable: true
        textoBoton:
          type: string
        destacado:
          type: boolean
        visible:
          type: boolean
        caracteristicas:
          type: array
          items:
            $ref: '#/components/schemas/CaracteristicaPlan'
        orden:
          type: integer
        ficticio:
          type: boolean
        actualizadoEn:
          type: string
          format: date-time
    AjustesPlanes:
      type: object
      required: [mostrarAnual, descuentoAnual, conIgv]
      properties:
        mostrarAnual:
          type: boolean
          description: Mostrar el precio anual con el ahorro en cada plan
        descuentoAnual:
          type: integer
          minimum: 0
          maximum: 90
          example: 20
        conIgv:
          type: boolean
          description: Mostrar los precios con el IGV de 18 %
    ListaPlanes:
      type: object
      required: [planes, ajustes]
      properties:
        planes:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        ajustes:
          $ref: '#/components/schemas/AjustesPlanes'
    OrdenPlanes:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Todos los planes, en el orden nuevo
    CheckoutEntrada:
      type: object
      description: HU-1703 · Lo que envía `/pago`. Datos no confiables del visitante; la atribución es de mejor esfuerzo.
      required: [plan, razonSocial, nombreAdmin, correoAdmin, consentimiento]
      properties:
        plan: { type: string, example: productora }
        ciclo: { type: string, enum: [MENSUAL, ANUAL], default: MENSUAL }
        moneda: { type: string, enum: [PEN, USD], default: PEN, description: 'HU-1704 · Dólares solo si el plan tiene precio en USD y una pasarela visible y activa cobra en dólares' }
        razonSocial: { type: string, maxLength: 150, example: Minera Andina SAC }
        ruc: { type: string, example: '20131312955', description: 'Opcional. 11 dígitos (prefijo 10, 15, 16, 17 o 20) con el dígito verificador de SUNAT; admite espacios y guiones' }
        nombreAdmin: { type: string, maxLength: 120, example: Ana Quispe }
        correoAdmin: { type: string, format: email, maxLength: 160, example: ana@minera.pe }
        consentimiento: { type: boolean, example: true }
        paginaEntrada: { type: string, example: /precios }
        referente: { type: string }
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        utm_term: { type: string }
        utm_content: { type: string }
        idioma: { type: string, enum: [es, en] }
    ResumenCheckout:
      type: object
      required: [plan, nombrePlan, ciclo, subtotal, igv, total, moneda]
      properties:
        plan: { type: string, example: productora }
        nombrePlan: { type: string, example: Productora }
        ciclo: { type: string, enum: [MENSUAL, ANUAL] }
        subtotal: { type: number, example: 1290, description: 'Sin IGV por el ciclo, en la moneda del cobro (el precio pactado)' }
        igv: { type: number, example: 232.2, description: 'IGV de 18 %, también en dólares (supuesto SUP-295)' }
        total: { type: number, example: 1522.2 }
        moneda: { type: string, enum: [PEN, USD] }
    PagoCheckout:
      type: object
      description: |-
        HU-1704 · Cómo sigue el pago según la pasarela: `simulado` (formulario de tarjetas de prueba), `redireccion` (la
        página alojada de Stripe Checkout en `url`) o `formulario` (Culqi Checkout incrustado, con la llave pública y el
        monto en céntimos). La tarjeta nunca pasa por Aptio SCORM.
      required: [tipo]
      properties:
        tipo: { type: string, enum: [simulado, redireccion, formulario] }
        url: { type: string, example: 'https://checkout.stripe.com/c/pay/cs_test_…' }
        referencia: { type: string, example: cs_test_…, description: La sesión o el cargo en la pasarela }
        llavePublica: { type: string, example: pk_test_…, description: Llave pública (nunca la secreta) }
        montoCentimos: { type: integer, example: 152220 }
        moneda: { type: string, enum: [PEN, USD] }
        descripcion: { type: string, example: Aptio SCORM · Plan Productora (mensual) }
    CheckoutCreado:
      type: object
      required: [id, estado, resumen, tipoComprobante, pasarela, pago]
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE] }
        resumen: { $ref: '#/components/schemas/ResumenCheckout' }
        tipoComprobante: { type: string, enum: [FACTURA, BOLETA] }
        pasarela: { type: string, enum: [pruebas, culqi, stripe], example: pruebas, description: 'La pasarela que cobra esa moneda (HU-1704)' }
        pago: { $ref: '#/components/schemas/PagoCheckout' }
    EstadoCheckout:
      type: object
      required: [id, estado, plan, nombrePlan, ciclo, total, moneda, tipoComprobante, correoAdmin, motivoRechazo, finPeriodo]
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA] }
        plan: { type: string, example: productora }
        nombrePlan: { type: string, example: Productora }
        ciclo: { type: string, enum: [MENSUAL, ANUAL] }
        total: { type: number, example: 1522.2 }
        moneda: { type: string, enum: [PEN, USD] }
        tipoComprobante: { type: string, enum: [FACTURA, BOLETA] }
        correoAdmin: { type: string, format: email, description: Adónde llega la bienvenida }
        motivoRechazo: { type: string, nullable: true }
        finPeriodo: { type: string, format: date-time, nullable: true, description: 'Fin del período pagado, con la suscripción activa' }
    PagoPrueba:
      type: object
      required: [tarjeta]
      properties:
        tarjeta: { type: string, example: 4111 1111 1111 1111 }
    WebhookRecibido:
      type: object
      required: [recibido, duplicado]
      properties:
        recibido: { type: boolean, enum: [true] }
        duplicado: { type: boolean, description: 'true si el evento ya se había procesado y no se creó nada' }
        ignorado: { type: boolean, description: 'HU-1704 · true si el evento no es de pago (la pasarela manda otros tipos): no se creó nada' }
    TokenPago:
      type: object
      required: [token]
      properties:
        token: { type: string, example: tkn_test_…, description: 'El token de un solo uso del formulario incrustado (Culqi Checkout)' }
    Pasarela:
      type: object
      description: HU-1704 · Una pasarela como la ve el superadmin. Nunca lleva llaves ni secretos, solo los nombres de las variables que faltan.
      required: [codigo, nombre, visible, orden, modo, monedas, flujo, simulada, activa, variablesFaltantes]
      properties:
        codigo: { type: string, enum: [pruebas, culqi, stripe] }
        nombre: { type: string, maxLength: 40, example: Culqi }
        visible: { type: boolean, description: Se ofrece en el pago (si además está activa) }
        orden: { type: integer }
        modo: { type: string, enum: [pruebas, produccion], description: 'Qué juego de llaves usa (variables *_PRUEBAS o *_PRODUCCION)' }
        monedas: { type: array, items: { type: string, enum: [PEN, USD] }, example: [PEN] }
        flujo: { type: string, enum: [simulado, redireccion, formulario] }
        simulada: { type: boolean, description: 'La de pruebas: solo existe con SITIO_ENTORNO=pruebas' }
        activa: { type: boolean, description: Sus variables de entorno del modo están y el entorno la admite }
        variablesFaltantes: { type: array, items: { type: string }, example: [STRIPE_LLAVE_SECRETA_PRUEBAS] }
    ListaPasarelas:
      type: object
      required: [pasarelas]
      properties:
        pasarelas: { type: array, items: { $ref: '#/components/schemas/Pasarela' } }
    CambioPasarela:
      type: object
      description: Solo lo que cambia
      properties:
        nombre: { type: string, maxLength: 40 }
        visible: { type: boolean }
        modo: { type: string, enum: [pruebas, produccion] }
    OrdenPasarelas:
      type: object
      required: [codigos]
      properties:
        codigos: { type: array, maxItems: 10, items: { type: string, enum: [pruebas, culqi, stripe] }, description: 'Todas las pasarelas, en el orden nuevo' }
    Cobro:
      type: object
      description: HU-1704 · Un cobro aprobado. Sin datos de tarjeta, solo la referencia y los 4 últimos dígitos (REQ-110).
      required: [id, solicitudId, suscripcionId, razonSocial, correoAdmin, nombrePlan, monto, moneda, pasarela, ultimos4Digitos, estado, motivoSinAlta, reembolsable, reembolsoId, reembolsadoEn, creadoEn]
      properties:
        id: { type: string, format: uuid }
        solicitudId: { type: string, format: uuid }
        suscripcionId: { type: string, format: uuid, nullable: true, description: 'null = pago aprobado sin alta (SUP-291)' }
        razonSocial: { type: string, example: Minera Andina SAC }
        correoAdmin: { type: string, format: email }
        nombrePlan: { type: string, example: Productora }
        monto: { type: number, example: 1522.2, description: Con IGV }
        moneda: { type: string, enum: [PEN, USD] }
        pasarela: { type: string, example: stripe }
        ultimos4Digitos: { type: string, nullable: true, example: '4242' }
        estado: { type: string, enum: [APROBADO, REEMBOLSADO] }
        motivoSinAlta: { type: string, nullable: true, description: 'Por qué el pago no creó la cuenta (correo en uso, monto distinto…)' }
        reembolsable: { type: boolean, description: Aprobado y sin alta }
        reembolsoId: { type: string, nullable: true }
        reembolsadoEn: { type: string, format: date-time, nullable: true }
        creadoEn: { type: string, format: date-time }
    ListaCobros:
      type: object
      required: [cobros]
      properties:
        cobros: { type: array, items: { $ref: '#/components/schemas/Cobro' } }
    PlanPublico:
      type: object
      description: HU-1702 · El plan publicado como lo ve el visitante y el resumen del pago (CP-141). Soles sin IGV salvo `precioMesConIgv`.
      required: [slug, nombre, descripcion, aMedida, precioMes, precioAnual, ahorroAnual, precioMesConIgv, precioMesUsd, precioAnualUsd, monedas, capsulasMes, usuarios, capsulaAdicional, textoBoton, destacado, caracteristicas, enlace, ajustes]
      properties:
        slug:
          type: string
          example: productora
        nombre:
          type: string
        descripcion:
          type: string
        aMedida:
          type: boolean
          description: Sin precio; el botón lleva a agendar
        precioMes:
          type: integer
          nullable: true
          example: 1390
        precioAnual:
          type: integer
          nullable: true
          example: 13344
          description: El efectivo (propio o con el descuento)
        ahorroAnual:
          type: integer
          nullable: true
          example: 3336
        precioMesConIgv:
          type: number
          nullable: true
          example: 1640.2
        precioMesUsd:
          type: integer
          nullable: true
          example: 349
          description: HU-1704 · Al mes en USD sin IGV; solo si hoy se puede pagar en dólares (el plan lo tiene y Stripe está visible y activa)
        precioAnualUsd:
          type: integer
          nullable: true
          example: 3350
          description: HU-1704 · El anual efectivo en USD sin IGV; mismo criterio
        monedas:
          type: array
          items:
            type: string
            enum: [PEN, USD]
          example: [PEN, USD]
          description: HU-1704 · Las monedas en que se puede pagar ahora; con una sola, /pago no muestra el selector
        capsulasMes:
          type: integer
          nullable: true
        usuarios:
          type: integer
          nullable: true
        capsulaAdicional:
          type: integer
          nullable: true
        textoBoton:
          type: string
        destacado:
          type: boolean
        caracteristicas:
          type: array
          items:
            type: string
          description: Solo las visibles
        enlace:
          type: string
          example: /pago?plan=productora
          description: HU-1703 · El pago (`/pago?plan=`) si el plan tiene precio; agendar una demo con el plan elegido si es a medida
        ajustes:
          $ref: '#/components/schemas/AjustesPlanes'

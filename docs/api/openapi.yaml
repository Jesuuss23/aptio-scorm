          type: string
          format: uuid
        tipo:
          type: string
          enum:
          - PDF
          - WORD
          - POWERPOINT
          - VIDEO
          - AUDIO
          - IMAGEN
          - TEMA
        recursoId:
          type: string
          format: uuid
          nullable: true

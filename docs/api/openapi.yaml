  /s/_cita:
    get:
      tags:
      - Sitio público
      summary: Página del enlace de cancelación de una cita (HU-1605)
      operationId: get_sitio_cita
      security: []
      servers:
      - url: https://{entorno}.ejemplo.local
        description: La API fuera del prefijo /api/v1 (en local, http://localhost:3000)
        variables:
          entorno:
            default: pruebas
      description: |-
        Sin sesión y sin JavaScript. El enlace del correo de invitación y de los recordatorios lleva el token de
        cancelación (`t`); la base de datos solo guarda su SHA-256 (SUP-253). La página muestra el tipo de reunión y la
        fecha con «(hora de Lima)» o «(Lima time)» en el idioma de la cita, y pide confirmar con el botón «Cancelar mi
        demo» (un formulario `POST /s/_cita`): abrir el enlace no cancela nada. Si la cita ya se canceló, ya pasó o ya
        empezó, lo dice. `noindex, nofollow`, `Cache-Control: private, no-store` y `Referrer-Policy: no-referrer`.
      parameters:
      - name: t
        in: query
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 100
      responses:
        '200':
          description: La página con la cita y el botón de confirmar (text/html)
          content:
            text/html:
              schema:
                type: string
        '404':
          description: El enlace no corresponde a ninguna cita (la página lo dice, text/html)
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - Sitio público
      summary: Confirmar la cancelación desde la página del enlace (HU-1605)
      operationId: post_sitio_cita
      security: []
      servers:
      - url: https://{entorno}.ejemplo.local
        description: La API fuera del prefijo /api/v1 (en local, http://localhost:3000)
        variables:
          entorno:
            default: pruebas
      description: |-
        Sin sesión. El formulario de la página del enlace (`application/x-www-form-urlencoded`, que la CDN debe reenviar
        al origen). Hace lo mismo que `POST /publico/citas/cancelar` y responde con la página del resultado en el idioma
        de la cita: cancelada (200), no encontrada (404), ya no activa o ya empezó (409).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [t]
              properties:
                t:
                  type: string
                  maxLength: 100
                idioma:
                  type: string
                  enum: [es, en]
      responses:
        '200':
          description: La página «Tu demo se canceló» (text/html)

            - tema
            properties:
              tiempoMs:
                type: integer
              tema:
                type: string
        marcadores:
          type: array
          description: Los marcadores propuestos, con ids provisionales («ia-N»); al aplicar toman ids nuevos
          items:
            $ref: '#/components/schemas/MarcadorVideo'
        observaciones:
          type: array
          items:
            type: string
    Observacion:

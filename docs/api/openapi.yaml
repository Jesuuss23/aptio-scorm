  /sitio/seo:
    get:
      tags:
      - Sitio web
      summary: Revisión SEO, redirecciones 301 y robots.txt (HU-1512, PNT-29)
      operationId: get_sitio_seo
      description: |-
        Solo SUPERADMIN. `problemas` es la revisión automática de las páginas y redirecciones del panel, de la más grave a
        la más leve: páginas sin meta descripción, con un título de más de 60 o una descripción de más de 160 caracteres,
        sin indexar, y redirecciones activas cuyo destino no es ninguna página (o no está publicada) o que una página
        publicada deja sin usar. Cada problema trae `paginaId` o `redireccionId` para corregirlo. `robotsVistaPrevia` es el
        robots.txt que tendrá el sitio con «Publicar cambios» en el entorno actual.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    patch:
      tags:
      - Sitio web
      summary: Guardar las reglas extra de robots.txt (HU-1512)
      operationId: patch_sitio_seo
      description: |-
        Solo SUPERADMIN. Una regla por línea: `Allow: /ruta`, `Disallow: /ruta` o un comentario con `#` (hasta 50). No se
        aceptan `Disallow: /` ni `Disallow: /*`, `User-agent`, `Sitemap` ni HTML: esas líneas las pone el sistema. Se
        guardan normalizadas y van dentro del grupo `User-agent: *` en producción (en pruebas robots.txt sigue
        bloqueando todo). Llegan al sitio con «Publicar cambios». Auditoría SITIO_ROBOTS_EDITADO. 422 NO_VALIDO con la
        línea de cada error en `detalles` (campo `robotsExtra.{n}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeoCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/seo/redirecciones:
    post:
      tags:
      - Sitio web
      summary: Agregar una redirección 301 (HU-1512, CP-124)
      operationId: post_sitio_seo_redirecciones
      description: |-
        Solo SUPERADMIN. `desde` y `hacia` son rutas internas en minúsculas (se guardan sin / final); el inicio no se
        redirige. 409 REDIRECCION_REPETIDA si ya hay una desde ese origen. 422 REDIRECCION_INVALIDA,
        REDIRECCION_A_SI_MISMA, REDIRECCION_EN_BUCLE (A → B y B → A), REDIRECCION_EN_CADENA (A → B y B → C, o C → A y
        A → B, con las activas) o REDIRECCION_PISA_PAGINA (el origen es una página publicada), con `detalles`; una
        inactiva no se compara con las páginas ni forma cadenas. Hasta 500 (422 LIMITE_REDIRECCIONES). Llega al sitio
        con «Publicar cambios»: `GET /s/{desde}` responde 301 a `/s/{hacia}`. Auditoría SITIO_REDIRECCION_CREADA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedireccionEntrada'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedireccionSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'

        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Borrar una redirección 301 (HU-1512)
      operationId: delete_sitio_seo_redireccion
      description: Solo SUPERADMIN. Al publicar, la ruta de origen vuelve a dar la 404. Auditoría SITIO_REDIRECCION_BORRADA.
      responses:
        '204':
          description: Borrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /sitio/seo-ia:
    get:
      tags:
      - Sitio web
      summary: SEO para IA — llms.txt, rastreadores, preguntas objetivo y sugerencias (HU-1513, PNT-30)
      operationId: get_sitio_seo_ia
      description: |-
        Solo SUPERADMIN. `rastreadores` es el catálogo cerrado (GPTBot, ClaudeBot, Google-Extended, PerplexityBot y
        CCBot) con `permitido`; todos se permiten por defecto. `preguntas` trae la marca de cada asistente
        (`si`, `no` o `sin_revisar`), que el superadmin pone a mano: no hay comprobación automática. `propuestas` son
        solo las pendientes. `paginasFaq` cuenta las páginas publicadas con datos estructurados FAQPage.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeoIaSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    patch:
      tags:
      - Sitio web
      summary: Guardar llms.txt o permitir y bloquear rastreadores de IA (HU-1513, CP-126)
      operationId: patch_sitio_seo_ia
      description: |-
        Solo SUPERADMIN. `llmsTxt` es texto plano de hasta 20 000 caracteres, sin HTML; vacío quita el archivo (el sitio

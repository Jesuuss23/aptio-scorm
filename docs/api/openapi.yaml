        correcciones:
          type: array
          description: HU-1002 · Los cambios de una propuesta `alineacion` (IA-17), para mostrarlos antes de aplicar. Su
            `cambios` es un JSON Patch con rutas desde la raíz del curso.
          items:
            $ref: '#/components/schemas/CorreccionAlineacion'
        patron:
          $ref: '#/components/schemas/PatronPropuesto'
        pausas:
          $ref: '#/components/schemas/PausasPropuestas'
        versionBase:
          type: integer
        estado:
          type: string
          enum:
          - PENDIENTE
          - APLICADA
          - DESCARTADA
          - VENCIDA
        costoUsd:
          type: number
        creadoEn:
          type: string
          format: date-time
    AplicarPropuesta:
      type: object
      properties:
        varianteIndice:
          type: integer
          minimum: 0

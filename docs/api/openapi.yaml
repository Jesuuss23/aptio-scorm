  /cursos/{cursoId}/propuestas:
    post:
      tags:
      - Asistente IA
      summary: Pedir una propuesta a la IA
      operationId: post_cursos_cursoId_propuestas
      description: Más visual, menos texto, actividad, variantes, ilustración, pedido libre, alineación, patrón, pausas de video.
        HU-0504 (SUP-39) · En el S5 se calculan mas-visual, menos-texto, actividad, variantes y libre sobre una pantalla
        (`pantallaId` obligatorio; `pedido` obligatorio en libre); los demás tipos responden 422 TIPO_NO_DISPONIBLE.
        Encola IA-16 en la cola ia; el `id` es el TrabajoIA (`GET /trabajos/{id}`) y la propuesta aparece en
        `GET /cursos/{cursoId}/propuestas` cuando termina. Los editores de pantallas piden; el revisor del cliente, no (403).
        HU-1002 · `alineacion` es del curso entero, sin `pantallaId`, y encola IA-17 v2 en la cola ia con las alertas
        vigentes; 422 SIN_ALERTAS si el curso no tiene alertas; solo administración y diseño instruccional (403 al resto).
        HU-1104 · `patron` también es del curso entero y encola IA-14 v2 con el contexto del curso (duración, público,
        dispositivo, actividades, gamificación y estaciones del mapa). `modo` es obligatorio (422 MODO_REQUERIDO);
        `recomendar` elige un patrón del catálogo con una alternativa; `crear` arma un patrón personalizado a partir de
        `descripcion`, obligatoria en ese modo (422 DESCRIPCION_VACIA). Solo administración y diseño instruccional (403 al resto).
        HU-0903 · `pausas-video` es de una pantalla con video (`pantallaId` obligatorio, 422 PANTALLA_REQUERIDA; 422
        BLOQUE_NO_EXISTE si no tiene video) y encola IA-09 v2 en la cola ia con la transcripción del video, la del material
        del cliente del mismo recurso, ya transcrito (HU-0305). Sin ella, 422 SIN_TRANSCRIPCION («Transcribe el video en
        Material del cliente»). La propuesta trae en `pausas` los cambios de tema, los marcadores propuestos (al menos uno
        por cambio de tema, ninguno en mitad de una frase) y las observaciones. Piden los editores de pantallas.
      parameters:
      - name: cursoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropuestaSolicitud'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo202'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    get:
      tags:

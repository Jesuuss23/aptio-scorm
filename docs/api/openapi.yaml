              id:
                type: string
              nombre:
                type: string
              bytes:
                type: integer
        suspendDataCaracteres:
          type: integer
          nullable: true
          description: Peor caso de cmi.suspend_data v2 (límite 4096; si se pasa, advertencia); null en HTML
        pantallasTotal:
          type: integer
        pantallasSinAprobar:
          type: integer
          description: Advertencia (RN-12-3); la web pide confirmación al exportar
        recursosFaltantes:
          type: array
          items:
            type: string
        creditos:
          type: object
          allOf:

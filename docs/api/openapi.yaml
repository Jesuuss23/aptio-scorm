openapi: 3.0.3
info:
  title: Aptio SCORM · API
  version: 0.2.0
  license:
    name: Propietario · Grupo de Soluciones Creativas SAC
  description: 'API REST del generador de SCORM con IA. Prefijo /api/v1. Las tareas largas (generación, IA, voz, exportación) responden 202 con
    un trabajo y avisan por eventos (SSE). La IA nunca cambia el curso sin una acción del usuario: crea propuestas.'
servers:
- url: http://localhost:3000/api/v1
  description: Local
- url: https://{entorno}.ejemplo.local/api/v1
  description: Pruebas
  variables:
    entorno:
      default: pruebas
security:
- cookieSesion: []
tags:
- name: Acceso
  description: Sesión con correo y clave o con Google, recuperación de clave, usuarios y roles
- name: Clientes y kits
  description: Clientes, kit de marca, pantallas modelo, glosario, pronunciación y fichas LMS (M02)
- name: Proyectos
  description: Proyectos y material del cliente (M03)
- name: Recursos
  description: 'Archivos en S3: subida, biblioteca e imágenes generadas'
- name: Generación
  description: Generador del SCORM y sus 11 etapas (M04)
- name: Curso
  description: Documento del curso, versiones y cambios del editor (M05, M06)
- name: Asistente IA
  description: Propuestas de la IA que el usuario aplica o descarta
- name: Revisión
  description: Control de calidad, observaciones y comentarios (M05)
- name: Personaje y voz
  description: Narración, boca sincronizada y audio del cliente (M07)
- name: Idiomas
  description: Traducción y revisión ES/EN (M08)
- name: Alineación y navegación
  description: Alineación pedagógica, patrones de navegación y vista previa (M10, M11)
- name: Entrega
  description: Validación y exportación SCORM, HTML y kit de gamificación (M12)
- name: Costos y rentabilidad
  description: Costos de IA, parámetros y mediciones (M13)
- name: Conexiones IA
  description: Proveedor y modelo por tarea (M13)
- name: Plataforma
  description: Salud del servicio y operación (M15)
paths:
  /salud:
    get:
      tags:
      - Plataforma
      summary: Salud de la API y de la base de datos (CP-001)
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /eventos:
    get:
      tags:
      - Plataforma
      summary: Avance de los trabajos de la organización en vivo (SSE, CP-016)
      operationId: get_eventos
      description: 'text/event-stream. `event: trabajo` con un EventoTrabajo en cada cambio de estado o avance; `event: latido` cada 15 s. Solo los trabajos de la organización de la sesión. Equipo de producción (no REVISOR_CLIENTE ni SUPERADMIN).'
      responses:
        '200':
          description: Flujo de eventos
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventoTrabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /trabajos/simulados:
    post:
      tags:
      - Plataforma
      summary: Encolar un trabajo simulado
      operationId: post_trabajos_simulados
      description: 'Encola un trabajo que el worker responde con la salida grabada del caso LOTO (modo simulado). Sirve para probar colas y eventos sin gastar. Solo existe con PROVEEDORES_MODO=simulado (404 en otro caso). 422 TAREA_DESCONOCIDA si no hay salida grabada.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tarea
              properties:
                tarea:
                  type: string
                  pattern: ^(IA-\d\d|VOZ|BOCA)$
                  example: IA-04
      responses:
        '202':
          description: Encolado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /trabajos/{trabajoId}:
    get:
      tags:
      - Plataforma
      summary: Estado de un trabajo
      operationId: get_trabajos_trabajoId
      parameters:
      - name: trabajoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /auth/ingresar:
    post:
      tags:
      - Acceso
      summary: Iniciar sesión
      operationId: post_auth_ingresar
      description: Cookie httpOnly; 5 intentos fallidos bloquean 15 min
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ingreso'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '422':
          $ref: '#/components/responses/NoValido'
        '401':
          description: 'CREDENCIALES (correo o clave incorrectos, misma respuesta exista o no el correo) o CUENTA_BLOQUEADA'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/salir:
    post:
      tags:
      - Acceso
      summary: Cerrar sesión
      operationId: post_auth_salir
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /auth/google:
    get:
      tags:
      - Acceso
      summary: Ingresar con Google
      operationId: get_auth_google
      description: >-
        HU-0108. Redirige a Google (OpenID Connect, código de autorización con PKCE S256, state y nonce guardados en la
        cookie firmada `google_oidc` de 10 minutos). Solo ingresan correos ya invitados por un administrador; no crea
        cuentas nuevas. Sin GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET redirige a `/ingresar?error=google_no_disponible`.
      responses:
        '302':
          description: Redirección a Google, o a la web con el motivo
      security: []
  /auth/google/callback:
    get:
      tags:
      - Acceso
      summary: Retorno de Google
      operationId: get_auth_google_callback
      description: >-
        Valida state (contra la cookie de la ida), canjea el código con el verificador PKCE, verifica la firma RS256 del
        id_token con las claves de Google, el emisor, la audiencia, el vencimiento y el nonce, y exige email_verified
        (CP-009). Busca al usuario por el identificador de Google o, la primera vez, por correo, y lo vincula (CP-007).
        Si sale bien crea la cookie de sesión y redirige a la web; si no, redirige a `/ingresar?error=<motivo>` con
        sin_acceso (correo no invitado, usuario desactivado o correo ya vinculado a otra cuenta de Google, CP-008),
        correo_no_verificado, google_cancelado o google_fallo. Nunca crea cuentas.
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Lo envía Google si la persona cancela (access_denied).
        schema:
          type: string
      responses:
        '302':
          description: Redirección a la web, con sesión o con `?error=<motivo>`
      security: []
  /auth/clave/olvido:
    post:
      tags:
      - Acceso
      summary: Pedir cambio de clave
      operationId: post_auth_clave_olvido
      description: 'Envía un enlace de un solo uso por correo (vence en 60 min). Responde 202 exista o no el correo. Límite: 3 pedidos por hora.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudClave'
      responses:
        '202':
          description: Sin contenido
        '422':
          $ref: '#/components/responses/NoValido'
      security: []
  /auth/clave/restablecer:
    post:
      tags:
      - Acceso
      summary: Restablecer clave
      operationId: post_auth_clave_restablecer
      description: Crea la clave desde una invitación o la restablece. Invalida el token y cierra las otras sesiones del usuario. 422 ENLACE_NO_VALIDO si el enlace ya se usó o venció.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaClave'
      responses:
        '204':
          description: Sin contenido
        '422':
          $ref: '#/components/responses/NoValido'
      security: []
  /yo:
    get:
      tags:
      - Acceso
      summary: Usuario actual
      operationId: get_yo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /usuarios:
    get:
      tags:
      - Acceso
      summary: Listar usuarios
      operationId: get_usuarios
      description: Solo ADMINISTRADOR
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
      - Acceso
      summary: Crear usuario
      operationId: post_usuarios
      description: Solo ADMINISTRADOR. Crea el usuario sin clave y le envía una invitación con enlace de un solo uso (60 min). 409 CORREO_EN_USO si el correo ya existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEntrada'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /usuarios/{usuarioId}:
    patch:
      tags:
      - Acceso
      summary: Cambiar rol o desactivar
      operationId: patch_usuarios_usuarioId
      description: Solo ADMINISTRADOR, dentro de su organización (404 si el usuario es de otra). No puede desactivarse ni quitarse el rol a sí mismo.
      parameters:
      - name: usuarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /clientes:
    get:
      tags:
      - Clientes y kits
      summary: Listar clientes
      operationId: get_clientes
      description: Clientes activos de la organización, por nombre. El revisor del cliente solo ve el suyo. `buscar` filtra por nombre sin distinguir mayúsculas.
      parameters:
      - name: buscar
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
      - Clientes y kits
      summary: Crear cliente
      operationId: post_clientes
      description: ADMINISTRADOR, DISENADOR_INSTRUCCIONAL o PRODUCTOR. Solo el nombre es obligatorio; idiomas por defecto ['es']. 409 CLIENTE_EXISTE si ya hay uno con el mismo nombre en la organización.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteEntrada'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /clientes/{clienteId}:
    get:
      tags:
      - Clientes y kits
      summary: Ver cliente
      operationId: get_clientes_clienteId
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags:
      - Clientes y kits
      summary: Editar cliente
      operationId: patch_clientes_clienteId
      description: ADMINISTRADOR, DISENADOR_INSTRUCCIONAL o PRODUCTOR.
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /clientes/{clienteId}/kit:
    get:
      tags:
      - Clientes y kits
      summary: Ver kit de marca
      operationId: get_clientes_clienteId_kit
      description: >-
        Incluye el contraste calculado y las advertencias. 404 SIN_KIT si el cliente todavía no tiene kit.
        Lo ven administración, diseño instruccional, diseño gráfico y producción; el revisor del cliente no.
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitMarca'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags:
      - Clientes y kits
      summary: Guardar kit de marca
      operationId: put_clientes_clienteId_kit
      description: >-
        Crea el kit con version 0 o lo actualiza con la versión leída. 409 KIT_DESACTUALIZADO si otra persona
        guardó antes (RN-02-3). Un contraste bajo no bloquea: vuelve en `advertencias` (RN-02-2).
        Lo guardan administración, diseño instruccional y diseño gráfico. El personaje se sube aparte (HU-0203).
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KitMarcaEntrada'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitMarca'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
        '409':
          $ref: '#/components/responses/Conflicto'
  /clientes/{clienteId}/kit/personaje:
    put:
      tags:
      - Clientes y kits
      summary: Guardar personaje del kit
      operationId: put_clientes_clienteId_kit_personaje
      description: >-
        Asigna al kit un SVG ya subido y saneado (HU-0203). Revisa las capas de docs/20-guia-diseno.md: guarda
        qué bocas tiene, cuáles faltan y con cuál se reemplazan (G por B, H por C; CP-023). Sin las capas
        obligatorias o con más de 200 KB responde 422 PERSONAJE_INCOMPLETO. Usa la versión del kit (409 si cambió).
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - recursoId
              - nombre
              - version
              properties:
                recursoId:
                  type: string
                  format: uuid
                nombre:
                  type: string
                  example: Ana
                version:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KitMarca'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'
  /clientes/{clienteId}/kit/extraer:
    post:
      tags:
      - Clientes y kits
      summary: Extraer kit de un curso o logo (IA)
      operationId: post_clientes_clienteId_kit_extraer
      description: Devuelve una propuesta de kit para revisar
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropuestaSolicitud'
      responses:
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo202'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /clientes/{clienteId}/kit/pantallas-modelo:
    get:
      tags:
      - Clientes y kits
      summary: Listar pantallas modelo
      operationId: get_clientes_clienteId_kit_pantallas_modelo
      description: Roles ADMINISTRADOR, DISENADOR_INSTRUCCIONAL, DISENADOR_GRAFICO y PRODUCTOR. Lista vacía si el cliente aún no tiene kit (se usa el estilo base, RN-02-5).
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: activas
        in: query
        required: false
        description: true devuelve solo las activas
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PantallaModelo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags:
      - Clientes y kits
      summary: Agregar pantalla modelo
      operationId: post_clientes_clienteId_kit_pantallas_modelo
      description: Rol DISENADOR_GRAFICO o ADMINISTRADOR. 404 con código SIN_KIT si el cliente no tiene kit guardado; 422 con código DEFINICION_NO_VALIDA y un detalle por error de la definición.
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantallaModeloEntrada'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantallaModelo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /clientes/{clienteId}/kit/pantallas-modelo/{modeloId}:
    put:
      tags:
      - Clientes y kits
      summary: Editar pantalla modelo
      operationId: put_clientes_clienteId_kit_pantallas_modelo_modeloId
      description: Rol DISENADOR_GRAFICO o ADMINISTRADOR. La disposición no cambia.
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: modeloId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantallaModeloEntrada'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantallaModelo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Clientes y kits
      summary: Desactivar pantalla modelo
      operationId: delete_clientes_clienteId_kit_pantallas_modelo_modeloId
      description: Rol DISENADOR_GRAFICO o ADMINISTRADOR. Borrado lógico (activa = false); la disposición vuelve al estilo base si no queda otro modelo activo.
      parameters:
      - name: clienteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: modeloId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Sin contenido
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /clientes/{clienteId}/glosario:
    get:
      tags:
      - Clientes y kits
      summary: Ver glosario
      operationId: get_clientes_clienteId_glosario

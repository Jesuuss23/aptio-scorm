      properties:
        formato:
          type: string
          enum:
          - SCORM12
          - SCORM2004
          - HTML
          - JSON
          - KIT_GAMIFICACION
          description: SCORM12, HTML (HU-1203, carpeta autocontenida sin LMS ni seguimiento, `<proyecto>-html-v<n>.zip`) o KIT_GAMIFICACION (HU-1205, solo al exportar; `validar` responde 422); los demás responden 422 FORMATO_NO_DISPONIBLE
        perfilLms:
          type: string
          enum:
          - generico
          - moodle
          - blackboard
          - chamilo
          - canvas
          default: generico
          description: Solo agrega recomendaciones. En HTML se ignora y se guarda generico. En KIT_GAMIFICACION es el LMS de la guía; sin él, el LMS del cliente según los datos técnicos del proyecto
        modoIdioma:
          type: string
          enum:
          - unico
          - separados
          - mismo-paquete
          default: unico
          description: HU-0804 · unico es el primer idioma del curso; mismo-paquete lleva español e inglés con el botón de idioma; separados responde 422 IDIOMA_NO_DISPONIBLE
        incluirDiagnostico:
          type: boolean
          default: true
          description: HU-1204. Modo diagnóstico en el paquete (Ctrl+Alt+Shift+D o ?diagnostico=1, nunca se abre solo); con false no responde a ninguno. En HTML no hay modo diagnóstico (se guarda false)
        incluirInforme:
          type: boolean
          default: true
    Validacion:
      type: object

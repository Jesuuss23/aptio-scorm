      - motivo
      properties:
        patron:
          type: string
          enum:
          - clasico
          - historias
          - vertical
          - mapa
          - hub
          - ramificado
          - inmersivo
          - personalizado
        motivo:
          type: string
    PatronPropuesto:
      type: object
      description: HU-1104 · Lo que trae una propuesta `patron` (salida de IA-14 v2, ya validada).
      required:
      - modo
      - navegacion
      - recomendado
      - alternativa
      properties:
        modo:
          type: string
          enum:
          - recomendar
          - crear
        navegacion:
          type: object
          additionalProperties: true
          description: La navegación propuesta; al aplicar solo se toman `patron` y `patronPersonalizado` (RN-11-1)
        recomendado:
          $ref: '#/components/schemas/PatronOpcion'
        alternativa:
          $ref: '#/components/schemas/PatronOpcion'
        descripcion:
          type: string
          nullable: true
          description: La descripción pedida en modo crear
    CorreccionAlineacion:
      type: object
      description: HU-1002 · Un cambio de la corrección de la alineación (salida de IA-17 v2).
      required:
      - tipo
      - objetivoId
      - nivelBloom
      - motivo
      properties:
        tipo:
          type: string
          enum:
          - nueva-pregunta
          - nueva-pantalla
          - ajustar-pregunta
          - ajustar-objetivo
        objetivoId:
          type: string
        nivelBloom:
          $ref: '#/components/schemas/NivelBloom'
        motivo:
          type: string
        pantallaId:
          type: string
          description: La pantalla que se toca o se crea
        preguntaId:
          type: string
    Propuesta:
      type: object
      required:
      - id
      - tipo
      - titulo
      - cambios
      - versionBase
      - estado
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
        pantallaId:
          type: string
          nullable: true
        titulo:
          type: string
        descripcion:
          type: string
        cambios:
          $ref: '#/components/schemas/JsonPatch'
        vistaPrevia:
          type: array
          items:

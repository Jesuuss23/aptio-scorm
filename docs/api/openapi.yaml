      summary: Validar antes de exportar
      operationId: post_cursos_cursoId_validar
      description: 'HU-1201. Nunca bloquea por tamaño (RN-12-2): responde 200 con errores (esquema) y advertencias. Formatos SCORM12 y HTML (HU-1203; en HTML no hay límite de subida ni suspend_data: limiteMb, origenLimite y suspendDataCaracteres vienen en null). HU-0804 · Con modoIdioma mismo-paquete valida español e inglés juntos: si falta un texto en inglés, el error «Faltan N textos en inglés: tradúcelos en Idiomas» (textosIngles da la cuenta); los desbordes y la falta de voz en inglés solo advierten, y el peso suma los recursos de los dos idiomas. 422 FORMATO_NO_DISPONIBLE o IDIOMA_NO_DISPONIBLE (modoIdioma separados); 403 al revisor del cliente.'

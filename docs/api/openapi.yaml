    post:
      tags:
      - Sitio público
      summary: Enviar el token de Culqi Checkout para crear el cargo (HU-1704)
      operationId: post_publico_checkout_id_token
      security: []
      description: |-
        Sin sesión. El formulario incrustado de Culqi devuelve un token de un solo uso; con él la API crea el cargo en
        Culqi (POST /v2/charges con la llave secreta del servidor). El pago sigue PENDIENTE hasta el webhook firmado: la
        respuesta solo confirma que se envió. 404 si la solicitud no existe o no es de Culqi; 409 si ya no está pendiente;
        402 PAGO_RECHAZADO si Culqi rechaza la tarjeta (la solicitud pasa a RECHAZADA); 502 PASARELA_NO_RESPONDE.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPago'
      responses:
        '202':
          description: Cargo enviado; el estado sigue pendiente hasta el webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCheckout'
        '402':
          description: PAGO_RECHAZADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La solicitud ya no está pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/NoValido'
        '502':
          description: PASARELA_NO_RESPONDE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/pago/{pasarela}:
    post:
      tags:
      - Ventas
      summary: Evento de una pasarela de pago (HU-1703, HU-1704, RN-18-3, CP-143, CP-144, CP-145)
      operationId: post_webhooks_pago_pasarela
      security: []
      description: |-
        Sin sesión; firmado con el secreto de webhook de la pasarela y su modo, sobre el cuerpo tal como llega (hasta
        64 KB). Si la firma no coincide, 401 FIRMA_NO_VALIDA y no cambia nada (CP-145, auditoría PAGO_FIRMA_NO_VALIDA).
        `pasarela` es `pruebas` (solo con SITIO_ENTORNO=pruebas; `X-Aptio-Firma: sha256=<hex>`; cuerpo `{ id, tipo:
        pago.aprobado | pago.rechazado, solicitudId, ultimos4?, motivo?, monto?, moneda? }`), `stripe` (`Stripe-Signature`
        `t=,v1=` con 5 minutos de tolerancia; checkout.session.completed y async_payment_succeeded aprueban si está
        pagado, async_payment_failed y expired rechazan) o `culqi` (`X-Culqi-Signature`, supuesto SUP-294;
        charge.creation.succeeded y failed). Los demás tipos responden 200 con `ignorado: true`. 404 si la pasarela no
        existe o no está activa.

        Idempotente (RN-18-3): un evento se procesa una sola vez (`eventoPagoId` único); si el evento ya se procesó o la
        solicitud ya no está pendiente, responde 200 con `duplicado: true` sin crear nada. Pago rechazado: la solicitud
        pasa a RECHAZADA con el motivo. Pago aprobado: en una sola transacción crea la organización vacía (nombre y RUC de
        la solicitud), su ADMINISTRADOR sin clave, la suscripción ACTIVA con el precio pactado sin IGV y el fin del período
        (un mes o un año), y el lead de origen «Suscripción» en etapa Ganado; después encola en `suscripciones` el correo
        de bienvenida con el enlace para crear la clave (72 h, un solo uso) y avisa del lead. Auditoría SUSCRIPCION_CREADA,
        PAGO_RECHAZADO y PAGO_FIRMA_NO_VALIDA.

        HU-1704 · Cada pago aprobado guarda un Cobro (monto con IGV, moneda, pasarela, referencia y 4 últimos dígitos,
        `eventoPagoId` único) y encola en `comprobantes` la tarea «emitir-comprobante» con jobId = id del cobro (CP-144;
        la emite la HU-1707). Si el monto o la moneda no coinciden con la solicitud (PAGO_MONTO_NO_COINCIDE), el correo ya
        tiene cuenta (SUSCRIPCION_SIN_ALTA) o la solicitud ya no estaba pendiente (PAGO_SIN_SOLICITUD_PENDIENTE), el
        cobro queda sin alta para que el superadmin lo reembolse.
      parameters:
      - name: pasarela
        in: path
        required: true
        schema:
          type: string
          enum: [pruebas, culqi, stripe]
          example: pruebas
      - name: X-Aptio-Firma
        in: header
        required: false
        description: 'pruebas: `sha256=` y el HMAC-SHA256 en hexadecimal del cuerpo'
        schema:
          type: string
          example: sha256=6b1c…
      - name: Stripe-Signature
        in: header
        required: false
        description: 'stripe: `t=<segundos>,v1=<HMAC-SHA256 de "t.cuerpo">`'
        schema:
          type: string
      - name: X-Culqi-Signature
        in: header
        required: false
        description: 'culqi: HMAC-SHA256 en hexadecimal del cuerpo (supuesto SUP-294)'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Procesado, o repetido sin efecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRecibido'
        '401':
          description: FIRMA_NO_VALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '413':
          description: DEMASIADO_GRANDE · más de 64 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: EVENTO_NO_VALIDO · el evento no tiene la forma esperada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: sesion
  responses:
    NoAutenticado:
      description: Sin sesión
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol no permite la acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: >-
        No existe, o es de otra organización (HU-1701, RN-18-1): la respuesta es la misma en los dos casos y no confirma
        que el id exista. Si algún id de la ruta es de otra organización, queda ACCESO_OTRA_ORGANIZACION en la auditoría
        de plataforma (sin organización; la ve solo SUPERADMIN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoValido:
      description: Datos no válidos (incluye errores del esquema del curso)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Versión desactualizada o trabajo en curso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DemasiadasSolicitudes:
      description: Más de 60 peticiones por minuto desde la misma IP en `/publico/*` (DEMASIADAS_SOLICITUDES, con Retry-After)
      headers:
        Retry-After:
          description: Segundos hasta que se abre la siguiente ventana
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaginaSitio:
      description: La página en HTML, sin JavaScript
      headers:
        ETag:
          $ref: '#/components/headers/ETagSitio'
        Cache-Control:
          $ref: '#/components/headers/CacheSitio'
      content:
        text/html:
          schema:
            type: string
    PaginaSitioNoEncontrada:
      description: |-
        La página 404 en HTML (noindex): no hay ninguna versión pre-renderizada, la ruta no está publicada o no es válida.
      headers:
        Cache-Control:
          description: public, max-age=0, s-maxage=30
          schema:
            type: string
      content:
        text/html:
          schema:
            type: string
    SitioEnMantenimiento:
      description: HU-1509 · Modo mantenimiento activo (CP-121). La página «Volvemos pronto» en HTML (noindex), con el aviso de los ajustes.
      headers:
        Retry-After:
          description: Segundos sugeridos para volver a intentar (600)
          schema:
            type: integer
        Cache-Control:
          description: private, no-store
          schema:
            type: string
      content:
        text/html:
          schema:
            type: string
  parameters:
    OrigenLead:
      name: origen
      in: query
      description: HU-1601 · Solo los leads de este origen
      schema:
        type: string
        enum: [formulario, popup, chatbot, agendador, suscripcion, boletin, asistente_ia]
    EtapaLead:
      name: etapa
      in: query
      description: HU-1601 · Solo los leads en esta etapa del embudo
      schema:
        type: string
        enum: [NUEVO, CONTACTADO, DEMO, PROPUESTA, GANADO, PERDIDO]
    IdiomaSitio:
      name: idioma
      in: query
      required: false
      description: HU-1510 · Idioma del contenido o de la navegación; cada idioma tiene su orden
      schema:
        $ref: '#/components/schemas/IdiomaSitio'
    SiNoCoincide:
      name: If-None-Match
      in: header
      required: false
      description: La ETag que el navegador ya tiene; si coincide, 304
      schema:
        type: string
  headers:
    ETagSitio:
      description: sha1 del contenido en base64url, entre comillas
      schema:
        type: string
    CacheSitio:
      description: 'Páginas: public, max-age=0, s-maxage=60, must-revalidate. Fuentes: public, max-age=31536000, immutable.'
      schema:
        type: string
  schemas:
    PaginaSitio:
      type: object
      description: Página del sitio comercial (M16). Bloques (HU-1503), landings por sector (HU-1514) y SEO de la página (HU-1512).
      required:
      - id
      - ruta
      - idioma
      - titulo
      - estado
      - publicarEn
      - publicadaEn
      - creadoEn
      - actualizadoEn
      - tipo
      - sector
      - portada
      - metaTitulo
      - blogCategoriaInicial
      - metaDescripcion
      - canonical
      - indexar
      - datosEstructurados
      properties:
        tipo:
          type: string
          enum:
          - general
          - sector
          description: HU-1514 · `sector` es una landing por sector
        sector:
          type: string
          nullable: true
          maxLength: 60
          example: Minería y energía
          description: HU-1514 · Nombre del sector; con él se eligen los testimonios (sin mayúsculas ni espacios de más)
        portada:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/PortadaSector'
        metaTitulo:
          type: string
          nullable: true
          maxLength: 60
          description: HU-1512 · El `<title>` de la página (en una landing, obligatorio para publicar, RN-16-9); null = el título con el nombre del sitio
        metaDescripcion:
          type: string
          nullable: true
          maxLength: 160
          description: HU-1512 · null = el texto general del sitio
        canonical:
          type: string
          nullable: true
          example: /precios
          description: HU-1512 · Ruta interna o https://; null = la de la página en el dominio publicado
        indexar:
          type: boolean
          description: HU-1512 · false = noindex, fuera del sitemap y sin hreflang (CP-125)
        datosEstructurados:
          type: string
          enum:
          - WebPage
          - FAQPage
          - Product
          description: HU-1512 · Tipo del JSON-LD de la página; FAQPage usa sus preguntas visibles
        blogCategoriaInicial:
          type: string
          nullable: true
          maxLength: 60
          description: HU-1514 · Categoría con que empieza filtrado el bloque Blog (se usa con la HU-1511)
        id:
          type: string
          format: uuid
        ruta:
          type: string
          example: /precios
        idioma:
          type: string
          enum:
          - es
          - en
        titulo:
          type: string
        estado:
          type: string
          enum:
          - BORRADOR
          - PROGRAMADA
          - PUBLICADA
        publicarEn:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se publica sola (solo PROGRAMADA)
        publicadaEn:
          type: string
          format: date-time
          nullable: true
          description: Última vez que pasó a PUBLICADA
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
        avisoFicticios:
          type: integer
          minimum: 1
          description: HU-1505 · Solo al publicar en pruebas con datos ficticios visibles (CP-117)
        version:
          type: integer
          minimum: 1
          description: HU-1507 · Si el cambio publicó o retiró la página, la versión del sitio que creó
        redireccion:
          type: object
          description: HU-1512 · Al cambiar la ruta de una publicada, la redirección 301 que se creó sola
          required:
          - id
          - desde
          - hacia
          properties:
            id:
              type: string
              format: uuid
            desde:
              type: string
              example: /precios-2025
            hacia:
              type: string
              example: /precios
        avisoRedireccion:
          type: string
          description: HU-1512 · Al cambiar la ruta de una publicada, qué pasó con la redirección 301
    PortadaSector:
      type: object
      description: HU-1514 · La portada propia de una landing por sector
      required:
      - titulo
      - texto
      properties:
        titulo:
          type: string
          maxLength: 120
        texto:
          type: string
          maxLength: 300
    PortadaSectorCambio:
      type: object
      additionalProperties: false
      description: HU-1514 · Lo que no se manda se conserva; un texto vacío se borra; `portada=null` la borra entera
      properties:
        titulo:
          type: string
          nullable: true
          maxLength: 120
        texto:
          type: string
          nullable: true
          maxLength: 300
    PaginaSitioEntrada:
      type: object
      additionalProperties: false
      description: '`ruta` y `titulo` son obligatorios salvo en una landing (`tipo=sector`), que pide `sector`.'
      properties:
        tipo:
          type: string
          enum:
          - general
          - sector
          default: general
        sector:
          type: string
          maxLength: 60
          description: HU-1514 · Obligatorio con tipo=sector
        portada:
          $ref: '#/components/schemas/PortadaSectorCambio'
        metaTitulo:
          type: string
          nullable: true
          maxLength: 60
        blogCategoriaInicial:
          type: string
          nullable: true
          maxLength: 60
        ruta:
          type: string
          maxLength: 200
          pattern: ^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$
          example: /precios
        idioma:
          type: string
          enum:
          - es
          - en
          default: es
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        accion:
          $ref: '#/components/schemas/AccionPagina'
        publicarEn:
          type: string
          format: date-time
          example: '2026-11-20T09:00:00-05:00'
          description: Solo con accion=programar; con zona horaria
    PaginaSitioCambio:
      type: object
      additionalProperties: false
      properties:
        ruta:
          type: string
          maxLength: 200
          pattern: ^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$
          description: HU-1512 · En una página PUBLICADA crea sola la redirección 301 de la ruta anterior a la nueva
        sector:
          type: string
          maxLength: 60
          description: HU-1514 · Solo landings; la ruta no cambia
        portada:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/PortadaSectorCambio'
        metaTitulo:
          type: string
          nullable: true
          maxLength: 60
        blogCategoriaInicial:
          type: string
          nullable: true
          maxLength: 60
        metaDescripcion:
          type: string
          nullable: true
          maxLength: 160
          description: HU-1512 · Texto plano; vacío guarda null
        canonical:
          type: string
          nullable: true
          maxLength: 300
          example: /precios
          description: HU-1512 · Ruta interna o https:// con dominio; vacío guarda null
        indexar:
          type: boolean
          description: HU-1512 · false = noindex, fuera del sitemap y sin hreflang (CP-125)
        datosEstructurados:
          type: string
          enum:
          - WebPage
          - FAQPage
          - Product
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        accion:
          $ref: '#/components/schemas/AccionPagina'
        publicarEn:
          type: string
          format: date-time
          example: '2026-11-20T09:00:00-05:00'
          description: Solo con accion=programar; con zona horaria y en el futuro
    AccionPagina:
      type: string
      enum:
      - borrador
      - programar
      - publicar
      description: borrador (limpia publicarEn), programar (exige publicarEn futuro) o publicar (ahora)
    TipoBloque:
      type: string
      description: Catálogo cerrado de bloques del sitio (HU-1503, `@aptio/schema/sitio-bloques`)
      enum:
      - hero
      - confianza
      - metricas
      - logos
      - pasos
      - funcionalidades
      - lms
      - planes
      - testimonios
      - faq
      - cta
      - fhero
      - comparacion
      - precios
      - comparativa
      - bloglista
      - sectores
      - agendador
    BloqueSitio:
      type: object
      required:
      - id
      - paginaId
      - tipo
      - orden
      - visible
      - ajustes
      - creadoEn
      - actualizadoEn
      properties:
        id:
          type: string
          format: uuid
        paginaId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoBloque'
        orden:
          type: integer
          minimum: 0
          description: Posición 0, 1, 2… sin huecos
        visible:
          type: boolean
          description: Nace en false (RN-16-2)
        ajustes:
          type: object
          nullable: true
          additionalProperties: true
          description: Datos propios del bloque; ocultarlo no los borra (CP-112)
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    BloqueSitioEntrada:
      type: object
      additionalProperties: false
      required:
      - tipo
      properties:
        tipo:
          $ref: '#/components/schemas/TipoBloque'
        ajustes:
          type: object
          additionalProperties: true
          description: Hasta 20 000 caracteres en JSON
    OrdenBloques:
      type: object
      additionalProperties: false
      required:
      - orden
      properties:
        orden:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Todos los bloques de la página, una vez cada uno, en el orden nuevo
    BloqueSitioCambio:
      type: object
      additionalProperties: false
      required:
      - visible
      properties:
        visible:
          type: boolean
    IdiomaSitio:
      type: string
      enum:
      - es
      - en
      default: es
      description: HU-1510 · Idioma del sitio; las filas sin idioma (anteriores a la HU-1510) son español
    ColeccionContenido:
      type: string
      description: Colecciones de contenido del sitio (HU-1504, `@aptio/schema/sitio-contenido`)
      enum:
      - cifras
      - testimonios
      - logos
      - funcionalidades
      - pasos
      - lms
      - preguntas
    ElementoSitio:
      type: object
      required:
      - id
      - coleccion
      - idioma
      - orden
      - visible
      - ficticio
      - datos
      - creadoEn
      - actualizadoEn
      properties:
        id:
          type: string
          format: uuid
        coleccion:
          $ref: '#/components/schemas/ColeccionContenido'
        idioma:
          $ref: '#/components/schemas/IdiomaSitio'
        orden:
          type: integer
          minimum: 0
        visible:
          type: boolean
          description: Nace en false (RN-16-2)
        ficticio:
          type: boolean
          description: HU-1505 · Dato inventado; visible, bloquea publicar en producción (RN-16-3)
        datos:
          $ref: '#/components/schemas/DatosElemento'
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    DatosElemento:
      type: object
      description: |-
        Campos de la colección, en texto plano. cifras: valor, etiqueta. testimonios: nombre, cargo, empresa, sector?,
        texto, estrellas (1 a 5), desde?. logos: nombre. funcionalidades: etiqueta, titulo, texto, vinetas? (una por
        línea). pasos: titulo, texto. lms: nombre, nota?. preguntas: pregunta, respuesta, pagina? (ruta; vacía = todas).
      additionalProperties:
        oneOf:
        - type: string
        - type: integer
    ElementoSitioEntrada:
      type: object
      additionalProperties: false
      required:
      - coleccion
      - datos
      properties:
        coleccion:
          $ref: '#/components/schemas/ColeccionContenido'
        datos:
          $ref: '#/components/schemas/DatosElemento'
        ficticio:
          type: boolean
          default: false
        idioma:
          $ref: '#/components/schemas/IdiomaSitio'
    ElementoSitioCambio:
      type: object
      additionalProperties: false
      properties:
        datos:
          $ref: '#/components/schemas/DatosElemento'
        visible:
          type: boolean
        ficticio:
          type: boolean
    EnlaceSitio:
      type: object
      required:
      - id
      - zona
      - padreId
      - idioma
      - texto
      - ruta
      - externo
      - orden
      - visible
      - creadoEn
      - actualizadoEn
      properties:
        idioma:
          $ref: '#/components/schemas/IdiomaSitio'
        id:
          type: string
          format: uuid
        zona:
          type: string
          enum:
          - menu
          - pie
        padreId:
          type: string
          format: uuid
          nullable: true
          description: La columna del pie del enlace; null en el menú y en las columnas
        texto:
          type: string
          maxLength: 60
          description: Texto del enlace o título de la columna (texto plano, RN-16-7)
        ruta:
          type: string
          nullable: true
          maxLength: 300
          description: Interna (/precios, /#testimonios) o https://; null solo en una columna del pie
        externo:
          type: boolean
        orden:
          type: integer
          minimum: 0
          description: Sin huecos entre hermanos (misma zona y padre)
        visible:
          type: boolean
          description: Nace en false (RN-16-2)
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    NavegacionSitio:
      type: object
      required:
      - menu
      - pie
      properties:
        menu:
          type: array
          items:
            $ref: '#/components/schemas/EnlaceSitio'
        pie:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EnlaceSitio'
            - type: object
              required:
              - enlaces
              properties:
                enlaces:
                  type: array
                  items:
                    $ref: '#/components/schemas/EnlaceSitio'
    EnlaceSitioEntrada:
      type: object
      additionalProperties: false
      required:
      - zona
      - texto
      properties:
        zona:
          type: string
          enum:
          - menu
          - pie
        padreId:
          type: string
          format: uuid
          description: Solo en el pie, la columna del enlace; sin padre, en el pie se crea una columna
        idioma:
          $ref: '#/components/schemas/IdiomaSitio'
        texto:
          type: string
          maxLength: 60
        ruta:
          type: string
          maxLength: 300
    EnlaceSitioCambio:
      type: object
      additionalProperties: false
      properties:
        texto:
          type: string
          maxLength: 60
        ruta:
          type: string
          nullable: true
          maxLength: 300
        visible:
          type: boolean
    OrdenEnlaces:
      type: object
      additionalProperties: false
      required:
      - zona
      - orden
      properties:
        zona:
          type: string
          enum:
          - menu
          - pie
        padreId:
          type: string
          format: uuid
        idioma:
          $ref: '#/components/schemas/IdiomaSitio'
        orden:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
    EnlaceNavegacionPublico:
      type: object
      required:
      - texto
      - ruta
      - externo
      properties:
        texto:
          type: string
        ruta:
          type: string
        externo:
          type: boolean
    VersionSitio:
      type: object
      description: HU-1507 · Versión publicada del sitio (RN-16-5). Inmutable; la mayor es la que ve el sitio.
      required:
      - numero
      - creadoEn
      - entorno
      - origen
      - restauradaDe
      - publicadoPor
      - paginas
      - prerender
      properties:
        numero:
          type: integer
          minimum: 1
        creadoEn:
          type: string
          format: date-time
        entorno:
          type: string
          enum:
          - produccion
          - pruebas
        origen:
          type: string
          enum:
          - publicacion
          - pagina
          - programada
          - restauracion
          description: publicacion («Publicar cambios»), pagina (publicar o retirar una página), programada (la cola) o restauracion
        restauradaDe:
          type: integer
          nullable: true
          description: Con origen restauracion, la versión restaurada
        publicadoPor:
          type: object
          nullable: true
          description: null si la publicó la plataforma (programada)
          required:
          - id
          - nombre
          properties:
            id:
              type: string
              format: uuid
            nombre:
              type: string
        paginas:
          type: integer
          minimum: 0
          description: Páginas publicadas en la versión
        prerender:
          $ref: '#/components/schemas/PrerenderVersion'
    PrerenderVersion:
      type: object
      description: HU-1508 · El HTML pre-renderizado de la versión (DA-08). El sitio público lo sirve cuando está listo y es la última.
      required:
      - estado
      - en
      - error
      properties:
        estado:
          type: string
          enum:
          - en_curso
          - listo
          - error
          description: en_curso al crearse la versión; listo cuando el worker subió el HTML; error con el motivo
        en:
          type: string
          format: date-time
          nullable: true
          description: Cuándo terminó (listo o error)
        error:
          type: string
          nullable: true
          description: Con estado error, el motivo
    VersionPublicada:
      allOf:
      - $ref: '#/components/schemas/VersionSitio'
      - type: object
        properties:
          avisoFicticios:
            type: integer
            minimum: 1
            description: Solo en pruebas, cuántos datos ficticios visibles se publicaron (CP-117)
    VersionesSitio:
      type: object
      required:
      - entorno
      - actual
      - pendientes
      - total
      - versiones
      properties:
        entorno:
          type: string
          enum:
          - produccion
          - pruebas
        actual:
          type: integer
          nullable: true
          description: La versión que ve el sitio; null si aún no hay ninguna
        pendientes:
          type: boolean
          description: El panel tiene cambios que el sitio todavía no muestra
        total:
          type: integer
          minimum: 0
        versiones:
          type: array
          description: Las 50 más recientes, de la mayor a la menor
          items:
            $ref: '#/components/schemas/VersionSitio'
    VistaPreviaPagina:
      type: object
      description: HU-1507 · Vista previa de una página con lo que hay en el panel, publicado o no.
      required:
      - estado
      - entorno
      - pagina
      - navegacion
      properties:
        estado:
          type: string
          enum:
          - BORRADOR
          - PROGRAMADA
          - PUBLICADA
        entorno:
          type: string
          enum:
          - produccion
          - pruebas
        pagina:
          $ref: '#/components/schemas/PaginaPublica'
        navegacion:
          $ref: '#/components/schemas/NavegacionPublica'
    NavegacionPublicada:
      type: object
      description: HU-1510 · La navegación publicada de un idioma con el ajuste del selector ES · EN
      allOf:
      - $ref: '#/components/schemas/NavegacionPublica'
      - type: object
        required:
        - mostrarSelectorIdioma
        properties:
          mostrarSelectorIdioma:
            type: boolean
            description: El sitio publicado muestra el selector ES · EN (Ajustes del sitio)
    NavegacionPublica:
      type: object
      required:
      - menu
      - pie
      properties:
        menu:
          type: array
          items:
            $ref: '#/components/schemas/EnlaceNavegacionPublico'
        pie:
          type: array
          items:
            type: object
            required:
            - titulo
            - enlaces
            properties:
              titulo:
                type: string
              ruta:
                type: string
              externo:
                type: boolean
              enlaces:
                type: array
                items:
                  $ref: '#/components/schemas/EnlaceNavegacionPublico'
    ArchivoMarcaSitio:
      type: object
      nullable: true
      required:
      - archivo
      - mime
      properties:
        archivo:
          type: string
          pattern: ^(logo|favicon)-[0-9a-f]{8}\.(svg|png)$
          example: logo-1a2b3c4d.svg
        mime:
          type: string
          enum:
          - image/svg+xml
          - image/png
    ResumenSitio:
      type: object
      description: HU-1607 · Sitio web › Resumen (REQ-080, PNT-24, CP-138).
      required: [periodo, desde, hasta, indicadores, serie, origenes, paginas, proximasDemos]
      properties:
        periodo:
          type: string
          enum: [7d, 30d, 90d]
        desde:
          type: string
          format: date
          description: Primer día del período (Lima)
        hasta:
          type: string
          format: date
          description: Último día, hoy (Lima)
        indicadores:
          type: object
          required: [visitas, leads, demos, suscripciones]
          properties:
            visitas:
              $ref: '#/components/schemas/IndicadorResumen'
            leads:
              $ref: '#/components/schemas/IndicadorResumen'
            demos:
              $ref: '#/components/schemas/IndicadorResumen'
            suscripciones:
              type: object
              nullable: true
              description: Llega con las suscripciones (S13); hoy siempre null. Tendrá la forma de IndicadorResumen
              required: [actual, anterior, variacion]
              properties:
                actual:
                  type: integer
                anterior:
                  type: integer
                variacion:
                  type: number
                  nullable: true
        serie:
          type: array
          description: Un punto por día del período, con 0 en los días sin datos
          items:
            type: object
            required: [dia, visitas, leads, demos]
            properties:
              dia:
                type: string
                format: date
              visitas:
                type: integer
              leads:
                type: integer
              demos:
                type: integer
        origenes:
          type: array
          items:
            type: object
            required: [origen, etiqueta, leads, porcentaje]
            properties:
              origen:
                type: string
                enum: [formulario, popup, chatbot, agendador, suscripcion, boletin, asistente_ia]
              etiqueta:
                type: string
                example: Formulario
              leads:
                type: integer
              porcentaje:
                type: integer
                description: La lista suma 100 (0 sin leads)
        paginas:
          type: array
          maxItems: 5
          items:
            type: object
            required: [ruta, visitas, leads, conversion]
            properties:
              ruta:
                type: string
                example: /precios
              visitas:
                type: integer
              leads:
                type: integer
              conversion:
                type: number
                example: 7.5
                description: leads / visitas en %, con un decimal
        proximasDemos:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, inicio, fecha, hora, nombre, empresa, tipo, asesor, estado]
            properties:
              id:
                type: string
                format: uuid
              inicio:
                type: string
                format: date-time
              fecha:
                type: string
                format: date
              hora:
                type: string
                example: '10:30'
              nombre:
                type: string
              empresa:
                type: string
                nullable: true
              tipo:
                type: string
              asesor:
                type: string
              estado:
                type: string
                enum: [confirmada]
    IndicadorResumen:
      type: object
      required: [actual, anterior, variacion]
      properties:
        actual:
          type: integer
        anterior:
          type: integer
          description: El período anterior del mismo largo
        variacion:
          type: number
          nullable: true
          description: '% con un decimal; null si el período anterior fue 0'
    VisitaSitio:
      type: object
      description: HU-1607 · La vista anónima de una página, sin datos personales.
      required: [ruta, primeraPagina]
      properties:
        ruta:
          type: string
          maxLength: 300
          example: /precios
          description: Sin la base, la consulta ni el ancla
        idioma:
          type: string
          enum: [es, en]
          default: es
        primeraPagina:
          type: boolean
          description: true en la primera página de la sesión del navegador
        origen:
          type: string
          nullable: true
          maxLength: 60
          example: linkedin
          description: El origen atribuido (`utm_source` de la sesión); se valida y no se guarda
    AjustesSitio:
      type: object
      description: HU-1509 · Ajustes del sitio (REQ-073, PNT-38).
      required:
      - dominio
      - nombre
      - logo
      - favicon
      - analitica
      - cookies
      - whatsapp
      - correoLeads
      - mantenimiento
      - mostrarSelectorIdioma
      - actualizadoEn
      properties:
        dominio:
          type: string
          nullable: true
          description: Sin protocolo ni ruta; null usa `SITIO_URL`
          example: aptioscorm.com
        nombre:
          type: string
          maxLength: 60
          example: Aptio SCORM
        logo:
          $ref: '#/components/schemas/ArchivoMarcaSitio'
        favicon:
          $ref: '#/components/schemas/ArchivoMarcaSitio'
        analitica:
          type: object
          description: HU-1606 · Salen al sitio con «Publicar cambios» y solo se cargan con el consentimiento del visitante
          required:
          - ga4
          - gtm
          - metaPixel
          properties:
            ga4:
              type: string
              nullable: true
              example: G-AB12CD34EF
            gtm:
              type: string
              nullable: true
              example: GTM-AB12CD3
            metaPixel:
              type: string
              nullable: true
              example: '123456789012345'
        cookies:
          type: object
          description: HU-1606 · Aviso de cookies del sitio (REQ-079, RN-17-6); sale al sitio con «Publicar cambios»
          required:
          - visible
          - version
          properties:
            visible:
              type: boolean
              default: true
              description: Muestra el aviso (solo si hay al menos un ID de analítica); oculto, el sitio no carga ninguna etiqueta
            version:
              type: integer
              minimum: 1
              default: 1
              description: Versión de la política; al subirla y publicar, el sitio vuelve a pedir el consentimiento
        whatsapp:
          type: object
          required:
          - visible
          - numero
          - mensaje
          properties:
            visible:
              type: boolean
            numero:
              type: string
              nullable: true
              description: E.164
              example: '+51987654321'
            mensaje:
              type: string
              nullable: true
              maxLength: 200
        correoLeads:
          type: string
          nullable: true
          format: email
        mantenimiento:
          type: object
          required:
          - activo
          - mensaje
          - desde
          properties:
            activo:
              type: boolean
            mensaje:
              type: string
              nullable: true
              maxLength: 280
            desde:
              type: string
              format: date-time
              nullable: true
        mostrarSelectorIdioma:
          type: boolean
          default: true
          description: HU-1510 · El sitio muestra el selector ES · EN en la cabecera y el menú de celular; sale al sitio con «Publicar cambios»
        actualizadoEn:
          type: string
          format: date-time
          nullable: true
    AjustesSitioCambio:
      type: object
      description: Solo los campos que cambian; un texto vacío o null borra el valor. Logo y favicon se suben aparte.
      properties:
        dominio:
          type: string
          nullable: true
        nombre:
          type: string
        analitica:
          type: object
          properties:
            ga4:
              type: string
              nullable: true
            gtm:
              type: string
              nullable: true
            metaPixel:
              type: string
              nullable: true
        cookies:
          type: object
          description: HU-1606 · El aviso de cookies y la versión de la política
          properties:
            visible:
              type: boolean
            subirVersion:
              type: boolean
              description: true suma 1 a la versión de la política
        whatsapp:
          type: object
          properties:
            visible:
              type: boolean
            numero:
              type: string
              nullable: true
            mensaje:
              type: string
              nullable: true
        correoLeads:
          type: string
          nullable: true
        mantenimiento:
          type: object
          properties:
            activo:
              type: boolean
            mensaje:
              type: string
              nullable: true
        mostrarSelectorIdioma:
          type: boolean
          description: HU-1510 · Mostrar el selector ES · EN; auditoría SITIO_AJUSTES_ACTUALIZADOS con `publicar` true
    CategoriaBlog:

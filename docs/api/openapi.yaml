            text/html:
              schema:
                type: string
        '404':
          description: El enlace no corresponde a ninguna cita (text/html)
          content:
            text/html:
              schema:
                type: string
        '409':
          description: La cita ya no está activa o ya empezó (text/html)
          content:
            text/html:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
  /publico/chat:
    post:
      tags:
      - Captación
      summary: Conversar con el chatbot del sitio (HU-1604, IA-20, CP-133, RN-17-4)
      operationId: post_publico_chat
      security: []
      description: |-
        Sin sesión, con `Cache-Control: no-store`. Lo usa `_chat.js`. El mensaje del visitante es texto plano no confiable
        (hasta 500 caracteres): llega a IA-20 neutralizado dentro de un bloque de datos y nunca cambia las instrucciones.
        IA-20 responde solo con fuentes del sitio publicado (páginas y preguntas frecuentes del idioma; en producción,
        nunca las ficticias) y las fuentes manuales visibles: hasta 6 fuentes y 12 000 caracteres. Sin fuentes, con una
        cita inventada, sin respuesta válida, pasados 20 s o con el tope de gasto de IA alcanzado, responde «no lo sé» con
        «Agendar demo» y «Hablar con una persona» (`controlada: true`) sin inventar (CP-133).

        En vez de `mensaje`, `accion` (`agendar_demo` o `hablar_persona`) solo registra la respuesta rápida que el
        navegador resuelve sin IA: el agendador dentro del chat (`POST /publico/citas` con `via: chatbot`, CP-134) o el
        traspaso (WhatsApp en horario y, siempre, correo y pregunta por `POST /publico/leads` con `via: chatbot`). Cada
        conversación guarda hasta 20 mensajes del visitante (después, la respuesta del límite, sin IA) y se borra a los 90
        días; no guarda IP ni cookies.

        404 CHATBOT_OCULTO si el chatbot está oculto; 422 NO_VALIDO con el campo de cada error; 429
        DEMASIADAS_SOLICITUDES con más de 10 mensajes por minuto desde la misma IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatEntrada'
      responses:
        '200':
          description: La respuesta de IA-20 con sus fuentes, o «no lo sé» con sus dos botones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRespuesta'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
  /publico/citas:
    post:
      tags:
      - Captación
      summary: Reservar una franja del agendador (HU-1605, CP-135, CP-136)
      operationId: post_publico_citas
      security: []
      description: |-
        Sin sesión. Lo usa `_agenda.js`. Los datos del visitante siguen las reglas de `POST /publico/leads` (texto plano
        no confiable, `consentimiento: true` por la Ley 29733, campo trampa `website`: con él lleno responde 201 con
        `cita: null` y no guarda nada). La franja se vuelve a comprobar en una transacción con un candado por asesor y un
        índice único parcial (asesor e inicio de las citas confirmadas): de dos reservas a la vez de la misma franja con
        un solo asesor, una recibe 201 y la otra 409 FRANJA_OCUPADA (CP-135). Con varios asesores libres elige al que
        tiene menos citas por delante.

        Crea o actualiza el lead con `via: agendador` (o `chatbot` si la reserva llega desde el chat, CP-134) y, si estaba en Nuevo o Contactado, lo pasa a Demo (excepción a
        SUP-236, SUP-254). Encola en `agenda` la invitación al visitante con copia al asesor (con la invitación .ics, el
        enlace de Google Calendar, el enlace fijo de videollamada del asesor y el enlace de cancelación) y los
        recordatorios por correo a las 24 h y a 1 h que todavía no pasaron; el worker vuelve a mirar la cita antes de
        enviar cada uno (CP-136). La respuesta trae lo que muestra la confirmación del sitio.

        422 NO_VALIDO con el campo de cada error, TIPO_NO_DISPONIBLE si el tipo ya no se ofrece, FRANJA_NO_VALIDA si esa
        hora no se ofrece; 429 DEMASIADAS_SOLICITUDES con más de 5 reservas en 10 minutos desde la misma IP (además del
        límite general de `/publico/*`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaEntrada'
      responses:
        '201':
          description: Reservada (o descartada por el campo trampa, con `cita` null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaRecibida'
        '409':
          description: FRANJA_OCUPADA · otro visitante tomó la franja; el sitio vuelve a pedir los horarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/NoValido'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
  /publico/citas/cancelar:
    post:
      tags:
      - Captación
      summary: Cancelar una cita con el token del enlace (HU-1605)
      operationId: post_publico_citas_cancelar
      security: []
      description: |-
        Sin sesión. Vale hasta la hora de inicio. Cancela, quita los recordatorios pendientes y encola el aviso de
        cancelación al visitante con copia al asesor (con la invitación .ics `METHOD:CANCEL`). Reagendar es cancelar y
        reservar otra vez (SUP-251). 404 CITA_NO_ENCONTRADA; 409 CITA_NO_ACTIVA si ya no está confirmada o CITA_YA_EMPEZO;
        429 con el mismo límite de las reservas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelacionEntrada'
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancelacion'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: CITA_NO_ACTIVA o CITA_YA_EMPEZO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
  /publico/leads:
    post:
      tags:
      - Captación
      summary: Registrar un lead desde el sitio con su origen y UTM (HU-1601, CP-128)
      operationId: post_publico_leads
      security: []
      description: |-
        Sin sesión. Lo usan el script del sitio y, en sus historias, el popup, el chatbot, el agendador y la suscripción
        (`via`). Todo es texto plano no confiable (RN-16-7): el correo se guarda en minúsculas y `consentimiento` debe ser
        true (Ley 29733; se guarda su fecha). Un referente de un asistente de IA (ChatGPT, Claude, Gemini, Perplexity,
        Copilot y otros) o un `utm_source` igual da `origen = asistente_ia`, y `via` conserva el canal (RN-17-1).

        Un solo lead por correo: si ya existe, conserva la atribución del primer contacto (origen, entrada, UTM y
        referente), completa solo los datos que faltaban, suma el envío a `historialContactos` (los últimos 50) y sube
        `totalContactos`. Con el campo trampa `website` lleno se responde igual y no se guarda nada. La respuesta nunca dice
        si el correo ya existía. El aviso por correo va al «Correo de leads» de los ajustes sin bloquear la respuesta: si
        falla, el lead queda guardado. 429 DEMASIADAS_SOLICITUDES con más de 5 envíos en 10 minutos desde la misma IP
        (además del límite general de `/publico/*`).

        HU-1602 · El lead (o el contacto nuevo del mismo correo) se encola a cada conexión activa de CRM y al webhook
        (`lead.creado` o `lead.actualizado`), sin bloquear la respuesta.

        HU-1603 · Con `via: popup` y el `popupId` de un popup que pide el correo, el lead guardado suma una conversión a ese
        popup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadEntrada'
      responses:
        '201':
          description: Recibido (también cuando se descarta por el campo trampa)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadRecibido'
        '422':
          $ref: '#/components/responses/NoValido'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'

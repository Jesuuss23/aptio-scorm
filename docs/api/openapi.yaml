      operationId: get_sitio_portada
      security: []
      servers:
      - url: https://{entorno}.ejemplo.local
        description: La API fuera del prefijo /api/v1 (en local, http://localhost:3000)
        variables:
          entorno:
            default: pruebas
      description: |-
        Sin sesión y fuera del prefijo de la API (DA-08, REQ-109). Igual que `GET /s/{ruta}` con la ruta `/`: la portada
        en español de la versión que indica `sitio/actual.json`.
      parameters:
      - $ref: '#/components/parameters/SiNoCoincide'
      responses:
        '200':
          $ref: '#/components/responses/PaginaSitio'
        '304':
          description: El navegador ya tiene esta versión (misma ETag)
        '404':
          $ref: '#/components/responses/PaginaSitioNoEncontrada'
        '503':
          $ref: '#/components/responses/SitioEnMantenimiento'
  /s/{ruta}:
    get:
      tags:
      - Sitio público
      summary: Página, fuente, sitemap, robots o popups del sitio pre-renderizado (HU-1508)
      operationId: get_sitio_archivo
      security: []
      servers:
      - url: https://{entorno}.ejemplo.local
        description: La API fuera del prefijo /api/v1 (en local, http://localhost:3000)
        variables:
          entorno:
            default: pruebas
      description: |-
        Sin sesión y fuera del prefijo de la API (DA-08, REQ-109, CP-120). El worker pre-renderiza cada versión del sitio en
        el bucket (`sitio/v{n}/…`) y al terminar mueve el puntero `sitio/actual.json`; aquí se sirve el archivo de esa
        versión. `ruta` puede tener varios segmentos: `precios`, `en/precios`, `sitemap.xml`, `robots.txt` o
        `_fuentes/{nombre}-{hash8}.woff2`. Cada segmento lleva solo minúsculas, números y guiones (máximo 8); cualquier
        otra forma da la 404. Las páginas no llevan JavaScript; los ficticios nunca salen en producción (RN-16-3).

        Caché: las páginas, el sitemap y robots llevan `Cache-Control: public, max-age=0, s-maxage=60, must-revalidate`
        (la CDN las guarda un minuto); las fuentes, `public, max-age=31536000, immutable`; la 404, `s-maxage=30`. Todas
        llevan `ETag`; con `If-None-Match` igual responde 304. Las páginas y la 404 llevan una CSP sin scripts de terceros (HU-1601: solo los propios).

        HU-1509 · `_marca/{logo|favicon}-{hash8}.{svg|png}` sirve el logo y el favicon de los ajustes, con la misma caché
        que las fuentes. HU-1511 · `_blog/{sha16}.{jpg|png|webp}` sirve las imágenes destacadas copiadas de WordPress,
        con la misma caché. Con el modo mantenimiento activo, toda ruta salvo fuentes y marca responde 503 con la página
        «Volvemos pronto» (CP-121), salvo para el superadmin con sesión, que ve el sitio con un aviso arriba y
        `Cache-Control: private, no-store`.

        HU-1512 · Una ruta sin página con una redirección activa en la versión vigente responde 301 con `Location:
        /s/{hacia}` (CP-124); la página publicada manda sobre la redirección. Cada página lleva su título, meta
        descripción, canonical, Open Graph y un bloque JSON-LD (`application/ld+json`, no se ejecuta); con «Indexar»
        apagado lleva `noindex`, sale del sitemap y no tiene hreflang (CP-125). robots.txt suma las reglas extra.

        HU-1513 · `llms.txt` sirve el texto de Sitio web › SEO para IA (`text/plain`, con la caché de las páginas); si
        está vacío, la 404. robots.txt suma un grupo `User-agent: {nombre}` con `Disallow: /` por cada rastreador de IA
        bloqueado (CP-126).

        HU-1601 · Con el bloque «Formulario de contacto» en la versión, sus páginas cargan el script propio
        `_captacion.js` (`text/javascript`, con la caché de las páginas), que guarda en `sessionStorage` la página de
        entrada, el referente externo y los `utm_*` de la primera visita y los copia al formulario; no usa cookies ni
        terceros. Por eso la CSP de las páginas pasa a `script-src 'self'` y `form-action 'self'`. `_gracias` y
        `en/_gracias` son la confirmación del envío (`noindex`). Sin JavaScript el formulario se envía igual, con la
        página del formulario como entrada: el formulario hace `POST /s/_lead` (`application/x-www-form-urlencoded`, los
        campos de `LeadEntrada`, que la CDN debe reenviar al origen) con el mismo registro que `POST /publico/leads`. Con
        éxito, o con el campo trampa lleno, responde 303 a `/s/_gracias` (o `/s/en/_gracias`); con datos no válidos (422)
        o demasiados envíos (429, con Retry-After), la página del sitio con los errores y «Volver al formulario», con
        `Cache-Control: private, no-store`.

        HU-1603 · Toda versión trae `_popups.js` y todas sus páginas lo cargan (diferido, del mismo origen): lee los
        popups activos en vivo (`GET /s/_popups.json`), aplica la frecuencia (una vez por visitante cada 7 días como
        mínimo, RN-17-3), las páginas, la exclusión de `/pago*` y la supresión tras dejar el correo, y guarda cuándo vio
        cada popup en `localStorage`, sin cookies. Una página abierta con `#popup-{id}` abre ese popup. El modal es un
        diálogo accesible; el deslizable y la barra son fijos. La página no necesita el script para nada más.

        HU-1603 · `_popups.json` (en vivo, no sale de la versión) devuelve `{ popups: PopupPublico[] }`: solo los popups
        activos y, en producción, nunca los ficticios, sin su nombre interno ni sus resultados. Lleva `Cache-Control:
        public, max-age=0, s-maxage=30`: apagar un popup vale en menos de un minuto sin republicar (CP-132).

        HU-1605 · Con el bloque «Agendador» en la versión, la versión trae `_agenda.js` y solo sus páginas lo cargan
        (diferido, del mismo origen, sin cookies ni HTML inyectado). El contenedor reserva su alto (CLS 0) y lee las
        franjas en vivo de `GET /s/_agenda.json`; sin JavaScript el bloque ofrece el formulario de contacto
        (`POST /s/_lead`) y el WhatsApp de los ajustes. La página del enlace de cancelación es `GET /s/_cita`.

        HU-1604 · Toda versión trae `_chat.js` y todas sus páginas lo cargan salvo `/pago*` (diferido, del mismo origen,
        sin cookies; la conversación sigue en `sessionStorage`). Lee `_chatbot.json` en vivo (no sale de la versión,
        `Cache-Control: public, max-age=0, s-maxage=30`): `ChatbotPublico`, o solo `{ "visible": false }` con el chatbot
        oculto, y entonces no muestra el botón. Las respuestas rápidas visibles van en su orden (hasta 8; en producción,
        nunca las ficticias); `whatsapp` es el enlace de los ajustes del sitio (null si está oculto). Una página abierta
        con `#chat` abre el chat. El botón y el diálogo son fijos (CLS 0) y el diálogo es modal y accesible; conversa con
        `POST /publico/chat`.

        HU-1606 · Si la versión publicó al menos un ID de analítica con el aviso de cookies visible, trae `_cookies.js` y
        sus páginas lo cargan (no la 404; diferido, del mismo origen, sin cookies propias). Sus atributos `data-version`,
        `data-ga4`, `data-gtm`, `data-pixel` y `data-privacidad` llevan la política publicada. Muestra un aviso fijo
        (CLS 0) con «Rechazar», «Configurar» y «Aceptar» mientras no haya una decisión vigente en `localStorage`
        (`aptio.cookies`, 12 meses; se vuelve a preguntar si sube la versión de la política o aparece otra categoría).
        GA4 y Tag Manager son «Analítica» y Meta Pixel «Publicidad»; ninguna etiqueta se pide antes de aceptar su
        categoría. El pie trae «Configurar cookies» (`#cookies` abre el diálogo modal). Solo entonces la
        `Content-Security-Policy` de las páginas suma a `script-src`, `connect-src` e `img-src` los orígenes de Google o
        de Meta de las etiquetas publicadas; sin etiquetas sigue `script-src 'self'`.

        HU-1607 · Toda versión trae `_visita.js` y todas sus páginas publicadas lo cargan (no la 404 ni la de gracias;
        diferido, del mismo origen, sin cookies ni cambios en la página). Manda una vez por página `POST /s/_visita` con
        la ruta, el idioma, si es la primera página de la sesión (marca en `sessionStorage`) y el `utm_source` de la sesión.
      parameters:
      - name: ruta
        in: path
        required: true
        description: La ruta pública sin la base `/s/` (puede llevar `/`)
        schema:
          type: string
          example: en/precios
      - $ref: '#/components/parameters/SiNoCoincide'
      responses:
        '200':
          description: La página (text/html), la fuente (font/woff2), el sitemap (application/xml) o robots (text/plain)
          headers:
            ETag:
              $ref: '#/components/headers/ETagSitio'
            Cache-Control:
              $ref: '#/components/headers/CacheSitio'
          content:
            text/html:
              schema:
                type: string
            font/woff2:
              schema:
                type: string
                format: binary
            application/xml:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                oneOf:
                - description: HU-1603 · `_popups.json`
                  type: object
                  required: [popups]
                  properties:
                    popups:
                      type: array
                      items:
                        $ref: '#/components/schemas/PopupPublico'
                - $ref: '#/components/schemas/ChatbotPublico'
        '301':
          description: HU-1512 · Redirección activa de la versión vigente (CP-124)
          headers:
            Location:
              description: La ruta de destino bajo `/s`
              schema:
                type: string
                example: /s/precios
        '304':
          description: El navegador ya tiene esta versión (misma ETag)
        '404':
          $ref: '#/components/responses/PaginaSitioNoEncontrada'
        '503':
          $ref: '#/components/responses/SitioEnMantenimiento'
  /s/_popup:
    post:
      tags:
      - Sitio público

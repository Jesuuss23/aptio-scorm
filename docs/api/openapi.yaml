  /publico/checkout:
    post:
      tags:
      - Sitio público
      summary: Empezar el pago de una suscripción desde /pago (HU-1703, REQ-083, CP-143)
      operationId: post_publico_checkout
      security: []
      description: |-
        Sin sesión. Lo usa `_checkout.js` en el paso 3 de `/pago`. Los datos son del visitante (texto plano no confiable)
        y se validan con `@aptio/schema/suscripciones`: razón social, RUC opcional de 11 dígitos con el dígito verificador
        de SUNAT (con RUC, FACTURA; sin RUC, BOLETA), administrador, correo y `consentimiento: true` (Ley 29733). El plan y
        su precio salen de la última versión publicada (RN-18-2): el mensual cobra `precioMes` y el anual el precio anual
        efectivo, más IGV de 18 %. Crea la solicitud PENDIENTE con el resumen y la atribución del visitante (para el lead).

        HU-1704 · `moneda` USD cobra `precioMesUsd` (o el anual efectivo en USD) más 18 % (SUP-295) con la primera
        pasarela visible y activa que cobre en dólares (Stripe); en soles, con la primera que cobre en soles (pruebas o
        Culqi). `pago` dice cómo sigue: la URL de Stripe Checkout (Idempotency-Key `checkout-<id>`), la configuración de
        Culqi Checkout o el formulario simulado.

        404 PLAN_NO_DISPONIBLE si el plan no se publica, está oculto, es ficticio en producción o es a medida; 422
        NO_VALIDO con el campo de cada error (también si pide el anual y la página no lo ofrece); 409 CORREO_EN_USO si el
        correo ya es de un usuario (inicia sesión); 422 NO_VALIDO en `moneda` si el plan no se cobra en dólares; 503
        PAGO_NO_DISPONIBLE si ninguna pasarela visible y activa cobra esa moneda (el sitio ofrece agendar una demo); 502
        PASARELA_NO_RESPONDE si la pasarela no creó el pago (la solicitud queda RECHAZADA); 429 con más de 10 checkouts en
        10 minutos desde la misma IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutEntrada'
      responses:
        '201':
          description: Solicitud pendiente con el resumen y la pasarela que cobra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutCreado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: CORREO_EN_USO · el correo ya tiene una cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/NoValido'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
        '502':
          description: PASARELA_NO_RESPONDE · la pasarela no creó el pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: PAGO_NO_DISPONIBLE · ninguna pasarela visible y activa cobra esa moneda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

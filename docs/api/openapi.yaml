    EstadoTrabajo:
      type: string
      enum:
      - EN_COLA
      - EN_CURSO
      - COMPLETADO
      - ERROR
      - CANCELADO
    Etapa:
      type: object
      required:
      - etapa
      - orden
      - estado
      properties:
        etapa:
          type: string
          enum:
          - RESUMEN_MATERIAL
          - OBJETIVOS_ESTRUCTURA
          - STORYBOARD_GUION
          - PANTALLAS
          - ILUSTRACIONES
          - VOZ_ES
          - BOCA
          - SUBTITULOS
          - VERSION_EN
          - CONTROL_CALIDAD
          - PAQUETE
        orden:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoTrabajo'
        detalle:
          type: string
          nullable: true
          description: Resumen legible de lo hecho o del error; «Se habilita en un sprint siguiente» si la etapa aún no tiene ejecutor
        inicio:
          type: string
          format: date-time
          nullable: true
        fin:
          type: string
          format: date-time
          nullable: true
        costoUsd:
          type: number
    EtapaResultado:
      allOf:
      - $ref: '#/components/schemas/Etapa'
      - type: object
        properties:
          datos:
            type: object
            nullable: true
            description: >-
              Lo que guardó la etapa. En RESUMEN_MATERIAL, un ResumenMaterial; en OBJETIVOS_ESTRUCTURA, una
              EstructuraCurso; en STORYBOARD_GUION, un GuionCurso; en PANTALLAS, un PantallasCurso, también
              mientras corre (CP-043: las pantallas listas); las demás etapas definen el suyo.
            anyOf:
            - $ref: '#/components/schemas/ResumenMaterial'
            - $ref: '#/components/schemas/EstructuraCurso'
            - $ref: '#/components/schemas/GuionCurso'
            - $ref: '#/components/schemas/PantallasCurso'
            - type: object
    EstructuraCurso:
      type: object
      description: >-
        Resultado de la etapa 2 (HU-0403, IA-04 v2): objetivos con nivel de Bloom y pantallas con tipo, objetivos,
        fragmentos, actividad sugerida y páginas de origen. Con N pantallas y P % de actividades hay exactamente N
        pantallas y al menos ⌈N × P / 100⌉ con actividad, cada una ligada a un objetivo (CP-039).
      required:
      - objetivos
      - modulos
      - actividades
      properties:
        objetivos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              texto:
                type: object
                properties:
                  es:
                    type: string
                  en:
                    type: string
              nivelBloom:
                type: string
                enum:
                - recordar
                - comprender
                - aplicar
                - analizar
                - evaluar
                - crear
              verbo:
                type: string
        modulos:
          type: array
          description: Módulos con sus cápsulas; cada cápsula lleva sus pantallas (id, tipo, proposito, objetivoIds, fragmentoIds, actividadSugerida, paginas)
          items:
            type: object
        supuestos:
          type: array
          items:
            type: string
        actividades:
          type: object
          properties:
            minimas:
              type: integer
              nullable: true
            total:
              type: integer
    PantallasCurso:
      type: object
      description: >-
        Resultado de la etapa 4 (HU-0406, IA-15 v2): cada pantalla con su disposición del kit, fondo y campos, sin HTML,
        y cada actividad con sus datos (HU-0407, IA-07 v2).
        Mientras la etapa corre trae solo las pantallas listas (CP-043); al terminar, también el curso guardado y
        validado (CP-042).
      required:
      - total
      - kit
      - modelos
      - pantallas
      - advertencias
      properties:
        total:
          type: integer
          description: Pantallas que tendrá el curso
        kit:
          type: object
          properties:
            nombre:
              type: string
            paleta:
              type: object
              additionalProperties:
                type: string
            tipografias:
              type: object
              properties:
                titulos:
                  type: string
                textos:
                  type: string
            personaje:
              type: string
              nullable: true
        modelos:
          type: object
          description: Por disposición, el modelo que usa (el del cliente o el del estilo base)
          additionalProperties:
            type: object
        pantallas:
          type: array
          items:
            type: object
            required:
            - id
            - orden
            - capsulaId
            - titulo
            - disposicion
            - fondo
            - campos
            - pedidosImagen
            properties:
              id:
                type: string
              orden:
                type: integer
                description: Lugar en el curso, desde 1 (una pantalla puede quedar lista antes que la anterior)
              capsulaId:
                type: string
              titulo:
                type: string
              disposicion:
                type: string
              fondo:
                type: string
              campos:
                type: object
                description: Campos de IA-15 (titulo, subtitulo, texto, dato, items, opciones…)
              personaje:
                type: object
                properties:
                  pose:
                    type: string
                  lado:
                    type: string
              pedidosImagen:
                type: array
                items:
                  type: object
              actividad:
                type: object
                properties:
                  tipo:
                    type: string
                  consigna:
                    type: string
                  interaccion:
                    type: object
                    description: Datos de la actividad de IA-07 (HU-0407), tal como van en el bloque interaccion del curso
                    properties:
                      modo:
                        type: string
                        enum:
                        - formativa
                        - sumativa
                      peso:
                        type: number
                      instruccion:
                        type: object
                      datos:
                        type: object
              motivo:
                type: string
        advertencias:
          type: array
          items:
            type: string
        curso:
          type: object
          description: El curso guardado al terminar la etapa
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
    GuionCurso:
      type: object
      description: >-
        Resultado de la etapa 3 (HU-0404, IA-05 v2): por cápsula, cada pantalla de la estructura con título, texto en
        pantalla, narración, visual, actividad y origen. Pasar de 30 palabras en pantalla o 45 de narración no rechaza
        el guion: queda en advertencias (CP-040).
      required:
      - capsulas
      - advertencias
      properties:
        capsulas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              moduloId:
                type: string
              titulo:
                type: object
                properties:
                  es:
                    type: string
                  en:
                    type: string
              pantallas:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - tipo
                  - titulo
                  - textoPantalla
                  - narracion
                  - visual
                  - objetivoIds
                  - origen

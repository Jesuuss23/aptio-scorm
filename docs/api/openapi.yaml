        Solo existe en el entorno de pruebas (en producción, 404). Con 4111 1111 1111 1111 aprueba y con 4000 0000 0000
        0002 rechaza: arma el evento, lo firma con el secreto de la pasarela de pruebas y lo procesa por el mismo camino que

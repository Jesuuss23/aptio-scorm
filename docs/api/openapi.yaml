        pesoEstimadoBytes:
          type: integer
        limiteMb:
          type: integer
          nullable: true
          description: Límite de subida del destino; null en HTML (no hay LMS)
        origenLimite:
          type: string
          nullable: true
          enum:
          - ficha
          - referencia

openapi: 3.0.3
info:
  title: Aptio SCORM · API
  version: 0.2.0
  license:
    name: Propietario · Grupo de Soluciones Creativas SAC
  description: 'API REST del generador de SCORM con IA. Prefijo /api/v1. Las tareas largas (generación, IA, voz, exportación) responden 202 con
    un trabajo y avisan por eventos (SSE). La IA nunca cambia el curso sin una acción del usuario: crea propuestas.'
servers:
- url: http://localhost:3000/api/v1
  description: Local
- url: https://{entorno}.ejemplo.local/api/v1
  description: Pruebas
  variables:
    entorno:
      default: pruebas
security:
- cookieSesion: []
tags:
- name: Acceso
  description: Sesión con correo y clave o con Google, recuperación de clave, usuarios y roles
- name: Clientes y kits
  description: Clientes, kit de marca, pantallas modelo, glosario, pronunciación y fichas LMS (M02)
- name: Proyectos
  description: Proyectos y material del cliente (M03)
- name: Recursos
  description: 'Archivos en S3: subida, biblioteca e imágenes generadas'
- name: Generación
  description: Generador del SCORM y sus 11 etapas (M04)
- name: Curso
  description: Documento del curso, versiones y cambios del editor (M05, M06)
- name: Asistente IA
  description: Propuestas de la IA que el usuario aplica o descarta
- name: Revisión
  description: Control de calidad, observaciones y comentarios (M05)
- name: Personaje y voz
  description: Narración, boca sincronizada y audio del cliente (M07)
- name: Idiomas
  description: Traducción y revisión ES/EN (M08)
- name: Alineación y navegación
  description: Alineación pedagógica, patrones de navegación y vista previa (M10, M11)
- name: Entrega
  description: Validación y exportación SCORM, HTML y kit de gamificación (M12)
- name: Costos y rentabilidad
  description: Costos de IA, parámetros y mediciones (M13)
- name: Conexiones IA
  description: Proveedor y modelo por tarea (M13)
- name: Plataforma
  description: Salud del servicio y operación (M15)
- name: Sitio web
  description: Sitio comercial administrable, solo superadmin de plataforma (M16, ADR-011)
- name: Sitio público
  description: Rutas sin sesión del sitio comercial, con límite de 60 peticiones por minuto por IP (M16)
- name: Captación
  description: Leads del sitio con su origen y UTM, el embudo comercial y su envío a CRM o a un webhook firmado; la consulta es solo del superadmin (M17, ADR-011)
- name: Ventas
  description: Planes y precios de la página de precios; suscripciones y facturación llegan con sus historias. Solo del superadmin (M18, ADR-012)
paths:
  /salud:
    get:
      tags:
      - Plataforma
      summary: Salud de la API y de la base de datos (CP-001)
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /eventos:
    get:
      tags:
      - Plataforma
      summary: Avance de los trabajos de la organización en vivo (SSE, CP-016)
      operationId: get_eventos
      description: 'text/event-stream. `event: trabajo` con un EventoTrabajo en cada cambio de estado o avance; `event: latido` cada 15 s. Solo los trabajos de la organización de la sesión. Equipo de producción (no REVISOR_CLIENTE ni SUPERADMIN).'
      responses:
        '200':
          description: Flujo de eventos
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventoTrabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /sitio/paginas:
    get:
      tags:
      - Sitio web
      summary: Páginas del sitio comercial (HU-1501, HU-1502)
      operationId: get_sitio_paginas
      description: |-
        Solo SUPERADMIN de plataforma (ADR-011): todas las rutas `/sitio/*` responden 403 al administrador de una
        organización y al resto de los roles (CP-109), y 401 sin sesión. Lista todas las páginas, ordenadas por ruta e
        idioma, con su estado, `publicarEn` y `publicadaEn`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginaSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
      - Sitio web
      summary: Crear una página (HU-1502)
      operationId: post_sitio_paginas
      description: |-
        Solo SUPERADMIN. Nace en BORRADOR, o PROGRAMADA o PUBLICADA según `accion`. La ruta es `/` o
        `/segmento[/segmento…]` con minúsculas, números y guiones (422). Auditoría SITIO_PAGINA_CREADA. 409 RUTA_EN_USO si
        ya hay una página con esa ruta e idioma.
        HU-1514 · Con `tipo=sector` crea una landing por sector (REQ-092): basta `sector` (e `idioma`); la ruta es
        `/sectores/{slug del sector}` y el título, el nombre del sector. Nace siempre en BORRADOR (422 LANDING_EN_BORRADOR
        con `accion` distinta de `borrador` o con `publicarEn`) con los bloques de la plantilla ocultos (hero, metricas,
        pasos, testimonios, faq, bloglista, cta). «General» no vale como sector (422 NO_VALIDO). Los campos de landing en
        una página general dan 422 NO_ES_LANDING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginaSitioEntrada'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/paginas/{paginaId}:
    parameters:
    - name: paginaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Sitio web
      summary: Cambiar el título, la ruta o el estado de una página (HU-1502)
      operationId: patch_sitio_paginas_id
      description: |-
        Solo SUPERADMIN. `accion`: `publicar` (PUBLICADA, `publicadaEn` = ahora, limpia `publicarEn`), `programar` (exige
        `publicarEn` futuro con zona, 422 PUBLICAR_EN_REQUERIDO o PUBLICAR_EN_PASADO) o `borrador` (limpia `publicarEn`).
        `publicarEn` sin `programar` da 422 PUBLICAR_EN_SIN_PROGRAMAR. HU-1512 · Si cambia la ruta de una PUBLICADA, se
        crea sola la redirección 301 de la ruta anterior a la nueva (si no hay una desde esa ruta y no forma bucle ni
        cadena); la respuesta trae `redireccion` y `avisoRedireccion` (si no se pudo crear, solo el aviso, y la ruta
        cambia igual). Auditoría SITIO_PAGINA_EDITADA, SITIO_PAGINA_PUBLICADA, SITIO_PAGINA_PROGRAMADA o
        SITIO_PAGINA_A_BORRADOR. Una programada la publica sola la cola `mantenimiento` (cada 30 s, CP-111).
        HU-1505: con `accion=publicar` en producción (`SITIO_ENTORNO`) y algún dato ficticio visible, 409
        FICTICIOS_VISIBLES con `detalles` (id, coleccion, nombre) (CP-116); en pruebas publica y trae `avisoFicticios`
        (CP-117). En producción la cola tampoco publica una programada mientras haya ficticios visibles: queda
        SITIO_PAGINA_BLOQUEADA en la auditoría una vez.
        HU-1507: `publicar` una página, o pasar a `borrador` o `programar` una PUBLICADA, crea una versión del sitio
        con origen `pagina` (el sitio completo del panel, RN-16-5) y la respuesta trae `version`. La cola crea una con
        origen `programada` al publicar las programadas.
        HU-1514 · En una landing se cambian además `sector`, `portada`, `metaTitulo` y `blogCategoriaInicial` (texto
        plano; vacío guarda null; en una página general, 422 NO_ES_LANDING). La ruta no cambia al cambiar el sector.
        RN-16-9: una landing sin título y texto de portada y sin meta título no se publica ni se programa, ni se deja
        así si ya está publicada o programada: 422 LANDING_INCOMPLETA con `detalles` (campo, mensaje).
        HU-1512 · SEO de cualquier página (PNT-26): `metaTitulo` (hasta 60), `metaDescripcion` (hasta 160), ambos en texto
        plano (RN-16-7; vacío guarda null), `canonical` (ruta interna o https:// con dominio), `indexar` y
        `datosEstructurados` (WebPage, FAQPage o Product). 422 NO_VALIDO con `detalles`. Llegan al sitio con «Publicar
        cambios» y quedan en SITIO_PAGINA_EDITADA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginaSitioCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Borrar una página en borrador (HU-1502)
      operationId: delete_sitio_paginas_id
      description: Solo SUPERADMIN y solo en BORRADOR (422 PAGINA_NO_BORRADOR si está programada o publicada). Auditoría SITIO_PAGINA_BORRADA.
      responses:
        '204':
          description: Borrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/paginas/{paginaId}/bloques:
    parameters:
    - name: paginaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Sitio web
      summary: Bloques de una página, visibles y ocultos, por orden (HU-1503)
      operationId: get_sitio_paginas_id_bloques
      description: Solo SUPERADMIN. 404 si la página no existe.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags:
      - Sitio web
      summary: Agregar un bloque del catálogo al final, oculto (HU-1503, RN-16-2)
      operationId: post_sitio_paginas_id_bloques
      description: Solo SUPERADMIN. Tipo fuera del catálogo o campos de más dan 422; ajustes de más de 20 000 caracteres en JSON, 422 AJUSTES_GRANDES. Auditoría SITIO_BLOQUE_AGREGADO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueSitioEntrada'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    patch:
      tags:
      - Sitio web
      summary: Reordenar los bloques con la lista completa de ids (HU-1503, CP-113)
      operationId: patch_sitio_paginas_id_bloques
      description: |-
        Solo SUPERADMIN. `orden` lleva todos los bloques de la página, una vez cada uno. Si falta, se repite o es de otra
        página, 422 ORDEN_INVALIDO con `detalles[0].tipo` FALTANTE, DUPLICADO o AJENO. Auditoría SITIO_BLOQUES_REORDENADOS
        (solo si el orden cambió).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenBloques'
      responses:
        '200':
          description: Bloques en el orden nuevo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/paginas/{paginaId}/bloques/{bloqueId}:
    parameters:
    - name: paginaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: bloqueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Sitio web
      summary: Mostrar u ocultar un bloque sin tocar sus ajustes (HU-1503, CP-112)
      operationId: patch_sitio_paginas_id_bloques_id
      description: Solo SUPERADMIN. 404 si el bloque no es de esa página. Auditoría SITIO_BLOQUE_MOSTRADO o SITIO_BLOQUE_OCULTADO (solo si cambia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueSitioCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Borrar un bloque y compactar el orden (HU-1503)
      operationId: delete_sitio_paginas_id_bloques_id
      description: Solo SUPERADMIN. El resto queda en 0, 1, 2… sin huecos. Auditoría SITIO_BLOQUE_BORRADO con el tipo y los ajustes borrados.
      responses:
        '204':
          description: Borrado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /sitio/elementos:
    get:
      tags:
      - Sitio web
      summary: Elementos de una colección de contenido, visibles y ocultos, por orden (HU-1504)
      operationId: get_sitio_elementos
      description: Solo SUPERADMIN. 422 si `coleccion` falta o no es una de las 7. HU-1510 · Solo los del idioma pedido (`es` por defecto); 422 con otro idioma.
      parameters:
      - name: coleccion
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ColeccionContenido'
      - $ref: '#/components/parameters/IdiomaSitio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
    post:
      tags:
      - Sitio web
      summary: Agregar un elemento al final de su colección, oculto (HU-1504, CP-115)
      operationId: post_sitio_elementos
      description: |-
        Solo SUPERADMIN. `datos` lleva solo los campos de la colección (`@aptio/schema/sitio-contenido`), en texto plano:
        con etiquetas HTML, campos de más o faltantes responde 422 DATOS_NO_VALIDOS con `detalles` por campo (RN-16-7).
        Nace con `visible` en false (RN-16-2). Auditoría SITIO_ELEMENTO_AGREGADO. HU-1510 · `idioma` (`es` por defecto): va al
        final de su colección en ese idioma; cada idioma tiene su orden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementoSitioEntrada'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
    patch:
      tags:
      - Sitio web
      summary: Reordenar una colección con la lista completa de ids (HU-1504)
      operationId: patch_sitio_elementos
      description: Solo SUPERADMIN. Si falta, se repite o es de otra colección, 422 ORDEN_INVALIDO con `detalles[0].tipo` FALTANTE, DUPLICADO o AJENO. Auditoría SITIO_ELEMENTOS_REORDENADOS (solo si cambió).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenElementos'
      responses:
        '200':
          description: La colección en el orden nuevo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/elementos/{elementoId}:
    parameters:
    - name: elementoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Sitio web
      summary: Cambiar los datos o la visibilidad de un elemento (HU-1504, CP-114)
      operationId: patch_sitio_elementos_id
      description: |-
        Solo SUPERADMIN. `datos` es parcial: se validan los campos que trae y un opcional vacío se quita. Ocultar no borra
        los datos y el elemento deja de salir en todas las páginas. Sin `datos` ni `visible`, 422 SIN_CAMBIOS. Auditoría
        SITIO_ELEMENTO_EDITADO, SITIO_ELEMENTO_MOSTRADO o SITIO_ELEMENTO_OCULTADO (solo si cambia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementoSitioCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Borrar un elemento y compactar su colección (HU-1504)
      operationId: delete_sitio_elementos_id
      description: Solo SUPERADMIN. Auditoría SITIO_ELEMENTO_BORRADO con los datos borrados.
      responses:
        '204':
          description: Borrado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /sitio/ficticios:
    get:
      tags:
      - Sitio web
      summary: Datos ficticios visibles del sitio y el entorno (HU-1505, RN-16-3)
      operationId: get_sitio_ficticios
      description: Solo SUPERADMIN. `entorno` sale de `SITIO_ENTORNO` (sin definir o con otro valor, `produccion`). La lista son los elementos con `ficticio` y `visible`, por colección y orden.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicticiosSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /sitio/ficticios/ocultar:
    post:
      tags:
      - Sitio web
      summary: Ocultar todos los datos ficticios visibles (HU-1505, CP-116)
      operationId: post_sitio_ficticios_ocultar
      description: Solo SUPERADMIN. Pone `visible` en false a todos los ficticios visibles de una vez; conservan sus datos y su marca. Auditoría SITIO_FICTICIOS_OCULTADOS con sus ids.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/FicticiosSitio'
                - type: object
                  required:
                  - ocultados
                  properties:
                    ocultados:
                      type: integer
                      minimum: 0
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /sitio/publicar:
    post:
      tags:
      - Sitio web
      summary: Publicar los cambios del panel como una versión nueva del sitio (HU-1507, RN-16-5)
      operationId: post_sitio_publicar
      description: |-
        Solo SUPERADMIN. Arma la instantánea del sitio completo (páginas PUBLICADAS con sus bloques y elementos visibles
        en orden, y el menú y el pie visibles) y crea la versión siguiente, inmutable, con origen `publicacion`. El sitio
        público sirve solo la última. En producción, con algún dato ficticio visible, 409 FICTICIOS_VISIBLES con
        `detalles` (id, coleccion, nombre) y no crea nada (CP-116); en pruebas publica y trae `avisoFicticios` (CP-117).
        Una instantánea de producción nunca guarda un ficticio. Auditoría SITIO_VERSION_PUBLICADA.
      responses:
        '201':
          description: Versión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPublicada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
  /sitio/versiones:
    get:
      tags:
      - Sitio web
      summary: Versiones publicadas del sitio y si hay cambios sin publicar (HU-1507)
      operationId: get_sitio_versiones
      description: |-
        Solo SUPERADMIN. Las 50 más recientes, de la mayor a la menor; se conservan todas (`total`). `actual` es la que
        ve el sitio (null si aún no hay ninguna). `pendientes` compara por contenido la instantánea del panel con la
        última versión; sin versiones, es true si hay algo publicable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionesSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /sitio/versiones/{numero}/restaurar:
    parameters:
    - name: numero
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      tags:
      - Sitio web
      summary: Restaurar una versión del sitio (HU-1507, CP-119)
      operationId: post_sitio_versiones_numero_restaurar
      description: |-
        Solo SUPERADMIN. Crea la versión siguiente (origen `restauracion`, `restauradaDe` = N) con la instantánea de la
        N: el sitio público queda igual a la N y lo que se edita en el panel no cambia. 404 si no existe, 422
        VERSION_ACTUAL si ya es la que ve el sitio, y en producción 409 FICTICIOS_VISIBLES si la instantánea guarda
        datos ficticios (una versión publicada en pruebas). 400 si `numero` no es entero. Auditoría
        SITIO_VERSION_RESTAURADA.
      responses:
        '201':
          description: Versión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionSitio'
        '400':
          $ref: '#/components/responses/NoValido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/resumen:
    get:
      tags:
      - Sitio web
      summary: Resumen del sitio comercial (HU-1607, PNT-24, CP-138)
      operationId: get_sitio_resumen
      description: |-
        Solo SUPERADMIN. El período termina hoy en hora de Lima (UTC−5) e incluye hoy; el anterior tiene el mismo largo y
        termina el día antes. `visitas` son las sesiones que empezaron en el sitio (`SitioVisitaDia.visitas`, del contador
        anónimo de `POST /s/_visita`); `leads` son los leads creados en el período (tabla Lead, por `creadoEn`: un correo
        que vuelve a escribir no suma otro) y `demos`, las citas creadas en el período con cualquier estado (tabla
        AgendaCita). `suscripciones` es null hasta el S13. `variacion` es el % contra el período anterior con un decimal
        (null si antes fue 0). `origenes` trae los 7 orígenes de lead, de más a menos, con porcentajes enteros que suman
        100 por el método del mayor resto (0 sin leads). `paginas`: hasta 5, con leads de esa página de entrada entre las
        visitas que empezaron en ella. `proximasDemos`: las 5 siguientes confirmadas.
      parameters:
      - name: periodo
        in: query
        required: false
        schema:
          type: string
          enum: [7d, 30d, 90d]
          default: 30d
        description: 7 días, 30 días o trimestre (90 días)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/ajustes:
    get:
      tags:
      - Sitio web
      summary: Ajustes del sitio (HU-1509, PNT-38)
      operationId: get_sitio_ajustes
      description: |-
        Solo SUPERADMIN. Una sola fila para la plataforma; sin ella, los valores por defecto (`nombre` Aptio SCORM, todo
        lo demás vacío) y `actualizadoEn` null.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjustesSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    patch:
      tags:
      - Sitio web
      summary: Cambiar los ajustes del sitio (HU-1509, REQ-073)
      operationId: patch_sitio_ajustes
      description: |-
        Solo SUPERADMIN. Se mezcla con lo guardado y se valida todo junto: dominio sin protocolo ni ruta (se guarda en
        minúsculas), nombre en texto plano de hasta 60 caracteres, GA4 `G-…`, Tag Manager `GTM-…` y Meta Pixel de 10 a 20
        dígitos (en mayúsculas), WhatsApp en E.164 (obligatorio si `visible`), correo de leads y aviso de mantenimiento
        de hasta 280 caracteres. Un texto vacío se guarda como null. Nombre, dominio, logo, favicon y WhatsApp llegan al
        sitio con «Publicar cambios» (entran en la instantánea); el correo de leads y el mantenimiento valen al instante.
        Los IDs de analítica y el aviso de cookies también salen con «Publicar cambios» (HU-1606). 422 SIN_CAMBIOS si no trae nada y
        NO_VALIDO con `detalles` (campo y mensaje). Auditoría SITIO_AJUSTES_ACTUALIZADOS y, al cambiar el mantenimiento,
        SITIO_MANTENIMIENTO_ACTIVADO o SITIO_MANTENIMIENTO_DESACTIVADO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjustesSitioCambio'
      responses:
        '200':
          description: Los ajustes guardados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjustesSitio'
        '400':
          $ref: '#/components/responses/NoValido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/ajustes/marca/{tipo}:
    parameters:
    - name: tipo
      in: path
      required: true
      schema:
        type: string
        enum:
        - logo
        - favicon
    put:
      tags:
      - Sitio web
      summary: Subir el logo o el favicon del sitio (HU-1509)
      operationId: put_sitio_ajustes_marca
      description: |-
        Solo SUPERADMIN. El cuerpo es el archivo tal cual, SVG o PNG de hasta 200 KB. El SVG se sanea (sin scripts,
        eventos ni enlaces externos) y el PNG se comprueba por su firma. Se guarda en el bucket como
        `sitio/marca/{tipo}-{sha8}.{ext}`, se sirve en `/s/_marca/` con caché de un año y sale al sitio con «Publicar
        cambios». 413 DEMASIADO_GRANDE si pasa de 200 KB; 422 ARCHIVO_NO_VALIDO si no es un SVG o un PNG válido; 404 con
        otro `tipo`. Auditoría SITIO_AJUSTES_ACTUALIZADOS.
      requestBody:
        required: true
        content:
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Los ajustes con el archivo nuevo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjustesSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '413':
          description: El archivo supera los 200 KB (DEMASIADO_GRANDE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Quitar el logo o el favicon del sitio (HU-1509)
      operationId: delete_sitio_ajustes_marca
      description: Solo SUPERADMIN. El sitio vuelve al logo o al favicon por defecto al publicar. El archivo queda en el bucket porque lo usan las versiones anteriores.
      responses:
        '200':
          description: Los ajustes sin el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjustesSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'

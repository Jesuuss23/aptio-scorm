      operationId: get_publico_planes_slug
      security: []
      description: |-
        Sin sesión. Lee la última versión publicada del sitio (no lo que se edita en el panel): un precio nuevo se ve al
        publicar (CP-141). 404 NO_ENCONTRADO si el plan está oculto, no existe, la versión no publica planes (ninguna
        página publicada los muestra) o, en producción, si es ficticio (CP-142). Solo las características visibles.
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$'
          example: productora
      responses:
        '200':
          description: OK
          content:

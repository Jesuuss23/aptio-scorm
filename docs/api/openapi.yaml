  /sitio/blog/sincronizar:
    post:
      tags:
      - Sitio web
      summary: Sincronizar ahora con WordPress (HU-1511, CP-154)
      operationId: post_sitio_blog_sincronizar
      description: |-
        Solo SUPERADMIN. Encola la tarea `blog-sincronizar` sin esperar la frecuencia; si ya hay una pedida esperando o
        corriendo, esa sirve. El worker lee `/wp-json/wp/v2/categories` y `/wp-json/wp/v2/posts?status=publish&_embed`
        (hasta 100, 10 s como máximo, sin seguir redirecciones y sin dominios que apunten a la red interna), guarda solo
        los artículos publicados sin clave (CP-154), copia la imagen destacada de hasta 800 px a `/s/_blog/` y, si algo
        cambió, vuelve a renderizar la versión vigente. Si WordPress no responde, la copia queda y `error` lo cuenta
        (CP-156). El resultado se lee con `GET /sitio/blog`. 422 SIN_URL; 503 COLAS_NO_DISPONIBLES.
      responses:
        '202':
          description: Encolada
          content:
            application/json:
              schema:
                type: object
                required:
                - encolado
                properties:
                  encolado:
                    type: boolean
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
        '503':
          description: COLAS_NO_DISPONIBLES
          content:

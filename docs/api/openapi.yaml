        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NarracionSolicitud'
      responses:
        '202':
          description: Generación continuada con las etapas 6 a 8 en cola

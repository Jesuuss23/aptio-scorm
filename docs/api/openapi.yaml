  /cursos/{cursoId}/narraciones/{pantallaId}/grabacion:
    post:
      tags:
      - Personaje y voz
      summary: Usar la grabación del cliente con boca automática
      operationId: post_cursos_cursoId_narraciones_pantallaId_grabacion
      description: >-
        HU-0704 (CP-074, REQ-023, RN-07-4). La grabación del cliente pasa a ser la narración en español de la pantalla.
        Exige `autorizado` en true (si no, 422 `AUTORIZACION_REQUERIDA`) y un audio del proyecto del curso, listo y
        transcrito (si no, 422 `AUDIO_NO_VALIDO`; también si se pide `usarLimpio` sin la versión limpia lista). En una
        versión del curso, el texto de la narración pasa a ser la transcripción y la pista `es` queda con
        `voz.proveedor` cliente, `grabacion` (material, audio usado, quién autorizó y cuándo) y estado pendiente; la
        pantalla vuelve a borrador. El worker (cola voz, tarea GRABACION) pasa el audio a MP3 con ffmpeg, calcula la boca
        con el calculador de la etapa 7 y arma el WebVTT con los segmentos reales de la transcripción; el MP3 queda como
        recurso propio del curso (origen SUBIDO, licencia «Grabación del cliente») sin fecha de borrado. La narración
        queda GENERANDO hasta entonces y luego ACTUALIZADA. La regeneración con la voz de la IA no toca una grabación.
        Roles del equipo; el revisor del cliente recibe 403. 409 `VERSION_CAMBIO` si la versión cambió.
      parameters:

  /cursos/{cursoId}/pantallas/{pantallaId}:
    patch:
      tags:
      - Curso
      summary: Guardar cambios del editor en una pantalla
      operationId: patch_cursos_cursoId_pantallas_pantallaId
      description: Dispara regeneración en cascada solo de lo afectado. La pantalla vuelve a borrador (RN-05-2); 409 VERSION_CAMBIO
        si otra persona guardó antes. HU-0503 (SUP-38) · si cambia la narración en español de una pantalla que ya tenía
        voz, se encola un trabajo CASCADA (cola voz) que regenera su voz, boca y subtítulos 1 s después del último
        guardado (varios guardados seguidos dejan un solo trabajo, CP-051) y espera a que termine una generación en
        curso. `regenerando` lista lo que se regenera; el avance se sigue en `GET /cursos/{cursoId}/narraciones`.
        HU-0602 · `ajustes` guarda los retoques del editor por elemento, aparte del contenido (RN-06-1); 422 BLOQUE_NO_EXISTE
        si el elemento no está en la pantalla, COLOR_FUERA_DEL_KIT si un color no es un rol del kit (RN-06-4) y
        CURSO_NO_VALIDO si un valor sale del esquema. HU-0605 · `disposicion` cambia el diseño de la pantalla (CP-060);
        422 DISENO_NO_PERMITIDO si la pantalla tiene una actividad, un video o es la de resultados, o si el diseño no es
        de contenido. HU-0606 · `extras` reemplaza los elementos agregados de la pantalla; 422 EXTRA_NO_VALIDO si un id
        se repite o es el de un bloque. `ajustes` acepta también ids de extras. HU-0607 · Deshacer y rehacer del editor
        mandan el mismo cambio con `motivo` (`deshacer` o `rehacer`), que rotula la versión. HU-0610 · `disparadores`
        reemplaza la lista de disparadores de la pantalla (CP-069); 422 DISPARADOR_NO_VALIDO con `detalles` si hay más de
        10, un id se repite, falta el segundo o sale de 0 a 600, o el elemento o la pantalla no existen. Quitar un extra
        borra los disparadores que lo muestran u ocultan. HU-0901 · `marcadores` reemplaza, por id del bloque de video, sus
        marcadores (CP-080); 422 MARCADOR_NO_VALIDO con `detalles` si un tiempo es negativo o pasa la duración conocida del
        video, un id se repite o una pregunta no tiene enunciado, 2 opciones y exactamente 1 correcta; BLOQUE_NO_EXISTE si el
        bloque no es un video de la pantalla. HU-0902 · `reglasVideo` fija, por id del bloque de video, «impedir adelantar»
        (CP-081) y conserva `porcentajeMinimo` si no se manda; 422 REGLA_VIDEO_NO_VALIDA si `impedirAdelantar` no es sí o
        no, el porcentaje sale de 0 a 100 o trae otros campos; BLOQUE_NO_EXISTE si el bloque no es un video de la pantalla.
        HU-0609 · Un extra `imagen` muestra una pieza de la biblioteca del kit (`pieza`) o una imagen subida (`recursoId`),
        no las dos. Si el `recursoId` es una imagen (PNG, JPEG o WebP) o un SVG subido o generado en el proyecto del curso y
        aún no está en `recursos`, se suma con origen `subido` en la misma versión; una imagen subida que ya ningún elemento
        usa sale de `recursos` (Deshacer revierte las dos cosas). 422 RECURSO_NO_VALIDO si el recurso no existe, es de otro
        proyecto, es material del cliente o no es una imagen; EXTRA_NO_VALIDO si trae `pieza` y `recursoId` juntos, o
        `pieza` o `decorativa` fuera de una imagen. El revisor del cliente no edita (403).
      parameters:
      - name: cursoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pantallaId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantallaCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioResultado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'

components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: sesion
  responses:
    NoAutenticado:
      description: Sin sesión
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol no permite la acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: No existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoValido:
      description: Datos no válidos (incluye errores del esquema del curso)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Versión desactualizada o trabajo en curso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Salud:
      type: object
      required:
      - estado
      - servicio
      - baseDatos
      - fecha
      properties:
        estado:
          type: string
          enum:
          - ok
          - degradado
        servicio:
          type: string
          example: Aptio SCORM API
        baseDatos:
          type: string
          enum:
          - ok
          - error
        fecha:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - codigo
      - mensaje
      properties:
        codigo:
          type: string
          example: CONFLICTO_VERSION
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: object
            additionalProperties: true
    TextoI18n:
      type: object
      properties:
        es:
          type: string
        en:
          type: string
      description: Texto por idioma
    Rol:
      type: string
      description: SUPERADMIN es de plataforma (ADR-011); un administrador no puede asignarlo.
      enum:
      - SUPERADMIN
      - ADMINISTRADOR
      - DISENADOR_INSTRUCCIONAL
      - DISENADOR_GRAFICO
      - PRODUCTOR
      - REVISOR_CLIENTE
    Usuario:
      type: object
      required:
      - id
      - email
      - nombre
      - rol
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        clienteId:
          type: string
          format: uuid
          nullable: true
        activo:
          type: boolean
        metodos:
          type: array
          items:
            type: string
            enum:
            - clave
            - google
    UsuarioEntrada:
      type: object
      required:
      - email
      - nombre
      - rol
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        clienteId:
          type: string
          format: uuid
          description: Obligatorio para REVISOR_CLIENTE; debe ser un cliente de la organización.
    UsuarioCambio:
      type: object
      description: Cambiar el rol o desactivar cierra las sesiones abiertas del usuario.
      properties:
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        clienteId:
          type: string
          format: uuid
        activo:
          type: boolean
    Ingreso:
      type: object
      required:
      - email
      - clave
      properties:
        email:
          type: string
          format: email
        clave:
          type: string
    SolicitudClave:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
      description: Siempre responde 202, exista o no el correo (no revela cuentas).
    NuevaClave:
      type: object
      required:
      - token
      - clave
      properties:
        token:
          type: string
        clave:
          type: string
          minLength: 10
      description: Token de un solo uso, vence en 60 minutos. Clave de al menos 10 caracteres.
    Sesion:
      type: object
      required:
      - usuario
      - expira
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        expira:
          type: string
          format: date-time
      description: La sesión viaja en una cookie httpOnly; esta respuesta solo informa.
    Cliente:
      type: object
      required:
      - id
      - nombre
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        lmsHabitual:
          type: string
          nullable: true
        idiomas:
          type: array
          items:
            type: string
            enum:
            - es
            - en
        notas:
          type: string
          nullable: true
        retencionDocumentosDias:
          type: integer
          description: Días tras la entrega para borrar los documentos fuente (ADR-009)
        tieneKit:
          type: boolean
        creadoEn:
          type: string
          format: date-time
    ClienteEntrada:
      type: object
      required:
      - nombre
      properties:
        nombre:
          type: string
          minLength: 2
        lmsHabitual:
          type: string
        idiomas:
          type: array
          items:
            type: string
            enum:
            - es
            - en
        notas:
          type: string
        retencionDocumentosDias:
          type: integer
          minimum: 1
          maximum: 3650
          default: 180
    ClienteCambio:
      type: object
      description: Igual que ClienteEntrada, con todos los campos opcionales.
      properties:
        nombre:
          type: string
          minLength: 2
        lmsHabitual:
          type: string
        idiomas:
          type: array
          items:
            type: string
            enum:
            - es
            - en
        notas:
          type: string
        retencionDocumentosDias:
          type: integer
          minimum: 1
          maximum: 3650
    Paleta:
      type: object
      required:
      - primario
      - secundario
      - acento
      - fondo
      - texto
      properties:
        primario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        secundario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        acento:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        fondo:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        texto:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
    Voz:
      type: object
      required:
      - proveedor
      - voz
      properties:
        proveedor:
          type: string
          example: google
        voz:
          type: string
          example: es-US-Neural2-A
        velocidad:
          type: number
          minimum: 0.5
          maximum: 2
    KitMarca:
      type: object
      required:
      - id
      - clienteId
      - estilo
      - paleta
      - voces
      - version
      properties:
        id:
          type: string
          format: uuid
        clienteId:
          type: string
          format: uuid
        estilo:
          $ref: '#/components/schemas/EstiloKit'
        paleta:
          $ref: '#/components/schemas/Paleta'
        tipografias:
          $ref: '#/components/schemas/Tipografias'
        logoRecursoId:
          type: string
          format: uuid
          nullable: true
        logoUrl:
          type: string
          format: uri

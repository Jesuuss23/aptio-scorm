  /sitio/ajustes/dominio/comprobar:
    post:
      tags:
      - Sitio web
      summary: Comprobar el certificado SSL del dominio guardado (HU-1509)
      operationId: post_sitio_ajustes_dominio_comprobar
      description: |-
        Solo SUPERADMIN. Abre una conexión TLS al puerto 443 del dominio guardado (5 s como máximo) y devuelve si el
        certificado es válido para ese dominio, su emisor y su vencimiento, o el error. No emite certificados: eso lo hace
        el servicio que publica el sitio (HU-1405). 422 SIN_DOMINIO si no hay dominio guardado.
      responses:

      - Sitio web
      summary: Guardar la conexión y las opciones de la sección Blog (HU-1511)
      operationId: patch_sitio_blog
      description: |-
        Solo SUPERADMIN. `url` es https:// con un dominio público, sin usuario, clave, puerto, parámetros ni IP; se guarda
        sin / final; vacía o null desconecta (la sección Blog y «Últimos artículos» dejan de salir). Otra URL es otro blog:
        la copia anterior se borra y se encola la primera sincronización. `frecuenciaMin` es 15, 30 o 60; `porPagina`, de 3
        a 12. Los cambios que se ven en el sitio (URL, número por filtro, imagen y autor) vuelven a renderizar la versión
        vigente, sin «Publicar cambios». Auditoría SITIO_BLOG_ACTUALIZADO. 422 NO_VALIDO con `detalles` o SIN_CAMBIOS.
      requestBody:

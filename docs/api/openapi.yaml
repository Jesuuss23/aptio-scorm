        Solo SUPERADMIN. Las mismas reglas que al agregarla, contra las demás: activar una que formaría una cadena da 422
        REDIRECCION_EN_CADENA. Auditoría SITIO_REDIRECCION_EDITADA con los valores de antes.
      requestBody:

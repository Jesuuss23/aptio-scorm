  /captacion/leads/{leadId}:
    patch:
      tags:
      - Captación
      summary: Cambiar la etapa de un lead en el embudo (HU-1601, PNT-34)
      operationId: patch_captacion_lead
      description: Solo SUPERADMIN. Auditoría LEAD_ETAPA_CAMBIADA con la etapa anterior y la nueva. HU-1602 · La etapa nueva se encola a las conexiones activas (`lead.actualizado`). 404 si el lead no existe.
      parameters:

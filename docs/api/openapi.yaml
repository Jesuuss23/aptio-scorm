  /materiales/{materialId}/limpiar:
    post:
      tags:
      - Personaje y voz
      summary: Limpiar el ruido del audio del cliente
      operationId: post_materiales_materialId_limpiar
      description: >-
        HU-0704 (REQ-024). Encola en la cola media la reducción de ruido y la normalización a −16 LUFS con ffmpeg
        (afftdn y loudnorm). El resultado es un audio nuevo ligado al material, con la misma retención que el original,

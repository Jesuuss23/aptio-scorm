      operationId: post_conexiones_ia_tarea_probar
      description: 'HU-1304 · Solo ADMINISTRADOR. En modo simulado responde «simulado, OK» sin llamar a nadie. En modo real hace una llamada mínima (1 token de Claude o una palabra de voz) y devuelve el resultado con la latencia; no se registra en TrabajoIA. Un error del proveedor se informa con su estado HTTP, nunca con la clave.'
      parameters:
      - name: tarea
        in: path
        required: true
        description: Tarea de la lista cerrada, sin distinguir mayúsculas (404 si no es de la lista)
        schema:
          type: string
          enum:
          - texto
          - pantallas
          - traduccion
          - calidad
          - voz
          - imagen
          - boca
          - transcripcion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruebaProveedor'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: sesion
  responses:
    NoAutenticado:
      description: Sin sesión
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol no permite la acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: No existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoValido:
      description: Datos no válidos (incluye errores del esquema del curso)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Versión desactualizada o trabajo en curso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DemasiadasSolicitudes:
      description: Más de 60 peticiones por minuto desde la misma IP en `/publico/*` (DEMASIADAS_SOLICITUDES, con Retry-After)
      headers:
        Retry-After:
          description: Segundos hasta que se abre la siguiente ventana
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PaginaSitio:
      type: object
      description: Página del sitio comercial (M16). Bloques (HU-1503), SEO (HU-1512) y landings de sector (HU-1514) llegan con sus historias.
      required:
      - id
      - ruta
      - idioma
      - titulo
      - estado
      - publicarEn
      - publicadaEn
      - creadoEn
      - actualizadoEn
      properties:
        id:
          type: string
          format: uuid
        ruta:
          type: string
          example: /precios
        idioma:
          type: string
          enum:
          - es
          - en
        titulo:
          type: string
        estado:
          type: string
          enum:
          - BORRADOR
          - PROGRAMADA
          - PUBLICADA
        publicarEn:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se publica sola (solo PROGRAMADA)
        publicadaEn:
          type: string
          format: date-time
          nullable: true
          description: Última vez que pasó a PUBLICADA
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    PaginaSitioEntrada:
      type: object
      additionalProperties: false
      required:
      - ruta
      - titulo
      properties:
        ruta:
          type: string
          maxLength: 200
          pattern: ^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$
          example: /precios
        idioma:
          type: string
          enum:
          - es
          - en
          default: es
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        accion:
          $ref: '#/components/schemas/AccionPagina'
        publicarEn:
          type: string
          format: date-time
          example: '2026-11-20T09:00:00-05:00'
          description: Solo con accion=programar; con zona horaria
    PaginaSitioCambio:
      type: object
      additionalProperties: false
      properties:
        ruta:
          type: string
          maxLength: 200
          pattern: ^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$
          description: No se cambia en una página PUBLICADA (422 RUTA_PUBLICADA)
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        accion:
          $ref: '#/components/schemas/AccionPagina'
        publicarEn:
          type: string
          format: date-time
          example: '2026-11-20T09:00:00-05:00'
          description: Solo con accion=programar; con zona horaria y en el futuro
    AccionPagina:
      type: string
      enum:
      - borrador
      - programar
      - publicar
      description: borrador (limpia publicarEn), programar (exige publicarEn futuro) o publicar (ahora)
    TipoBloque:
      type: string
      description: Catálogo cerrado de bloques del sitio (HU-1503, `@aptio/schema/sitio-bloques`)
      enum:
      - hero
      - confianza
      - metricas
      - logos
      - pasos
      - funcionalidades
      - lms
      - planes
      - testimonios
      - faq
      - cta
      - fhero
      - comparacion
      - precios
      - comparativa
      - bloglista
      - sectores
      - agendador
    BloqueSitio:
      type: object
      required:
      - id
      - paginaId
      - tipo
      - orden
      - visible
      - ajustes
      - creadoEn
      - actualizadoEn
      properties:
        id:
          type: string
          format: uuid
        paginaId:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoBloque'
        orden:
          type: integer
          minimum: 0
          description: Posición 0, 1, 2… sin huecos
        visible:
          type: boolean
          description: Nace en false (RN-16-2)
        ajustes:
          type: object
          nullable: true
          additionalProperties: true
          description: Datos propios del bloque; ocultarlo no los borra (CP-112)
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    BloqueSitioEntrada:
      type: object
      additionalProperties: false
      required:
      - tipo
      properties:
        tipo:
          $ref: '#/components/schemas/TipoBloque'
        ajustes:
          type: object
          additionalProperties: true
          description: Hasta 20 000 caracteres en JSON
    OrdenBloques:
      type: object
      additionalProperties: false
      required:
      - orden
      properties:
        orden:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Todos los bloques de la página, una vez cada uno, en el orden nuevo
    BloqueSitioCambio:
      type: object
      additionalProperties: false
      required:
      - visible
      properties:
        visible:
          type: boolean
    ColeccionContenido:
      type: string
      description: Colecciones de contenido del sitio (HU-1504, `@aptio/schema/sitio-contenido`)
      enum:
      - cifras
      - testimonios
      - logos
      - funcionalidades
      - pasos
      - lms
      - preguntas
    ElementoSitio:
      type: object
      required:
      - id
      - coleccion
      - orden
      - visible
      - datos
      - creadoEn
      - actualizadoEn
      properties:
        id:
          type: string
          format: uuid
        coleccion:
          $ref: '#/components/schemas/ColeccionContenido'
        orden:
          type: integer
          minimum: 0
        visible:
          type: boolean
          description: Nace en false (RN-16-2)
        datos:
          $ref: '#/components/schemas/DatosElemento'
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
    DatosElemento:
      type: object
      description: |-
        Campos de la colección, en texto plano. cifras: valor, etiqueta. testimonios: nombre, cargo, empresa, sector?,
        texto, estrellas (1 a 5), desde?. logos: nombre. funcionalidades: etiqueta, titulo, texto, vinetas? (una por
        línea). pasos: titulo, texto. lms: nombre, nota?. preguntas: pregunta, respuesta, pagina? (ruta; vacía = todas).
      additionalProperties:
        oneOf:
        - type: string
        - type: integer
    ElementoSitioEntrada:
      type: object
      additionalProperties: false
      required:
      - coleccion
      - datos
      properties:
        coleccion:
          $ref: '#/components/schemas/ColeccionContenido'
        datos:
          $ref: '#/components/schemas/DatosElemento'
    ElementoSitioCambio:
      type: object
      additionalProperties: false
      properties:
        datos:
          $ref: '#/components/schemas/DatosElemento'
        visible:
          type: boolean
    OrdenElementos:
      type: object
      additionalProperties: false
      required:
      - coleccion
      - orden
      properties:
        coleccion:
          $ref: '#/components/schemas/ColeccionContenido'
        orden:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    BloquePublico:
      type: object
      required:
      - tipo
      - ajustes
      properties:
        tipo:
          $ref: '#/components/schemas/TipoBloque'
        ajustes:
          type: object
          nullable: true
          additionalProperties: true
        elementos:
          type: array
          description: HU-1504 · Solo en bloques con colección (metricas, testimonios, logos, funcionalidades, pasos, lms, faq) y solo los visibles, en orden (RN-16-4, CP-114)
          items:
            type: object
            required:
            - datos
            properties:
              datos:
                $ref: '#/components/schemas/DatosElemento'
    PaginaPublica:
      type: object
      required:
      - ruta
      - idioma
      - titulo
      - publicadaEn
      - bloques
      properties:
        ruta:
          type: string
        idioma:
          type: string
          enum:
          - es
          - en
        titulo:
          type: string
        publicadaEn:
          type: string
          format: date-time
        bloques:
          type: array
          description: Solo los visibles, en orden (HU-1503)
          items:
            $ref: '#/components/schemas/BloquePublico'
    Operacion:
      type: object
      required:
      - generadoEn
      - errores
      - colas
      - etapas
      - respaldos
      properties:
        generadoEn:
          type: string
          format: date-time
        errores:
          type: object
          required:
          - desde24h
          - desde7d
          - porProveedor
          properties:
            desde24h:
              type: string
              format: date-time
            desde7d:
              type: string
              format: date-time
              description: 00:00 de Lima de hace 6 días (7 días contando hoy).
            porProveedor:
              type: array
              items:
                $ref: '#/components/schemas/ErroresProveedor'
        colas:
          type: array
          nullable: true
          description: null si Redis no respondió a tiempo.
          items:
            $ref: '#/components/schemas/EstadoCola'
        etapas:
          type: object
          required:
          - desde
          - porEtapa
          properties:
            desde:
              type: string
              format: date-time
            porEtapa:
              type: array
              items:
                $ref: '#/components/schemas/ResumenEtapa'
        respaldos:
          type: object
          required:
          - retencionDias
          - ultimoExitoso
          - enCurso
          - lista
          properties:
            retencionDias:
              type: integer
              example: 14
            ultimoExitoso:
              type: string
              format: date-time
              nullable: true
            enCurso:
              type: boolean
            lista:
              type: array
              items:
                $ref: '#/components/schemas/Respaldo'
    ErroresProveedor:
      type: object
      required:
      - proveedor
      - errores24h
      - errores7d
      - trabajos7d
      - detenidosPorLimite7d
      - ultimoError
      properties:
        proveedor:
          type: string
          description: anthropic, google, elevenlabs…, `sin-proveedor` o `cola:<nombre>` para lo que falló en la plataforma.
        errores24h:
          type: integer
        errores7d:
          type: integer
        trabajos7d:
          type: integer
        detenidosPorLimite7d:
          type: integer

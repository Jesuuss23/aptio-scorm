        marcadorIds:
          type: array
          maxItems: 12
          items:
            type: string
          description: HU-0903 · Con `pausas-video`, los ids de los marcadores propuestos que se aplican (al menos uno); los
            demás quedan descartados
    PausasPropuestas:
      type: object
      description: HU-0903 · Las pausas propuestas desde la transcripción (salida de IA-09 v2, ya validada con

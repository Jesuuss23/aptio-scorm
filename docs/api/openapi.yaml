openapi: 3.0.3
info:
  title: Aptio SCORM · API
  version: 0.2.0
  license:
    name: Propietario · Grupo de Soluciones Creativas SAC
  description: 'API REST del generador de SCORM con IA. Prefijo /api/v1. Las tareas largas (generación, IA, voz, exportación) responden 202 con
    un trabajo y avisan por eventos (SSE). La IA nunca cambia el curso sin una acción del usuario: crea propuestas.'
servers:
- url: http://localhost:3000/api/v1
  description: Local
- url: https://{entorno}.ejemplo.local/api/v1
  description: Pruebas
  variables:
    entorno:
      default: pruebas
security:
- cookieSesion: []
tags:
- name: Acceso
  description: Sesión con correo y clave o con Google, recuperación de clave, usuarios y roles
- name: Clientes y kits
  description: Clientes, kit de marca, pantallas modelo, glosario, pronunciación y fichas LMS (M02)
- name: Proyectos
  description: Proyectos y material del cliente (M03)
- name: Recursos
  description: 'Archivos en S3: subida, biblioteca e imágenes generadas'
- name: Generación
  description: Generador del SCORM y sus 11 etapas (M04)
- name: Curso
  description: Documento del curso, versiones y cambios del editor (M05, M06)
- name: Asistente IA
  description: Propuestas de la IA que el usuario aplica o descarta
- name: Revisión
  description: Control de calidad, observaciones y comentarios (M05)
- name: Personaje y voz
  description: Narración, boca sincronizada y audio del cliente (M07)
- name: Idiomas
  description: Traducción y revisión ES/EN (M08)
- name: Alineación y navegación
  description: Alineación pedagógica, patrones de navegación y vista previa (M10, M11)
- name: Entrega
  description: Validación y exportación SCORM, HTML y kit de gamificación (M12)
- name: Costos y rentabilidad
  description: Costos de IA, parámetros y mediciones (M13)
- name: Conexiones IA
  description: Proveedor y modelo por tarea (M13)
- name: Plataforma
  description: Salud del servicio y operación (M15)
- name: Sitio web
  description: Sitio comercial administrable, solo superadmin de plataforma (M16, ADR-011)
- name: Sitio público
  description: Rutas sin sesión del sitio comercial, con límite de 60 peticiones por minuto por IP (M16)
paths:
  /salud:
    get:
      tags:
      - Plataforma
      summary: Salud de la API y de la base de datos (CP-001)
      operationId: salud
      security: []
      responses:
        '200':
          description: API y base de datos disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: La base de datos no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /eventos:
    get:
      tags:
      - Plataforma
      summary: Avance de los trabajos de la organización en vivo (SSE, CP-016)
      operationId: get_eventos
      description: 'text/event-stream. `event: trabajo` con un EventoTrabajo en cada cambio de estado o avance; `event: latido` cada 15 s. Solo los trabajos de la organización de la sesión. Equipo de producción (no REVISOR_CLIENTE ni SUPERADMIN).'
      responses:
        '200':
          description: Flujo de eventos
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventoTrabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /sitio/paginas:
    get:
      tags:
      - Sitio web
      summary: Páginas del sitio comercial (HU-1501, HU-1502)
      operationId: get_sitio_paginas
      description: |-
        Solo SUPERADMIN de plataforma (ADR-011): todas las rutas `/sitio/*` responden 403 al administrador de una
        organización y al resto de los roles (CP-109), y 401 sin sesión. Lista todas las páginas, ordenadas por ruta e
        idioma, con su estado, `publicarEn` y `publicadaEn`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginaSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    post:
      tags:
      - Sitio web
      summary: Crear una página (HU-1502)
      operationId: post_sitio_paginas
      description: |-
        Solo SUPERADMIN. Nace en BORRADOR, o PROGRAMADA o PUBLICADA según `accion`. La ruta es `/` o
        `/segmento[/segmento…]` con minúsculas, números y guiones (422). Auditoría SITIO_PAGINA_CREADA. 409 RUTA_EN_USO si
        ya hay una página con esa ruta e idioma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginaSitioEntrada'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/paginas/{paginaId}:
    parameters:
    - name: paginaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Sitio web
      summary: Cambiar el título, la ruta o el estado de una página (HU-1502)
      operationId: patch_sitio_paginas_id
      description: |-
        Solo SUPERADMIN. `accion`: `publicar` (PUBLICADA, `publicadaEn` = ahora, limpia `publicarEn`), `programar` (exige
        `publicarEn` futuro con zona, 422 PUBLICAR_EN_REQUERIDO o PUBLICAR_EN_PASADO) o `borrador` (limpia `publicarEn`).
        `publicarEn` sin `programar` da 422 PUBLICAR_EN_SIN_PROGRAMAR. La ruta no cambia en una PUBLICADA (422
        RUTA_PUBLICADA). Auditoría SITIO_PAGINA_EDITADA, SITIO_PAGINA_PUBLICADA, SITIO_PAGINA_PROGRAMADA o
        SITIO_PAGINA_A_BORRADOR. Una programada la publica sola la cola `mantenimiento` (cada 30 s, CP-111).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaginaSitioCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Borrar una página en borrador (HU-1502)
      operationId: delete_sitio_paginas_id
      description: Solo SUPERADMIN y solo en BORRADOR (422 PAGINA_NO_BORRADOR si está programada o publicada). Auditoría SITIO_PAGINA_BORRADA.
      responses:
        '204':
          description: Borrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/paginas/{paginaId}/bloques:
    parameters:
    - name: paginaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Sitio web
      summary: Bloques de una página, visibles y ocultos, por orden (HU-1503)
      operationId: get_sitio_paginas_id_bloques
      description: Solo SUPERADMIN. 404 si la página no existe.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags:
      - Sitio web
      summary: Agregar un bloque del catálogo al final, oculto (HU-1503, RN-16-2)
      operationId: post_sitio_paginas_id_bloques
      description: Solo SUPERADMIN. Tipo fuera del catálogo o campos de más dan 422; ajustes de más de 20 000 caracteres en JSON, 422 AJUSTES_GRANDES. Auditoría SITIO_BLOQUE_AGREGADO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueSitioEntrada'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    patch:
      tags:
      - Sitio web
      summary: Reordenar los bloques con la lista completa de ids (HU-1503, CP-113)
      operationId: patch_sitio_paginas_id_bloques
      description: |-
        Solo SUPERADMIN. `orden` lleva todos los bloques de la página, una vez cada uno. Si falta, se repite o es de otra
        página, 422 ORDEN_INVALIDO con `detalles[0].tipo` FALTANTE, DUPLICADO o AJENO. Auditoría SITIO_BLOQUES_REORDENADOS
        (solo si el orden cambió).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenBloques'
      responses:
        '200':
          description: Bloques en el orden nuevo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/paginas/{paginaId}/bloques/{bloqueId}:
    parameters:
    - name: paginaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: bloqueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Sitio web
      summary: Mostrar u ocultar un bloque sin tocar sus ajustes (HU-1503, CP-112)
      operationId: patch_sitio_paginas_id_bloques_id
      description: Solo SUPERADMIN. 404 si el bloque no es de esa página. Auditoría SITIO_BLOQUE_MOSTRADO o SITIO_BLOQUE_OCULTADO (solo si cambia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloqueSitioCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloqueSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Borrar un bloque y compactar el orden (HU-1503)
      operationId: delete_sitio_paginas_id_bloques_id
      description: Solo SUPERADMIN. El resto queda en 0, 1, 2… sin huecos. Auditoría SITIO_BLOQUE_BORRADO con el tipo y los ajustes borrados.
      responses:
        '204':
          description: Borrado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /sitio/elementos:
    get:
      tags:
      - Sitio web
      summary: Elementos de una colección de contenido, visibles y ocultos, por orden (HU-1504)
      operationId: get_sitio_elementos
      description: Solo SUPERADMIN. 422 si `coleccion` falta o no es una de las 7.
      parameters:
      - name: coleccion
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ColeccionContenido'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
    post:
      tags:
      - Sitio web
      summary: Agregar un elemento al final de su colección, oculto (HU-1504, CP-115)
      operationId: post_sitio_elementos
      description: |-
        Solo SUPERADMIN. `datos` lleva solo los campos de la colección (`@aptio/schema/sitio-contenido`), en texto plano:
        con etiquetas HTML, campos de más o faltantes responde 422 DATOS_NO_VALIDOS con `detalles` por campo (RN-16-7).
        Nace con `visible` en false (RN-16-2). Auditoría SITIO_ELEMENTO_AGREGADO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementoSitioEntrada'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
    patch:
      tags:
      - Sitio web
      summary: Reordenar una colección con la lista completa de ids (HU-1504)
      operationId: patch_sitio_elementos
      description: Solo SUPERADMIN. Si falta, se repite o es de otra colección, 422 ORDEN_INVALIDO con `detalles[0].tipo` FALTANTE, DUPLICADO o AJENO. Auditoría SITIO_ELEMENTOS_REORDENADOS (solo si cambió).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdenElementos'
      responses:
        '200':
          description: La colección en el orden nuevo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /sitio/elementos/{elementoId}:
    parameters:
    - name: elementoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Sitio web
      summary: Cambiar los datos o la visibilidad de un elemento (HU-1504, CP-114)
      operationId: patch_sitio_elementos_id
      description: |-
        Solo SUPERADMIN. `datos` es parcial: se validan los campos que trae y un opcional vacío se quita. Ocultar no borra
        los datos y el elemento deja de salir en todas las páginas. Sin `datos` ni `visible`, 422 SIN_CAMBIOS. Auditoría
        SITIO_ELEMENTO_EDITADO, SITIO_ELEMENTO_MOSTRADO o SITIO_ELEMENTO_OCULTADO (solo si cambia).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementoSitioCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementoSitio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
    delete:
      tags:
      - Sitio web
      summary: Borrar un elemento y compactar su colección (HU-1504)
      operationId: delete_sitio_elementos_id
      description: Solo SUPERADMIN. Auditoría SITIO_ELEMENTO_BORRADO con los datos borrados.
      responses:
        '204':
          description: Borrado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /publico/paginas:
    get:
      tags:
      - Sitio público
      summary: Una página publicada del sitio (HU-1502, CP-110)
      operationId: get_publico_paginas
      security: []
      description: Sin sesión. 200 solo si la página está PUBLICADA, con `bloques` visibles en su orden (HU-1503, CP-112, CP-113) y, en los bloques con colección, sus `elementos` visibles (HU-1504, CP-114); borrador, programada o inexistente dan 404 sin bloques (CP-110, RN-16-4). 429 DEMASIADAS_SOLICITUDES con más de 60 peticiones por minuto desde la misma IP en `/publico/*`.
      parameters:
      - name: ruta
        in: query
        required: true
        schema:
          type: string
          example: /precios
      - name: idioma
        in: query
        schema:
          type: string
          enum:
          - es
          - en
          default: es
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPublica'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
  /publico/sitemap.xml:
    get:
      tags:
      - Sitio público
      summary: Sitemap con las páginas publicadas (HU-1502)
      operationId: get_publico_sitemap
      security: []
      description: |-
        Sin sesión. Solo las páginas PUBLICADAS, con `SITIO_URL` como dominio (por defecto https://aptioscorm.com) y la
        fecha de publicación como `lastmod`. Las páginas en inglés van bajo `/en` hasta la HU-1510.
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/DemasiadasSolicitudes'
  /operacion:
    get:
      tags:
      - Plataforma
      summary: Errores por proveedor, colas, tiempo y costo por etapa y copias de seguridad (HU-1403)
      operationId: get_operacion
      description: |-
        Empresa › Operación (M15, observabilidad mínima). Solo ADMINISTRADOR (403 al resto, 401 sin sesión).
        Errores por proveedor de la organización en las últimas 24 h y en los últimos 7 días de Lima, desde TrabajoIA y
        los trabajos fallidos de BullMQ sin TrabajoIA (proveedor `cola:<nombre>`); lo detenido por LIMITE_GASTO se cuenta
        aparte. Colas de la plataforma (null si Redis no responde en 2 s). Tiempo y costo promedio de las 11 etapas en 30
        días (organización). Copias de seguridad de la plataforma de los últimos 14 días.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /operacion/respaldar:
    post:
      tags:
      - Plataforma
      summary: Respaldar ahora (HU-1403)
      operationId: post_operacion_respaldar
      description: |-
        Encola una copia de seguridad manual en la cola `mantenimiento` (volcado de PostgreSQL y copia de los objetos de
        S3 al bucket de respaldos) y deja RESPALDO_SOLICITADO en la auditoría. Solo ADMINISTRADOR. 409 RESPALDO_EN_CURSO si
        una copia está corriendo o la manual sigue pendiente; 503 COLAS_NO_DISPONIBLES si Redis no responde.
      responses:
        '202':
          description: Copia en cola
          content:
            application/json:
              schema:
                type: object
                required:
                - encolado
                properties:
                  encolado:
                    type: boolean
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          description: La cola de mantenimiento no responde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trabajos/simulados:
    post:
      tags:
      - Plataforma
      summary: Encolar un trabajo simulado
      operationId: post_trabajos_simulados
      description: 'Encola un trabajo que el worker responde con la salida grabada del caso LOTO (modo simulado). Sirve para probar colas y eventos sin gastar. Solo existe con PROVEEDORES_MODO=simulado (404 en otro caso). 422 TAREA_DESCONOCIDA si no hay salida grabada.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tarea
              properties:
                tarea:
                  type: string
                  pattern: ^(IA-\d\d|VOZ|BOCA)$
                  example: IA-04
      responses:
        '202':
          description: Encolado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /trabajos/{trabajoId}:
    get:
      tags:
      - Plataforma
      summary: Estado de un trabajo
      operationId: get_trabajos_trabajoId
      parameters:
      - name: trabajoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trabajo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /auth/ingresar:
    post:
      tags:
      - Acceso
      summary: Iniciar sesión
      operationId: post_auth_ingresar
      description: Cookie httpOnly; 5 intentos fallidos bloquean 15 min
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ingreso'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '422':
          $ref: '#/components/responses/NoValido'
        '401':
          description: 'CREDENCIALES (correo o clave incorrectos, misma respuesta exista o no el correo) o CUENTA_BLOQUEADA'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/salir:

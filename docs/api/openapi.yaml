        patch no toca `ajustes` ni `extras` (PROPUESTA_NO_APLICA); al aplicar, los extras se conservan y los ajustes de los
        elementos que siguen en la pantalla también, salvo si cambia la disposición, que los reinicia (RN-06-3). Mover o
        retocar un elemento no vence la propuesta: la huella de la pantalla no cuenta los retoques (SUP-43).'

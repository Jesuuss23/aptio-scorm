          description: ficha, la ficha de compatibilidad del cliente; referencia, LIMITE_SUBIDA_REFERENCIA_MB (100 por defecto); null en HTML
        superaLimite:
          type: boolean
        alternativas:
          type: array
          description: Las 5 alternativas de docs/08 cuando se pasa el límite (RN-12-2)
          items:
            type: string
        recursosPesados:
          type: array
          description: Los 5 recursos que más pesan
          items:
            type: object
            required:
            - id
            - nombre
            - bytes
            properties:
              id:
                type: string
              nombre:
                type: string
              bytes:
                type: integer
        suspendDataCaracteres:
          type: integer
          nullable: true
          description: Peor caso de cmi.suspend_data v2 (límite 4096; si se pasa, advertencia); null en HTML
        pantallasTotal:
          type: integer
        pantallasSinAprobar:
          type: integer
          description: Advertencia (RN-12-3); la web pide confirmación al exportar
        recursosFaltantes:
          type: array
          items:
            type: string
        creditos:
          type: object
          allOf:
          - $ref: '#/components/schemas/Creditos'
          nullable: true
          description: HU-1406 · Créditos de IA tal como saldrán en el paquete (botón «Créditos»); null si ningún recurso
            es de IA
        modoIdioma:
          type: string
          enum:
          - unico
          - mismo-paquete
          description: HU-0804 · Idiomas del paquete validado
        textosIngles:
          type: object
          nullable: true
          required:
          - traducidos
          - total
          properties:
            traducidos:
              type: integer
            total:
              type: integer
          description: HU-0804 · En el paquete bilingüe, cuántos textos tienen su inglés; null con un solo idioma
        objetivosSinAlinear:
          type: integer
          minimum: 0
          description: HU-1001 · Objetivos con alertas de alineación (PNT-18); advierte «N objetivos sin alinear», no bloquea
      description: Nunca bloquea por tamaño; solo advierte (RN-12-2, CP-090).
    Creditos:
      type: object

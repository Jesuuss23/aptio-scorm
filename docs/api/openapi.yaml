      summary: Exportar
      operationId: post_cursos_cursoId_exportaciones
      description: 'HU-1202 · Crea la exportación en EN_COLA ligada a la versión actual del curso (RN-12-4) y encola EXPORTAR
        en la cola `export`; el worker arma el ZIP SCORM 1.2 de un solo SCO y la deja en COMPLETADO (o ERROR con `motivo`).
        Formatos `SCORM12` y `HTML` (HU-1203: carpeta autocontenida sin manifiesto, sin LMS ni modo diagnóstico, perfil
        `generico`) con `modoIdioma: unico` (el primer idioma del curso, SUP-49) o `mismo-paquete` (HU-0804, español e
        inglés con el botón de idioma; abre en español). El perfil de LMS se
        guarda y solo cambia las recomendaciones: el paquete es el mismo (RN-12-1). Se exporta aunque haya pantallas sin
        aprobar (SUP-51). HU-1205 · `KIT_GAMIFICACION` arma el kit de gamificación (CP-095): insignias SVG y PNG de 512 px con
        la marca del cliente (una por cápsula, una por módulo y una del curso, o las de `gamificacion.insignias`), `plan.json`
        y `guia-<lms>.html` del LMS de `perfilLms`; sin él, el LMS del cliente según los datos técnicos del proyecto. Con
        `mismo-paquete` los nombres van en español e inglés sin exigir todo el inglés. Se nombra
        `<proyecto>-kit-<lms>-v<n>.zip` y se descarga desde el historial. Exportan administración, diseño instruccional y
        producción. 422 con `codigo`: ESQUEMA_NO_VALIDO (con `detalles`), FORMATO_NO_DISPONIBLE (SCORM2004, JSON),
        IDIOMA_NO_DISPONIBLE (`separados`) o TRADUCCION_INCOMPLETA (paquete bilingüe con textos sin inglés).'

        textosIngles:
          type: object
          nullable: true
          required:
          - traducidos
          - total
          properties:
            traducidos:
              type: integer
            total:
              type: integer
          description: HU-0804 · En el paquete bilingüe, cuántos textos tienen su inglés; null con un solo idioma
        objetivosSinAlinear:
          type: integer
          minimum: 0
          description: HU-1001 · Objetivos con alertas de alineación (PNT-18); advierte «N objetivos sin alinear», no bloquea
      description: Nunca bloquea por tamaño; solo advierte (RN-12-2, CP-090).

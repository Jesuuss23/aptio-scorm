  /sitio/blog:
    get:
      tags:
      - Sitio web
      summary: Conexión con WordPress, estado de la sincronización y copia del blog (HU-1511, PNT-28)
      operationId: get_sitio_blog
      description: Solo SUPERADMIN. Sin conectar, `url` null y listas vacías. Las categorías van por orden y los artículos del más nuevo al más viejo, visibles y ocultos.
      responses:

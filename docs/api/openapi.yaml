      description: |-
        La franja elegida y los datos del lead (las reglas de LeadEntrada). `via` es `agendador` (o se omite) desde el
        bloque «Agendador»; `chatbot` desde el chat del sitio (HU-1604, CP-134), que además exige `nombre` y puede llevar
        `conversacionId`. Otra vía es 422 con el campo `via`.
      allOf:
      - $ref: '#/components/schemas/LeadEntrada'
      - type: object
        required: [tipoId, inicio]
        properties:
          tipoId:
            type: string
            format: uuid
          inicio:
            type: string
            format: date-time
            example: '2026-11-17T15:00:00.000Z'
            description: El `inicio` de una franja de `GET /s/_agenda.json`
          lms:
            type: string
            enum: [Moodle, Blackboard, Chamilo, Canvas, Otro, No usamos LMS]
          conversacionId:
            type: string
            format: uuid
            description: HU-1604 · Con vía chatbot, la conversación que agendó (sube su resultado a «Demo agendada»)
    AjustesChatbot:
      type: object
      description: HU-1604 · Identidad, objetivo y horario de atención humana del chatbot (REQ-077, RN-17-4)
      required: [nombre, saludoEs, saludoEn, tono, objetivo, horarioInicio, horarioFin, diasAtencion, visible]
      properties:
        nombre:
          type: string
          maxLength: 40
          example: Ana
        saludoEs:
          type: string
          maxLength: 280
        saludoEn:
          type: string
          maxLength: 280
        tono:
          type: string
          enum: [cercano, formal, directo]
        objetivo:
          type: string
          enum: [agendar_demo, captar_lead, derivar_whatsapp]
        horarioInicio:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '09:00'
          description: Hora de Lima
        horarioFin:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '18:00'
          description: Hora de Lima, excluida
        diasAtencion:
          type: array
          maxItems: 7
          items:
            type: integer
            minimum: 1
            maximum: 7

          enum:
          - Cercano
          - Formal
          - Motivador
        pantallasObjetivo:
          type: integer
          minimum: 5
          maximum: 120
        porcentajeActividades:
          type: integer
          minimum: 0
          maximum: 100
        datosTecnicos:
          $ref: '#/components/schemas/DatosTecnicos'
      description: Solo cliente y nombre son obligatorios.
    MaterialFuente:
      type: object
      required:
      - id
      - tipo
      - estado
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum:
          - PDF
          - WORD
          - POWERPOINT
          - VIDEO
          - AUDIO
          - IMAGEN
          - TEMA
        recursoId:
          type: string
          format: uuid
          nullable: true
        nombre:
          type: string
          nullable: true
          description: Nombre del archivo subido; null para un tema.
        tema:
          type: string
          nullable: true
        estado:
          type: string
          enum:
          - pendiente
          - procesando
          - listo
          - error
        error:
          type: string
          nullable: true
          description: Motivo legible cuando estado = error.
        paginas:
          type: array
          description: Texto por página (o diapositiva). Vacío hasta que el worker termina la extracción.
          items:
            type: object
            required:
            - n
            - texto
            - escaneada
            properties:
              n:
                type: integer
              texto:
                type: string
              escaneada:
                type: boolean
                description: La página no tenía capa de texto y se leyó con OCR (español e inglés).
              posibleInstruccion:
                type: boolean
                description: >-
                  El texto parece una orden dirigida a la IA (HU-1402). Se trata como dato del cliente, delimitado en
                  el prompt, y se avisa en la interfaz (CP-102).
        transcripcion:
          type: array
          description: >-
            Video o audio (HU-0305): fragmentos con marcas de tiempo en segundos. Vacío hasta que el worker termina la
            transcripción, y en los documentos.
          items:
            type: object
            required:
            - desde
            - hasta
            - texto
            properties:
              desde:
                type: number
              hasta:
                type: number
              texto:
                type: string
              posibleInstruccion:
                type: boolean
                description: El texto parece dar órdenes a la IA; se trata como dato y se avisa (HU-1402).
        duracionS:
          type: number
          nullable: true
          description: Video o audio, duración en segundos; null en los documentos o hasta terminar la transcripción.
        creadoEn:
          type: string
          format: date-time
        mapaTemas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              tema:
                type: string
              paginas:
                type: string
              decision:
                type: string
                enum:
                - conservar
                - complementario
                - omitir
              motivo:
                type: string
    MaterialEntrada:
      type: object
      properties:
        recursoId:
          type: string
          format: uuid
          description: Archivo del proyecto ya subido; el tipo (PDF, WORD, POWERPOINT) se deduce de su tipo real.
        tema:
          type: string
          minLength: 3
          maxLength: 500
      description: Exactamente uno de recursoId (archivos) o tema (cuando el cliente solo da el tema).
    SubidaSolicitud:
      type: object
      required:
      - nombre
      - mime
      - bytes
      properties:
        nombre:
          type: string
        mime:
          type: string
        bytes:
          type: integer
          minimum: 1
        clienteId:
          type: string
          format: uuid
        proyectoId:
          type: string
          format: uuid
        origen:
          type: string
          enum:
          - SUBIDO
          - CLIENTE
          default: SUBIDO
          description: CLIENTE marca un documento del cliente, con borrado programado según su retención (ADR-009)
    SubidaUrl:
      type: object
      required:
      - subidaId
      - url
      - cabeceras
      - expira
      properties:
        subidaId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: PUT firmado, vigente 15 minutos
        cabeceras:
          type: object
          additionalProperties:
            type: string
          description: Cabeceras que el PUT debe enviar tal cual (tipo y cifrado KMS); sin ellas el almacenamiento rechaza la subida
        expira:
          type: string
          format: date-time
    Recurso:
      type: object
      required:
      - id
      - tipo
      - origen
      - nombre
      - mime
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          enum:
          - IMAGEN
          - SVG
          - AUDIO
          - VIDEO
          - DOCUMENTO
          - FUENTE
          - SUBTITULO
          - PAQUETE
        origen:
          type: string
          enum:
          - BIBLIOTECA
          - GENERADO
          - SUBIDO
          - CLIENTE
        nombre:
          type: string
        mime:
          type: string
        bytes:
          type: integer
        ancho:
          type: integer
        alto:
          type: integer
        duracionMs:
          type: integer
        hash:
          type: string
          description: sha256 del contenido
        clienteId:
          type: string
          format: uuid
          nullable: true
        proyectoId:
          type: string
          format: uuid
          nullable: true
        eliminarEn:
          type: string
          format: date-time
          nullable: true
          description: Borrado programado de un documento del cliente (HU-1404)
        proveedor:
          type: string
          nullable: true
          description: HU-1406 · Proveedor que lo generó (google, recraft, …; `aptio` si lo armó la plataforma sin IA).
            Todo recurso GENERADO lo tiene (REQ-062)
        modelo:
          type: string
          nullable: true
          description: HU-1406 · Modelo y versión usados (la voz, el modelo de imagen)
        licencia:
          type: string
          nullable: true
          description: HU-1406 · Condición de uso del proveedor (ADR-010)
        creadoEn:
          type: string
          format: date-time
        eliminadosAlSanear:
          type: array
          items:
            type: string
          description: Solo SVG. Lo que se quitó al sanearlo
        alt:
          $ref: '#/components/schemas/TextoI18n'
        url:
          type: string
          format: uri
          description: URL firmada de 15 minutos; solo en GET /recursos/{recursoId} y al confirmar
    ImagenIaEntrada:
      type: object
      required:
      - clienteId
      - descripcion
      properties:
        clienteId:
          type: string
          format: uuid
        proyectoId:
          type: string
          format: uuid
        descripcion:
          type: string
          minLength: 5
        variantes:
          type: integer
          minimum: 1
          maximum: 4
          default: 4
        relacion:
          type: string
          enum:
          - '1:1'
          - '16:9'
          - '4:3'
    GeneracionEntrada:
      type: object
      description: Todo es opcional; lo que no se envía se toma del proyecto.
      properties:
        pantallas:
          type: integer
          minimum: 5
          maximum: 120
        idiomas:
          type: array
          items:
            type: string
            enum:
            - es
            - en
        publico:
          type: string
          maxLength: 200
        tono:
          type: string
          maxLength: 60
        porcentajeActividades:
          type: integer
          minimum: 0
          maximum: 100
          default: 40
    EstadoTrabajo:
      type: string
      enum:
      - EN_COLA
      - EN_CURSO
      - COMPLETADO
      - ERROR
      - CANCELADO
    Etapa:
      type: object
      required:
      - etapa
      - orden
      - estado
      properties:
        etapa:
          type: string
          enum:
          - RESUMEN_MATERIAL
          - OBJETIVOS_ESTRUCTURA
          - STORYBOARD_GUION
          - PANTALLAS
          - ILUSTRACIONES
          - VOZ_ES
          - BOCA
          - SUBTITULOS
          - VERSION_EN
          - CONTROL_CALIDAD
          - PAQUETE
        orden:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoTrabajo'
        detalle:
          type: string
          nullable: true
          description: Resumen legible de lo hecho o del error; «Se habilita en un sprint siguiente» si la etapa aún no tiene ejecutor
        inicio:
          type: string
          format: date-time
          nullable: true
        fin:
          type: string
          format: date-time
          nullable: true
        costoUsd:
          type: number
    EtapaResultado:
      allOf:
      - $ref: '#/components/schemas/Etapa'
      - type: object
        properties:
          datos:
            type: object
            nullable: true
            description: >-
              Lo que guardó la etapa. En RESUMEN_MATERIAL, un ResumenMaterial; en OBJETIVOS_ESTRUCTURA, una
              EstructuraCurso; en STORYBOARD_GUION, un GuionCurso; en PANTALLAS, un PantallasCurso, también
              mientras corre (CP-043: las pantallas listas); las demás etapas definen el suyo.
            anyOf:
            - $ref: '#/components/schemas/ResumenMaterial'
            - $ref: '#/components/schemas/EstructuraCurso'
            - $ref: '#/components/schemas/GuionCurso'
            - $ref: '#/components/schemas/PantallasCurso'
            - type: object
    EstructuraCurso:
      type: object
      description: >-
        Resultado de la etapa 2 (HU-0403, IA-04 v2): objetivos con nivel de Bloom y pantallas con tipo, objetivos,
        fragmentos, actividad sugerida y páginas de origen. Con N pantallas y P % de actividades hay exactamente N
        pantallas y al menos ⌈N × P / 100⌉ con actividad, cada una ligada a un objetivo (CP-039).
      required:
      - objetivos
      - modulos
      - actividades
      properties:
        objetivos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              texto:
                type: object
                properties:
                  es:
                    type: string
                  en:
                    type: string
              nivelBloom:
                type: string
                enum:
                - recordar
                - comprender
                - aplicar
                - analizar
                - evaluar
                - crear
              verbo:
                type: string
        modulos:
          type: array
          description: Módulos con sus cápsulas; cada cápsula lleva sus pantallas (id, tipo, proposito, objetivoIds, fragmentoIds, actividadSugerida, paginas)
          items:
            type: object
        supuestos:
          type: array
          items:
            type: string
        actividades:
          type: object
          properties:
            minimas:
              type: integer
              nullable: true
            total:
              type: integer
    PantallasCurso:
      type: object
      description: >-
        Resultado de la etapa 4 (HU-0406, IA-15 v2): cada pantalla con su disposición del kit, fondo y campos, sin HTML,
        y cada actividad con sus datos (HU-0407, IA-07 v2).
        Mientras la etapa corre trae solo las pantallas listas (CP-043); al terminar, también el curso guardado y
        validado (CP-042).
      required:
      - total
      - kit
      - modelos
      - pantallas
      - advertencias
      properties:
        total:
          type: integer
          description: Pantallas que tendrá el curso
        kit:
          type: object
          properties:
            nombre:
              type: string
            paleta:
              type: object
              additionalProperties:
                type: string
            tipografias:
              type: object
              properties:
                titulos:
                  type: string
                textos:
                  type: string
            personaje:
              type: string
              nullable: true
        modelos:
          type: object
          description: Por disposición, el modelo que usa (el del cliente o el del estilo base)
          additionalProperties:
            type: object
        pantallas:
          type: array
          items:
            type: object
            required:
            - id
            - orden
            - capsulaId
            - titulo
            - disposicion
            - fondo
            - campos
            - pedidosImagen
            properties:
              id:
                type: string
              orden:
                type: integer
                description: Lugar en el curso, desde 1 (una pantalla puede quedar lista antes que la anterior)
              capsulaId:
                type: string
              titulo:
                type: string
              disposicion:
                type: string
              fondo:
                type: string
              campos:
                type: object
                description: Campos de IA-15 (titulo, subtitulo, texto, dato, items, opciones…)
              personaje:
                type: object
                properties:
                  pose:
                    type: string
                  lado:
                    type: string
              pedidosImagen:
                type: array
                items:
                  type: object
              actividad:
                type: object
                properties:
                  tipo:
                    type: string
                  consigna:
                    type: string
                  interaccion:
                    type: object
                    description: Datos de la actividad de IA-07 (HU-0407), tal como van en el bloque interaccion del curso
                    properties:
                      modo:
                        type: string
                        enum:
                        - formativa
                        - sumativa
                      peso:
                        type: number
                      instruccion:
                        type: object
                      datos:
                        type: object
              motivo:
                type: string
        advertencias:
          type: array
          items:
            type: string
        curso:
          type: object
          description: El curso guardado al terminar la etapa
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
    GuionCurso:
      type: object
      description: >-
        Resultado de la etapa 3 (HU-0404, IA-05 v2): por cápsula, cada pantalla de la estructura con título, texto en
        pantalla, narración, visual, actividad y origen. Pasar de 30 palabras en pantalla o 45 de narración no rechaza
        el guion: queda en advertencias (CP-040).
      required:
      - capsulas
      - advertencias
      properties:
        capsulas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              moduloId:
                type: string
              titulo:
                type: object
                properties:
                  es:
                    type: string
                  en:
                    type: string
              pantallas:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - tipo
                  - titulo
                  - textoPantalla
                  - narracion
                  - visual
                  - objetivoIds
                  - origen
                  - palabras
                  properties:
                    id:
                      type: string
                    tipo:
                      type: string
                    titulo:
                      type: string
                    textoPantalla:
                      type: string
                    narracion:
                      type: string
                    visual:
                      type: string
                    actividad:
                      type: object
                      properties:
                        tipo:
                          type: string
                          description: INT-01 a INT-08
                        consigna:
                          type: string
                    objetivoIds:
                      type: array
                      items:
                        type: string
                    origen:
                      type: object
                      description: documento (con documentoId del material, archivo y páginas), ia o manual
                      properties:
                        tipo:
                          type: string
                          enum:
                          - documento
                          - ia
                          - manual
                        documentoId:
                          type: string
                        archivo:
                          type: string
                        paginas:
                          type: array
                          items:
                            type: integer
                        revisado:
                          type: boolean
                    notas:
                      type: string
                    palabras:
                      type: object
                      properties:
                        textoPantalla:
                          type: integer
                        narracion:
                          type: integer
        advertencias:
          type: array
          description: Cada campo de cada pantalla que pasa su límite de palabras (textoPantalla 30, narracion 45)
          items:
            type: object
            properties:
              pantallaId:
                type: string
              campo:
                type: string
                enum:
                - textoPantalla
                - narracion
              palabras:
                type: integer
              limite:
                type: integer
    ResumenMaterial:
      type: object
      description: Resultado de la etapa 1 (HU-0402). Todo es propuesta de la IA para que el diseñador decida.
      required:
      - documentos
      - temas
      - ideas
      properties:
        tema:
          type: string
          nullable: true
          description: Tema escrito por el equipo cuando no hay documento
        documentos:
          type: array
          items:
            type: object
            properties:
              materialId:
                type: string
                format: uuid
              nombre:
                type: string
              totalPaginas:
                type: integer
        temas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              materialId:
                type: string
                format: uuid
              titulo:
                type: string
              resumen:
                type: string
              paginas:
                type: array
                items:
                  type: integer
              peso:
                type: integer
                minimum: 1
                maximum: 5
              tipoContenido:
                type: string
              decision:
                type: string
                enum:
                - conservar
                - complementario
                - omitir
              motivo:
                type: string
        metaMinutos:
          type: number
          nullable: true
        minutosEstimados:
          type: number
          nullable: true
        ideas:
          type: array
          description: Ideas clave (fragmentos de IA-03), cada una con archivo y páginas de origen
          items:
            type: object
            properties:
              id:
                type: string
              temaId:
                type: string
              materialId:
                type: string
                format: uuid
              archivo:
                type: string
              texto:
                type: string
              paginas:
                type: array
                items:
                  type: integer
              tipo:
                type: string
                enum:
                - idea
                - dato
                - paso
                - ejemplo
                - advertencia
                - definicion
              literal:
                type: boolean
        acta:
          type: object
          nullable: true
          description: Acta de temas omitidos (IA-13), propuesta para revisar antes de enviarla al cliente
          properties:
            titulo:
              type: string
            temas:
              type: array
              items:
                type: object
                properties:
                  temaId:
                    type: string
                  titulo:
                    type: string
                  paginas:
                    type: array
                    items:
                      type: integer
                  motivo:
                    type: string
            textoActa:
              type: string
              description: Markdown
        observaciones:
          type: array
          items:
            type: string
    Generacion:
      type: object
      required:
      - id
      - proyectoId
      - estado
      - etapas
      properties:
        id:
          type: string
          format: uuid
        proyectoId:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoTrabajo'
        avance:
          type: number
          minimum: 0
          maximum: 100
          description: Porcentaje de etapas terminadas
        costoUsd:
          type: number
        parametros:
          type: object
          description: Parámetros con los que se lanzó (pantallas, idiomas, público, tono, porcentajeActividades)
        etapas:
          type: array
          items:
            $ref: '#/components/schemas/Etapa'
        creadoEn:
          type: string
          format: date-time
        terminadoEn:
          type: string
          format: date-time
          nullable: true
    Trabajo:
      type: object
      description: Trabajo largo en una cola (TrabajoIA). Amplía Trabajo202.
      required:
      - id
      - tarea
      - cola
      - estado
      - eventos
      properties:
        id:
          type: string
          format: uuid
        tarea:
          type: string
          example: IA-04
        cola:
          type: string
          enum:
          - ia
          - voz
          - media
          - export
        estado:
          $ref: '#/components/schemas/EstadoTrabajo'
        proveedor:
          type: string
        modelo:
          type: string
        error:
          type: string
          nullable: true
        duracionMs:
          type: integer
          nullable: true
        creadoEn:
          type: string
          format: date-time
        eventos:
          type: string
          format: uri
          description: URL de eventos (SSE)
    EventoTrabajo:
      type: object
      required:
      - tipo
      - trabajoId
      - cola
      - tarea
      - estado
      - progreso
      - en
      properties:
        tipo:
          type: string
          enum:
          - estado
          - progreso
        trabajoId:
          type: string
          format: uuid
        organizacionId:
          type: string
          format: uuid
        cola:
          type: string
          enum:
          - ia
          - voz
          - media
          - export
        tarea:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoTrabajo'
        progreso:
          type: integer
          minimum: 0
          maximum: 100
        mensaje:
          type: string
          description: Detalle del error cuando estado = ERROR
        en:
          type: string
          format: date-time
    Trabajo202:
      type: object
      required:
      - id
      - estado
      properties:
        id:
          type: string
          format: uuid
        estado:
          $ref: '#/components/schemas/EstadoTrabajo'
        eventos:
          type: string
          format: uri
          description: URL de eventos (SSE)
    Curso:
      type: object
      required:
      - id
      - versionEsquema
      - version
      - documento
      properties:
        id:
          type: string
          format: uuid
        proyectoId:
          type: string
          format: uuid
        versionEsquema:
          type: string
          example: 0.2.0
        version:
          type: integer
        documento:
          type: object
          description: Valida contra packages/schema/esquemas/curso-v0.schema.json
        actualizadoEn:
          type: string
          format: date-time
        urlsRecursos:
          type: object
          description: HU-0702 · URL firmada (vence a los 15 minutos) de cada audio de narración, video (HU-0901) e imagen o SVG (HU-0609) del curso, por id de recurso. Solo en GET /proyectos/{proyectoId}/curso.
          additionalProperties:
            type: string
            format: uri
        svgPersonajes:
          type: object
          description: HU-0702 · SVG saneado de cada personaje que usa el curso, por id de recurso, para dibujarlo en línea y animar su boca sin depender del CORS del almacenamiento. Solo en GET /proyectos/{proyectoId}/curso.
          additionalProperties:
            type: string
        subtitulos:
          type: object
          description: HU-0801 · Texto WebVTT de cada narración del curso, por id de recurso de subtítulos (SUP-37), para que la vista previa lo lea sin depender del CORS del almacenamiento. Solo en GET /proyectos/{proyectoId}/curso.
          additionalProperties:
            type: string
    CursoEntrada:
      type: object
      required:
      - documento
      properties:
        documento:
          type: object
        motivo:
          type: string
    JsonPatch:
      type: array
      items:
        type: object
        required:
        - op
        - path
        properties:
          op:
            type: string
            enum:
            - add
            - remove
            - replace
            - move
            - copy
            - test
          path:
            type: string
          from:
            type: string
          value: {}
    CursoVersion:
      type: object
      required:
      - version
      - motivo
      - creadoEn
      properties:
        version:
          type: integer
        motivo:
          type: string
        creadoPor:
          type: string
        creadoEn:
          type: string
          format: date-time
    ReglasVideo:
      type: object
      description: HU-0902 · Reglas del bloque de video (RN-09-2). Con `impedirAdelantar`, ir más allá de una pregunta sin
        responder ni saltar no se permite y se explica por qué. `porcentajeMinimo` todavía no se aplica en el reproductor.
      additionalProperties: false
      required:
      - impedirAdelantar
      properties:
        impedirAdelantar:
          type: boolean
        porcentajeMinimo:
          type: number
          minimum: 0
          maximum: 100
    MarcadorVideo:
      type: object
      description: HU-0901 · Marcador del bloque de video (RN-09-1). Una `pregunta` pausa el video en `tiempoMs` y se muestra
        encima; al acertar el video sigue y, si no es obligatoria, se puede saltar. Capítulos y puntos se conservan tal cual.
      required:
      - id
      - tiempoMs
      - tipo
      - obligatorio
      properties:
        id:
          type: string
          example: vm-45
        tiempoMs:
          type: integer
          minimum: 0
          example: 45000
        tipo:
          type: string
          enum:
          - pregunta
          - punto
          - capitulo
        obligatorio:
          type: boolean
        pregunta:
          type: object
          description: Con `tipo` pregunta. Enunciado, al menos 2 opciones con exactamente 1 correcta y la retroalimentación.
          additionalProperties: true
        titulo:
          $ref: '#/components/schemas/TextoI18n'
        contenido:
          $ref: '#/components/schemas/TextoI18n'
    Disparador:
      type: object
      description: HU-0610 · Disparador simple de una pantalla, con el mismo reloj que la línea de tiempo. `mostrar` gana
        a un elemento oculto y a su entrada; `ocultar` gana a su salida; `ir-a` respeta las reglas de avance (RN-11-4).
      required:
      - id
      - cuando
      - accion
      additionalProperties: false
      properties:
        id:
          type: string
          example: p05-disp-1
        cuando:
          type: object
          required:
          - evento
          additionalProperties: false
          properties:
            evento:
              type: string
              enum:
              - tiempo
              - fin-voz
            segundo:
              type: number
              minimum: 0
              maximum: 600
              description: Obligatorio con `tiempo`.
        accion:
          type: object
          required:
          - tipo
          additionalProperties: false
          properties:
            tipo:
              type: string
              enum:
              - mostrar
              - ocultar
              - ir-a
            elementoId:
              type: string
              description: Bloque o extra de la misma pantalla, con `mostrar` u `ocultar`.
            pantallaId:
              type: string
              description: Otra pantalla del curso, con `ir-a`.
    ElementoExtra:
      type: object
      description: HU-0606 · Elemento agregado en el editor (curso-v0 `elementoExtra`). x, y y ancho en % de la pantalla;
        se mueve con `ajustes[id].desplazamiento` como un bloque (SUP-45).
      required:
      - id
      - tipo
      - x
      - 'y'
      - ancho
      properties:
        id:
          type: string
        tipo:
          type: string
          enum:
          - titulo
          - texto
          - dato
          - boton
          - imagen
          - insignia
          - forma
          - personaje
        texto:
          $ref: '#/components/schemas/TextoI18n'
        recursoId:
          type: string
        pieza:
          type: string
          description: HU-0609 · Pieza de la biblioteca del kit, en vez de recursoId (solo en una imagen); se dibuja con los
            colores del kit.
          enum:
          - candado
          - alerta
          - tablero
          - escena
          - trofeo
          - casco
        decorativa:
          type: boolean
          description: HU-0609 · Imagen decorativa, sin texto alternativo para el lector de pantalla (RN-14-3).
        x:
          type: number
          minimum: 0
          maximum: 100
        'y':
          type: number
          minimum: 0
          maximum: 100
        ancho:
          type: number
          minimum: 1
          maximum: 100
        alClic:
          type: string
          enum:
          - nada
          - siguiente
          - retroalimentacion
          - ventana
          - audio
          - puntos
    AjusteElemento:
      type: object
      properties:
        tamanoCqw:
          type: number
        escala:
          type: number
        color:
          $ref: '#/components/schemas/RolColor'
        relleno:
          $ref: '#/components/schemas/RolColor'
        alineacion:
          type: string
          enum:
          - izquierda
          - centro
          - derecha
        desplazamiento:
          type: object
          description: HU-0603 · Desplazamiento del modo Libre en % del ancho de la pantalla (RN-06-2). El reproductor lo
            aplica con `translate` en cqw según el dispositivo; el editor guarda `todos` (SUP-42).
          properties:
            x:
              type: number
            y:
              type: number
            dispositivo:
              type: string
              enum:
              - todos
              - escritorio
              - celular
        animacion:
          type: string
          enum:
          - auto
          - ninguna
          - aparecer
          - deslizar
          - zoom
          - rebotar
        retardoS:
          type: number
        finS:
          type: number
        anclaPalabra:
          type: integer
          minimum: 0
        oculto:
          type: boolean
    PantallaCambio:
      type: object
      required:
      - version
      properties:
        titulo:
          $ref: '#/components/schemas/TextoI18n'
        narracion:
          allOf:
          - $ref: '#/components/schemas/TextoI18n'
          description: HU-0608 (RN-06-8, CP-067) · Al cambiar la narración en español, cada elemento con `anclaPalabra`
            pasa al índice de la misma palabra en el texto nuevo; si la palabra ya no está, pierde el ancla, conserva su
            `retardoS` y se crea la observación «Revisar tiempo» (origen `tiempo`, severidad `aviso`). Al regenerar la
            voz, el worker da a cada ancla el segundo de su palabra. Cambiar la entrada o el ancla del elemento quita la observación.
        textos:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TextoI18n'
          description: Clave = id del bloque de texto de la pantalla
        disposicion:
          description: HU-0605 · Otra composición de contenido (idea, personaje, dato o lista; o volver a portada, objetivos,
            sección, resumen o cierre) con los mismos bloques. Cambia
            la plantilla, reinicia los ajustes y conserva los extras (RN-06-3); los `ajustes` del mismo cambio se aplican
            después, para deshacer.
          allOf:
          - $ref: '#/components/schemas/Disposicion'
        fondo:
          type: string
        ajustes:
          type: object
          description: HU-0602 · Clave = id del bloque. Cada clave reemplaza el ajuste de ese elemento; null lo restablece.
          additionalProperties:
            type: object
            nullable: true
            allOf:
            - $ref: '#/components/schemas/AjusteElemento'
        extras:
          type: array
          description: HU-0606 · Elementos agregados en el editor, como lista completa de la pantalla (RN-06-1). Quitar uno
            borra su ajuste.
          items:
            $ref: '#/components/schemas/ElementoExtra'
        disparadores:
          type: array
          maxItems: 10
          description: HU-0610 · Lista completa de disparadores de la pantalla (REQ-045). Una lista vacía los quita todos.
          items:
            $ref: '#/components/schemas/Disparador'
        marcadores:
          type: object
          description: HU-0901 · Por id del bloque de video, la lista completa de sus marcadores (capítulos y puntos incluidos).
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/MarcadorVideo'
        reglasVideo:
          type: object
          description: HU-0902 · Por id del bloque de video, sus reglas de reproducción.
          additionalProperties:
            $ref: '#/components/schemas/ReglasVideo'
        motivo:
          type: string
          enum:
          - deshacer
          - rehacer
          description: HU-0607 · Rótulo de la versión cuando el cambio viene de deshacer o rehacer en el editor (SUP-46).
            Sin él, la versión dice «edición».
        version:
          type: integer
      description: Cambios del editor sobre una pantalla. Dispara la regeneración en cascada de lo afectado.
    CambioResultado:
      type: object
      required:
      - version
      - regenerando
      properties:
        version:
          type: integer
        regenerando:
          type: array
          description: HU-0503 · Lo que se regenera en cascada tras el cambio. Hasta el S7 solo voz-es, boca y subtitulos-es.
          items:
            type: string
            enum:
            - voz-es
            - boca
            - subtitulos-es
            - traduccion-en
            - voz-en
            - subtitulos-en
        aprobadas:
          type: array
          items:
            type: string
          description: Pantallas que quedaron aprobadas con esta llamada
        agregados:
          type: array
          items:
            type: string
          description: HU-0903 · Los ids nuevos de los marcadores que se sumaron al video
        observaciones:
          type: array
          items:
            type: string
          description: HU-0903 · Por qué se omitió algún marcador elegido (a menos de 2 s de otro del mismo tipo)
        pendientes:
          type: array
          items:
            type: string
          description: Pantallas pedidas que no se aprobaron por tener observaciones abiertas
        estado:
          type: string
          enum:
          - borrador
          - propuesta-ia
          - aprobado
          description: Estado de la pantalla tras editar o aprobar una sola
        pantallasPorRevisar:
          type: array
          description: HU-1002 · Pantallas nuevas o cambiadas al aplicar una propuesta `alineacion`; quedan en borrador.
          items:
            type: object
            required:
            - pantallaId
            - numero
            - titulo
            - nueva
            properties:
              pantallaId:
                type: string
              numero:
                type: integer
                description: Número de la pantalla en el curso (1 = la primera)
              titulo:
                type: string
              nueva:
                type: boolean
    Aprobacion:
      type: object
      properties:
        pantallaIds:
          type: array
          items:
            type: string
        soloSinObservaciones:
          type: boolean
    PropuestaSolicitud:
      type: object
      required:
      - tipo
      properties:
        tipo:
          type: string
          enum:
          - mas-visual
          - menos-texto
          - actividad
          - variantes
          - otra-ilustracion
          - libre
          - alineacion
          - patron
          - pausas-video
          - kit-extraer
        pantallaId:
          type: string
        pedido:
          type: string
          maxLength: 500
        modo:
          type: string
          description: HU-1104 · Obligatorio con `tipo` patron
          enum:
          - recomendar
          - crear
        descripcion:
          type: string
          maxLength: 300
          description: HU-1104 · El patrón que se quiere, en palabras del diseñador; obligatoria con `modo` crear. Se
            trata como material no confiable dentro del prompt.
    PatronOpcion:
      type: object
      description: HU-1104 · Un patrón propuesto por IA-14 con su motivo.
      required:

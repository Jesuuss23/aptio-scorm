  /propuestas/{propuestaId}/aplicar:
    post:
      tags:
      - Asistente IA
      summary: Aplicar propuesta
      operationId: post_propuestas_propuestaId_aplicar
      description: 'HU-0504 · Aplica el patch (o la variante `varianteIndice`) a la pantalla, crea una versión del curso
        con motivo «propuesta» y la pantalla vuelve a borrador. 409 PROPUESTA_VENCIDA («Recalcular propuesta») si la
        pantalla cambió desde `versionBase` (solo cuenta esa pantalla, SUP-39), 409 PROPUESTA_RESUELTA si ya se aplicó o se
        descartó, 422 VARIANTE_REQUERIDA o PROPUESTA_NO_APLICA. Se deshace restaurando la versión anterior. HU-0604 · el
        patch no toca `ajustes` ni `extras` (PROPUESTA_NO_APLICA); al aplicar, los extras se conservan y los ajustes de los
        elementos que siguen en la pantalla también, salvo si cambia la disposición, que los reinicia (RN-06-3). Mover o
        retocar un elemento no vence la propuesta: la huella de la pantalla no cuenta los retoques (SUP-43).
        HU-1002 · Una propuesta `alineacion` vence si el curso cambió de versión desde `versionBase` (409 PROPUESTA_VENCIDA,
        «Recalcular propuesta»); al aplicarla crea una versión con motivo «alineación» y devuelve `pantallasPorRevisar`:
        las pantallas nuevas o cambiadas, que quedan en borrador con sus preguntas y textos marcados como IA sin revisar.
        Solo administración y diseño instruccional la aplican o la descartan (403 al resto).
        HU-1104 · Una propuesta `patron` también vence si el curso cambió de versión (409 PROPUESTA_VENCIDA); al aplicarla
        solo cambian `navegacion.patron` y `navegacion.patronPersonalizado` (se quita si el patrón es del catálogo), las
        reglas y los elementos visibles quedan (RN-11-1), y se crea una versión con motivo «navegación». Mismos roles que
        `alineacion` (403 al resto).
        HU-0903 · Una propuesta `pausas-video` se aplica con `marcadorIds` (los elegidos; 422 MARCADORES_REQUERIDOS si no
        hay ninguno, PROPUESTA_NO_APLICA si uno no está en la propuesta o el resultado no pasa las reglas del video). Los
        elegidos se suman a los marcadores del video sin reemplazar ninguno, con ids nuevos y marcados como de la IA sin
        revisar; uno a menos de 2 s de otro del mismo tipo se omite y lo dice `observaciones`. Vence como las de pantalla
        (409 PROPUESTA_VENCIDA si la pantalla cambió); versión nueva con motivo «propuesta», la pantalla vuelve a borrador
        y la respuesta trae `agregados`. Se deshace mandando la lista anterior de marcadores con `motivo: deshacer`.'
      parameters:
      - name: propuestaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AplicarPropuesta'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioResultado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
        '409':
          $ref: '#/components/responses/Conflicto'

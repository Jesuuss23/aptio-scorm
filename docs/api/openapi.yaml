      operationId: post_captacion_lead_sincronizar
      description: |-
        Solo SUPERADMIN. Vuelve a poner en la cola `crm` el lead para cada conexión activa que no lo tiene enviado (las
        que quedaron en «error» o siguen «pendiente»); las enviadas no se repiten. Responde los tipos encolados.
        Auditoría LEAD_SINCRONIZACION_REINTENTADA. 422 SIN_CONEXIONES si no hay ninguna conexión activa; 503
        COLA_NO_DISPONIBLE si Redis no responde (el envío queda en «error» con el motivo).
      parameters:
      - name: leadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Encolado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sincronizacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
        '503':
          description: COLA_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /captacion/crm:
    get:
      tags:
      - Captación
      summary: Conexiones con HubSpot, Pipedrive, Zoho y el webhook firmado (HU-1602, PNT-34)
      operationId: get_captacion_crm
      description: |-
        Solo SUPERADMIN, con `Cache-Control: no-store`. Las cuatro conexiones en orden fijo; las que nunca se guardaron
        salen apagadas con el mapeo de por defecto. Las claves de HubSpot (`HUBSPOT_TOKEN`), Pipedrive (`PIPEDRIVE_TOKEN`)
        y Zoho (`ZOHO_CLIENT_ID`, `ZOHO_CLIENT_SECRET`, `ZOHO_REFRESH_TOKEN` y `ZOHO_DOMINIO`, por defecto `com`) viven en
        el entorno del servidor: aquí solo se dice cuáles faltan. El webhook trae su URL y su clave HMAC-SHA256.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEstado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
    patch:
      tags:
      - Captación
      summary: Activar o desactivar una conexión, su mapeo o la URL del webhook (HU-1602)
      operationId: patch_captacion_crm
      description: |-
        Solo SUPERADMIN. Cambia una conexión por vez (`tipo`). `mapeo` solo en HubSpot, Pipedrive y Zoho: campos del
        catálogo a propiedades del CRM (letras, números, `_` y `.`), sin repetir, con el correo siempre en su propiedad
        (`email` o `Email`), que es la clave del alta o actualización. `url` solo en el webhook: https:// con dominio
        público, puerto 443 y sin usuario (SSRF; al enviar también se comprueba que el dominio no resuelva a la red
        interna). Activar un CRM sin sus variables de entorno da 422 FALTA_CLAVE; el webhook sin URL, 422 FALTA_URL;
        activar el webhook sin clave la genera. Activar no envía los leads anteriores. Auditoría CRM_CONEXION_EDITADA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmCambio'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEstado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '422':
          $ref: '#/components/responses/NoValido'
  /captacion/crm/webhook/secreto:
    post:
      tags:
      - Captación
      summary: Regenerar la clave del webhook (HU-1602)
      operationId: post_captacion_crm_webhook_secreto
      description: Solo SUPERADMIN. Una clave nueva (`whsec_` y 32 bytes al azar); la anterior deja de valer en el siguiente envío. Auditoría CRM_SECRETO_REGENERADO, sin la clave.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmEstado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /captacion/crm/{tipo}/probar:
    post:
      tags:
      - Captación
      summary: «Enviar prueba» a una conexión (HU-1602, CP-130)
      operationId: post_captacion_crm_probar
      description: |-
        Solo SUPERADMIN, en la misma solicitud. El webhook recibe el evento `lead.prueba` (un lead de ejemplo que el
        receptor no debe guardar) con las cabeceras `X-Aptio-Firma: t=<unix>,v1=<hex>` (HMAC-SHA256 de `${t}.${cuerpo}`
        con la clave del panel), `X-Aptio-Evento` y `X-Aptio-Entrega`. Un CRM recibe una lectura que solo comprueba la
        clave. Cada pedido tiene 10 s y no sigue redirecciones. `ok` false trae el motivo sin claves. Auditoría
        CRM_PRUEBA_ENVIADA. 422 FALTA_URL o FALTA_SECRETO en el webhook.
      parameters:
      - name: tipo
        in: path
        required: true
        schema:
          type: string
          enum: [hubspot, pipedrive, zoho, webhook]
      responses:
        '200':
          description: El resultado de la prueba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PruebaCrm'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoValido'
  /captacion/popups:
    get:
      tags:
      - Captación
      summary: Popups del sitio con sus resultados (HU-1603, PNT-31)
      operationId: get_captacion_popups
      description: |-
        Solo SUPERADMIN, con `Cache-Control: no-store`. En su orden, con impresiones, conversiones y la tasa de conversión.
      responses:
        '200':
          description: OK

      description: |-
        Solo SUPERADMIN. Los campos que faltan toman los de un popup nuevo; se crea apagado salvo `visible: true`, al final
        del orden. Reglas (RN-17-3): `frecuenciaDias` de 7 a 365; la barra solo con `al_cargar`; `valorDisparador` en
        segundos (1 a 600) para `tiempo` o en porcentaje (1 a 100) para `desplazamiento`; `paginas` con rutas exactas,
        comodín final (`/blog/*`) o `*`, y nunca `/pago*`; `enlaceDestino` es una ruta del sitio que empieza con una sola
        `/` (sin esquema, dominio ni consulta). Los textos son planos: el sitio nunca los interpreta como HTML. Auditoría

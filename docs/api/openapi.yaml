        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pantallaId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrabacionEntrada'
      responses:

        Sin sesión y fuera del prefijo de la API. El script del sitio avisa cada vez que muestra un popup (`impresion`) y
        cuando se pulsa el enlace de un popup con `enlace_interno` (`conversion`); la conversión de un popup de correo se
        cuenta al llegar el lead por `POST /publico/leads` con `popupId`. No guarda datos personales: solo suma contadores.
        Un popup apagado o que no existe se ignora con el mismo 204. 429 DEMASIADAS_SOLICITUDES con más de 30 eventos por
        minuto desde la misma IP.
      requestBody:

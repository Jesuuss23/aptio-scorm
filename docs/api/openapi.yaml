  /cursos/{cursoId}/narraciones/regenerar:
    post:
      tags:
      - Personaje y voz
      summary: Regenerar narraciones
      operationId: post_cursos_cursoId_narraciones_regenerar
      description: >-
        HU-0703. Continúa las etapas 6 (Voz en español), 7 (Boca del personaje) y 8 (Subtítulos, HU-0801) de la última generación del proyecto;
        el avance se sigue con `eventos`. Por defecto mira solo las DESACTUALIZADA. El worker decide por el hash RN-07-1:
        una narración cuyo texto, voz, velocidad y pronunciación no cambiaron vuelve a «Lista» sin pedir otra voz.
        Con `pantallaIds` y `soloDesactualizadas: false` pide una toma nueva de esas pantallas aunque nada haya
        cambiado. Lo usa el equipo; el revisor del cliente recibe 403. 409 `GENERACION_ACTIVA` si ya hay una generación
        en curso; 422 `SIN_VOZ` si el curso aún no tiene voz, `IDIOMA_NO_DISPONIBLE` si se piden los dos idiomas a la vez,
        `SIN_TRADUCCION` si se pide `en` y ninguna narración tiene su inglés, y `PANTALLAS_REQUERIDAS` si
        `soloDesactualizadas` es false sin `pantallaIds`.
        HU-0804 · Con `idiomas: [en]` las etapas 6 a 8 hacen la voz, la boca y los subtítulos en inglés de las narraciones
        que ya tienen su inglés (`porIdioma.en`, `pNN-en.mp3` y `pNN-en.vtt`), con la voz en inglés del kit o
        en-US-Neural2-F y solo los términos de pronunciación en inglés del cliente; el español no se toca.
      parameters:
      - name: cursoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NarracionSolicitud'
      responses:
        '202':
          description: Generación continuada con las etapas 6 a 8 en cola
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regeneracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoValido'

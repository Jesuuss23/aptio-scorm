<title>Aptio SCORM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: menú lateral blanco con secciones + contenido en tarjetas blancas sobre gris claro; azul corporativo para acciones; la cápsula se dibuja con unidades cqw para verse igual en miniatura y en grande */
:root{
  color-scheme:light;
  /* Aptio SCORM: cobalto (acción y navegación), naranja (marca e IA), verde azulado (validado) */
  --bg:#F4F6F9; --panel:#FFFFFF; --ink:#0B1C30; --muted:#64748B; --line:#E2E8F0; --soft:#F1F5F9;
  --accent:#004ECC; --accent-dark:#003EA3; --accent-ink:#FFFFFF; --accent-soft:#EFF6FF;
  --brand:#FF6B35;
  --ia:#FF6B35; --ia-ink:#AB3500; --ia-soft:#FFF1EB; --ia-line:#FFD3C2;
  --warn:#92400E; --warn-soft:#FEF3C7; --err:#BA1A1A; --err-soft:#FFDAD6; --ok:#0F766E; --ok-soft:#CCFBF1;
  --stage:#E9EEF6; --shadow:0 2px 8px -2px rgba(15,23,42,.06),0 1px 4px -1px rgba(15,23,42,.04); --shadow-hi:0 12px 24px -6px rgba(0,78,204,.10),0 4px 8px -2px rgba(15,23,42,.04);
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-cap:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Barra superior */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-cap);font-size:20px}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.steps a{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700}
.steps a .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--soft);color:var(--muted)}
.steps a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.steps a[aria-current="page"] .n,.steps a.done .n{background:var(--accent);color:var(--accent-ink)}
.steps .sep{width:14px;height:2px;background:var(--line)}
.biz{display:flex;gap:4px;margin-left:auto}
.biz a{padding:7px 11px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:700}
.biz a[aria-current="page"]{background:var(--soft)}
/* Comunes */
main{padding-block:20px 40px;display:flex;flex-direction:column;gap:16px;max-width:1360px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cols{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.col{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ia{background:var(--ia-soft);border-color:var(--ia-line);color:var(--ia-ink)}
.btn.ia:hover{border-color:var(--ia)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.big{padding:13px 22px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);white-space:nowrap;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ia{background:var(--ia-soft);color:var(--ia-ink)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:9px;padding:9px 12px;font-size:12px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ia{background:var(--ia-soft);color:var(--ia-ink);border:1px solid var(--ia-line)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-weight:700;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:#1E293B;color:#fff;padding:10px 14px;border-radius:9px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Generar */
.hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.hero h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.vs{display:flex;gap:8px;flex-wrap:wrap}
.vs .k{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px}
.vs .k b{display:block;font-family:var(--f-num);font-size:16px}
.vs .k.now b{color:var(--err)}
.vs .k.new b{color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.drop:hover{border-color:var(--accent)}
.file{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:9px;padding:8px 10px;flex:1 1 220px;min-width:0}
.file .ic{width:34px;height:40px;border-radius:5px;background:var(--err);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.kit{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.kit[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:9px}
.sws{display:flex;gap:4px}.sws i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.recv{display:flex;flex-direction:column;gap:8px}
.recv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
/* Producción */
.pipe{display:flex;flex-direction:column;gap:6px}
.stg{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.stg .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.stg.run{border-color:var(--ia);box-shadow:0 0 0 3px var(--ia-soft)}
.stg.run .st{background:var(--ia);color:#fff;animation:pulse 1s infinite}
.stg.done .st{background:var(--ok);color:#fff}
.stg .d{font-size:12px;color:var(--muted)}
.stg .pv{font-size:11px;color:var(--muted);text-align:right}
@keyframes pulse{50%{transform:scale(.85)}}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tcell{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);border:0;background:transparent;padding:0;text-align:left;min-width:0}
.tcell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell .thumb{border:2px solid var(--line);border-radius:6px}
.tcell[aria-current="true"] .thumb{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tcell[aria-current="true"]{color:var(--ink);font-weight:700}
.tcell .stt{display:flex;justify-content:space-between;gap:4px;align-items:center}
.ghost{aspect-ratio:16/9;border-radius:6px;background:repeating-linear-gradient(45deg,var(--soft) 0 8px,var(--bg) 8px 16px);border:2px dashed var(--line)}
/* Revisión */
.rev{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px;align-items:start}
.rev-l{max-height:calc(100vh - 32px);overflow:auto;position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.rev-l .tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.rev-c{display:flex;flex-direction:column;gap:12px;min-width:0}
.rev-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.stagebox{background:var(--stage);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.stagebox .cap{max-width:860px;box-shadow:0 6px 22px rgba(0,0,0,.2)}
.subt{max-width:860px;width:100%;background:rgba(16,32,51,.9);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;min-height:34px}
.subt b{color:#F2A900}
.prop{background:var(--ia-soft);border:2px solid var(--ia);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.vars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.vars button{border:2px solid var(--line);border-radius:8px;padding:4px;background:var(--panel);display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink)}
.vars button:hover{border-color:var(--ia)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--ia-line);background:var(--ia-soft);color:var(--ia-ink);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.checks{display:flex;flex-direction:column;gap:6px;font-size:12px}
.checks div{display:flex;gap:8px;align-items:flex-start}
.checks .i{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--ok)}
.checks .i.w{background:#B54708}
.cascade{display:flex;flex-wrap:wrap;gap:6px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
/* Entrega */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel)}
.opt.on{border:2px solid var(--accent);background:var(--accent-soft);padding:9px}
.opt small{display:block;color:var(--muted);font-size:12px}
/* Rentabilidad */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .from{font-family:var(--f-num);color:var(--muted);text-decoration:line-through;font-size:14px}
.kpi .to{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--ok)}
.kpi .to.bad{color:var(--err)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted)}
td input{width:76px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;text-align:right}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12px}
.btrack{height:22px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden}
.btrack i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.btrack .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
/* ---------- Cápsula: se dibuja con cqw para verse igual en miniatura y en grande ---------- */
.cap{--kp:#12355B;--ka:#F2A900;--ks:#2E7D6B;--kb:#F5F7FA;--ki:#102033;
  container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--kb);color:var(--ki);overflow:hidden;border-radius:6px;font-family:var(--f-body)}
.cap .in{position:absolute;inset:0;padding:5cqw 6cqw;display:flex;flex-direction:column;gap:2.2cqw}
.cap h3{font-family:var(--f-cap);font-weight:700;font-size:5.2cqw;line-height:1;color:var(--kp);margin:0;text-wrap:balance}
.cap .tx{font-size:2.1cqw;line-height:1.35}
.cap .sm{font-size:1.6cqw;opacity:.8}
.cap .btn-k{align-self:flex-start;background:var(--ka);color:#102033;border:0;border-radius:1cqw;padding:1.2cqw 2.6cqw;font-weight:700;font-size:1.9cqw}
.cap .key{background:#fff;border-left:.8cqw solid var(--ka);border-radius:.8cqw;padding:1.4cqw 1.8cqw;font-size:1.9cqw;color:#102033;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.08)}
.cap .chr{position:absolute;bottom:0}
.cap .bub{background:#fff;border-radius:2cqw;padding:2.4cqw 2.8cqw;font-size:2.3cqw;line-height:1.35;color:#102033;box-shadow:0 .6cqw 2cqw rgba(0,0,0,.12);position:relative}
.cap .bub::before{content:"";position:absolute;left:-1.6cqw;top:3cqw;border:1.6cqw solid transparent;border-right-color:#fff;border-left:0}
.cap .card-k{background:#fff;border:.25cqw solid #C9D3DD;border-radius:1cqw;padding:1.2cqw 1.6cqw;font-size:1.8cqw;color:#102033;display:flex;align-items:center;gap:1.2cqw}
.cap .zone{border:.35cqw dashed;border-radius:1.4cqw;padding:1.2cqw;font-weight:700;font-size:2cqw;display:flex;justify-content:center;align-items:flex-start}
.cap .ico{width:6.5cqw;height:6.5cqw;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.cap .ico svg{width:60%;height:60%}
.cap .opt-k{background:#fff;border:.3cqw solid #C9D3DD;border-radius:1.2cqw;padding:1.3cqw 1.8cqw;font-size:2cqw;color:#102033;text-align:left;width:100%;font-family:inherit;cursor:pointer}
.cap .opt-k.good{border-color:#1F7A3D;background:#E6F3EA}
.cap .opt-k.bad{border-color:#B54708;background:#FBEADF}
.cap .fb{font-size:1.8cqw;font-weight:700}
.cap .an{animation:capIn .6s both}
@keyframes capIn{from{opacity:0;transform:translateY(2cqw)}to{opacity:1;transform:none}}
@keyframes capZoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes capPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,169,0,.6)}50%{box-shadow:0 0 0 1.6cqw rgba(242,169,0,0)}}
.cap .zm{animation:capZoom .5s both}
.thumb .cap *{animation:none!important}
.thumb .cap{border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* Editor de pantalla */
.edtop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tname{font-weight:700;font-size:16px;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 8px;flex:1;min-width:0}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--panel)}
.edg{display:grid;grid-template-columns:70px 250px minmax(0,1fr) 280px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);min-height:560px}
.rail2{display:flex;flex-direction:column;gap:2px;padding:8px 5px;border-right:1px solid var(--line)}
.rail2 button{border:0;background:transparent;border-radius:9px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.rail2 svg{width:22px;height:22px}
.rail2 button:hover{background:var(--soft);color:var(--ink)}
.rail2 button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.rail2 button.ia{color:var(--ia-ink)}
.fly2{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:740px;min-width:0}
.g1{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.addg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.addg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink)}
.addg button:hover,.artg button:hover{border-color:var(--accent)}
.pv2{height:46px;display:grid;place-items:center;width:100%;background:#F5F7FA;border-radius:7px;color:#102033}
.pv2>span{display:block}
.artg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.artg button{aspect-ratio:1;border:1px solid var(--line);background:#F5F7FA;border-radius:8px;padding:6px}
.artg button[aria-pressed="true"]{border:2px solid var(--accent)}
.fq{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%;color:var(--ink)}
.lyr{display:flex;gap:6px;align-items:center;border-radius:7px;padding:2px 4px}
.lyr.on{background:var(--accent-soft)}
.lyr button{border:0;background:transparent;text-align:left;flex:1;padding:5px 4px;font-size:12px;color:var(--ink)}
.lyr .mini{flex:0 0 auto;font-size:11px;color:var(--muted)}
.iab{border:1px solid var(--ia-line);background:var(--ia-soft);color:var(--ia-ink);border-radius:9px;padding:8px;font-weight:700;font-size:12px;text-align:left}
.edc{background:var(--stage);padding:12px 16px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.ctx{width:100%;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;white-space:nowrap;gap:2px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;min-height:42px}
.ctx button{flex:0 0 auto;border:0;background:transparent;border-radius:7px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--ink)}
.ctx button:hover{background:var(--soft)}
.ctx button[aria-pressed="true"]{background:var(--soft)}
.ctx .ia{color:var(--ia-ink)}
.ctx .cl{flex:0 0 auto;padding:0 8px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .sp{width:1px;height:20px;background:var(--line);margin:0 3px}
.ctx .dot{width:20px;height:20px;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);margin:0 1px}

    case "ed-redo": if (ED.fut.length) { ED.hist.push(JSON.stringify(cur())); restore(ED.fut.pop()); edRender(); } break;
    case "ed-mode": ED.mode = v; edRender(); break;
    case "ed-tl": ED.tl = ED.tl === false; if (ED.tl === false) tlStop(true); edRender(); break;
    case "ed-panel": ED.panel = v; edRender(); break;
    case "ed-pick": ED.sel = v; edRender(); break;
    case "ed-desel": ED.sel = null; edRender(); break;
    case "ed-text": { const n = $(`#sbox [data-k="${k}"]`); if (n) startInline(n.dataset.f ? n : n.querySelector("[data-f]")); break; }
    case "ed-size": { if (!k) break; snap(); const o = sty(k); if (isVisual(k)) o.sc = clamp(+((o.sc || 1) + 0.1 * +b.dataset.d).toFixed(2), 0.4, 2.5); else o.fs = clamp(+((o.fs || defFs(k)) + 0.3 * +b.dataset.d).toFixed(1), 0.8, 14); edRender(); break; }
    case "ed-color": { if (!k) break; snap(); const o = sty(k); if (isBg(k)) o.bg = v; else o.c = v; edRender(); break; }
    case "ed-bg": snap(); s.bgc = v === "fondo" ? null : v; edRender(); break;
    case "ed-align": snap(); sty(k).al = v; edRender(); break;
    case "ed-anim-next": { snap(); const o = sty(k), L = ["auto", "aparecer", "deslizar", "zoom", "rebotar", "ninguna"]; o.an = L[(L.indexOf(o.an || "auto") + 1) % L.length]; if (o.an === "auto") delete o.an; edRender(); edAct("ed-anim"); break; }
    case "ed-an": snap(); if (v === "auto") delete sty(k).an; else sty(k).an = v; edRender(); edAct("ed-anim"); break;
    case "ed-anim": { const c = $("#sbox .cap"); if (!c) break; c.classList.remove("edit"); replay(); setTimeout(() => { const c2 = $("#sbox .cap"); if (c2 && route() === "editor" && !ED.editing) { c2.classList.add("edit"); markSel(); } }, 3200); break; }
    case "ed-reset": { snap(); const o = sty(b.dataset && b.dataset.k || k); delete o.dx; delete o.dy; delete o.sc; delete o.fs; edRender(); break; }
    case "ed-hide": { const kk = (b.dataset && b.dataset.k) || k; if (!kk) break; snap(); const o = sty(kk); o.hid = !o.hid; edRender(); toast(o.hid ? "Elemento oculto · se puede mostrar desde Capas" : "Elemento visible"); break; }
    case "ed-del": snap(); s.ex = (s.ex || []).filter((e) => e.id !== k); ED.sel = null; edRender(); toast("Elemento eliminado"); break;
    case "ed-add": edAdd(v); break;
    case "ed-art": snap(); if (k === "img") { s.img = v; delete s.imgSrc; edRender(); toast("Imagen cambiada"); } else { const x = (s.ex || []).find((e) => e.id === k && e.ty === "imagen"); if (x) { x.art = v; delete x.src; edRender(); } else edAdd("imagen", { art: v }); } break;
    case "ed-pose": snap(); s.pose = v; edRender(); break;
    case "ed-layout": snap(); Object.assign(S[G.sel], fill(s, v), { sty: {} }); ED.sel = null; edRender(); toast("Diseño aplicado: " + LNAME[v] + " · puedes deshacer"); break;
    case "ed-gen": ED.gen = true; G.ia += 0.16; edRender(); toast("IA: 4 variantes con el estilo del kit"); break;
  }
}

/* ---------- Render y eventos ---------- */
function route() { const h = location.hash.replace("#", ""); return VIEWS[h] ? h : "proyectos"; }
function render() {
  const r = route();
  renderNav(r);
  $("#main").innerHTML = VIEWS[r]();
  if (r === "editor") { markSel(); tlAfterRender(); }
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act, v = b.dataset.v;
  if (a.startsWith("ed-")) { if (a !== "ed-ok") edAct(a, b); return; }
  if (a.startsWith("tl-")) { tlAct(a, b); return; }
  switch (a) {
    case "kit": G.kit = v; render(); break;
    case "pant": G.pant = +v; render(); break;
    case "file": G.file = true; render(); break;
    case "nofile": G.file = false; render(); break;
    case "gen": startRun(); break;
    case "filter": G.filter = v; render(); break;
    case "sel": G.sel = +b.dataset.i; ED.sel = null; ED.hist = []; ED.fut = []; G.prop = null; G.vars = false; G.dirty = false; clearInterval(talk); render(); break;
    case "nav": G.sel = clamp(G.sel + +b.dataset.d, 0, S.length - 1); ED.sel = null; ED.hist = []; G.prop = null; G.vars = false; G.dirty = false; clearInterval(talk); render(); break;
    case "approve": S[G.sel].st = "aprobada"; toast("Pantalla aprobada"); if (G.sel < S.length - 1) G.sel++; render(); break;
    case "approve-all": { let n = 0; S.forEach((x) => { if (x.st === "lista") { x.st = "aprobada"; n++; } }); render(); toast(`${n} pantallas aprobadas · quedan las que tienen observaciones`); break; }
    case "play": play(); break;
    case "replay": replay(); break;
    case "ans": { const s = S[G.sel]; s._ans = +b.dataset.j; render(); break; }
    case "ia": iaPropose(v); break;
    case "papply": if (G.prop) { const msg = G.prop.msg || "Cambio aplicado · voz, boca e inglés actualizados"; if (route() === "editor") snap(); G.prop.apply(); ED.sel = null; G.prop = null; S[G.sel].st = S[G.sel].st === "aprobada" ? "lista" : S[G.sel].st; render(); toast(msg); } break;
    case "pno": G.prop = null; render(); break;
    case "pickvar": Object.assign(S[G.sel], fill(S[G.sel], v)); G.vars = false; render(); toast("Variante aplicada: " + LNAME[v]); break;
    case "novars": G.vars = false; render(); break;
    case "dl": toast("En el producto se descarga el ZIP del SCORM; el prototipo no genera el archivo"); break;
    case "toast": toast(b.dataset.msg); break;
  }
});
let regenT;
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "topic") { G.topic = t.value; const g = $('[data-act="gen"]'); if (g) g.disabled = !(G.file || G.topic.trim()); }
  if (t.id === "pub") G.publico = t.value;
  if (t.id === "inter") { G.inter = +t.value; render(); $("#inter").focus(); }
  if (t.id === "et" || t.id === "en") {
    const s = S[G.sel]; if (t.id === "et") { s.t = t.value; const h = $('#sbox [data-f="t"]'); if (h) h.textContent = t.value; } else { s.n = t.value; if ($("#subt")) $("#subt").textContent = t.value; }
    s.en = false; G.dirty = true; if ($("#casc")) $("#casc").innerHTML = cascadeHTML(); clearTimeout(regenT);
    regenT = setTimeout(() => { G.dirty = "run"; if ($("#casc")) $("#casc").innerHTML = cascadeHTML(); setTimeout(() => { G.dirty = false; s.en = true; G.ia += 0.01; if ($("#casc")) $("#casc").innerHTML = cascadeHTML(); }, 1200); }, 900);
  }
  if (t.dataset.edf) { setPath(S[G.sel], t.dataset.edf, t.value); S[G.sel].en = false; refreshStage(); }
  if (t.dataset.eds && ED.sel) { const o = sty(ED.sel); o[t.dataset.eds] = +t.value; refreshStage(); }
  if (t.dataset.eda) { S[G.sel][t.dataset.eda] = t.value; }
  if (t.dataset.rt) { RT[t.dataset.rt] = +t.value || 0; rentUpdate(); }
  if (t.dataset.et) { RT.et[+t.dataset.et][+t.dataset.c] = +t.value || 0; rentUpdate(); }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "les" || t.id === "len") { G.langs[t.id === "les" ? "es" : "en"] = t.checked; render(); }
  if (t.id === "tono") G.tono = t.value;
  if (t.id === "tts") G.tts = t.checked;
  if (t.dataset.edf || t.dataset.eds) { snap(); edRender(); }
  if (t.dataset.tlin && ED.sel) { snap(); const o = sty(ED.sel); if (t.value === "") { if (t.dataset.tlin === "fin") delete o.fin; } else o[t.dataset.tlin] = Math.max(0, +(+t.value).toFixed(2)); if (o.fin != null && o.dl != null && o.fin <= o.dl) o.fin = +(o.dl + 0.5).toFixed(2); edRender(); toast("Tiempo actualizado"); }
  if (t.dataset.tlword !== undefined && t.value && ED.sel) { snap(); sty(ED.sel).dl = +(+t.value).toFixed(2); edRender(); toast(`${elName(ED.sel)} aparecerá con «${t.selectedOptions[0].textContent.split("· ")[1]}»`); }
  if (t.dataset.act === "ed-ok") { snap(); S[G.sel].ok = t.checked ? +ED.sel.slice(2) : S[G.sel].ok; edRender(); }
  if ((t.id === "upimg" || t.id === "upimg2") && t.files[0]) { const f = t.files[0], r = new FileReader(); r.onload = () => { snap(); if (ED.sel === "img") { S[G.sel].imgSrc = r.result; edRender(); toast("Imagen reemplazada"); } else edAdd("imagen", { src: r.result }); }; r.readAsDataURL(f); }
  if (t.dataset.exp) { G.exp[t.dataset.exp] = t.checked; render(); }
});
document.addEventListener("keydown", (ev) => { if (ev.target.id === "ask" && ev.key === "Enter") { ev.preventDefault(); iaPropose("libre"); } });
window.addEventListener("hashchange", () => { clearInterval(talk); tlStop(true); render(); window.scrollTo(0, 0); });
render();
</script>

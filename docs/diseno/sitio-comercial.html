<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aptio SCORM · Sitio comercial y panel superadmin (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
/* Tokens de docs/diseno/DESIGN.md. Panel: escala de 6 tamaños (11, 12, 14, 16, 20, 26) y 32 px desde la barra lateral.
   Sitio público: escala 56 / 40 / 26 / 20 / 16 / 14 / 12. */
:root{
  color-scheme:light;
  --bg:#F4F6F9;--panel:#FFFFFF;--ink:#0B1C30;--muted:#64748B;--line:#E2E8F0;--soft:#F1F5F9;
  --accent:#004ECC;--accent-dark:#003EA3;--accent-ink:#FFFFFF;--accent-soft:#EFF6FF;
  --brand:#FF6B35;--ia:#FF6B35;--ia-ink:#AB3500;--ia-soft:#FFF1EB;--ia-line:#FFD3C2;
  --ok:#0F766E;--ok-soft:#CCFBF1;--warn:#92400E;--warn-soft:#FEF3C7;--err:#BA1A1A;--err-soft:#FFDAD6;
  --side:#004ECC;--side-ink:#FFFFFF;--side-muted:rgba(255,255,255,.72);--side-hi:rgba(255,255,255,.16);
  --hero:#0B1C30;--hero-ink:#FFFFFF;--skin:#C68B62;
  --shadow:0 2px 8px -2px rgba(15,23,42,.06),0 1px 4px -1px rgba(15,23,42,.04);
  --shadow-hi:0 12px 24px -6px rgba(0,78,204,.10),0 4px 8px -2px rgba(15,23,42,.04);
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-cap:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1524;--panel:#142035;--ink:#E6EDF7;--muted:#9AA9BE;--line:#26354F;--soft:#1A2842;
  --accent:#3D7BFF;--accent-dark:#2F66DB;--accent-soft:#16284D;
  --ia-ink:#FFB59D;--ia-soft:#3A1D10;--ia-line:#6A3017;
  --ok:#5EEAD4;--ok-soft:#10332F;--warn:#FCD34D;--warn-soft:#3A2C0B;--err:#FFB4AB;--err-soft:#3D1614;
  --side:#0B2A66;--hero:#081120;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1524;--panel:#142035;--ink:#E6EDF7;--muted:#9AA9BE;--line:#26354F;--soft:#1A2842;
  --accent:#3D7BFF;--accent-dark:#2F66DB;--accent-soft:#16284D;
  --ia-ink:#FFB59D;--ia-soft:#3A1D10;--ia-line:#6A3017;
  --ok:#5EEAD4;--ok-soft:#10332F;--warn:#FCD34D;--warn-soft:#3A2C0B;--err:#FFB4AB;--err-soft:#3D1614;
  --side:#0B2A66;--hero:#081120;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
img{max-width:100%}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ============ PANEL SUPERADMIN ============ */
.adm{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;border-bottom:1px solid var(--side-hi);margin-bottom:8px;text-decoration:none;color:var(--side-ink)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.side .brand b{font-size:16px;display:block}
.side .brand b span{color:#FFB59D}
.side .brand small{font-size:11px;color:var(--side-muted)}
.side .grp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--side-muted);padding:12px 8px 4px}
.side a.it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:600;position:relative}
.side a.it:hover{background:var(--side-hi)}
.side a.it[aria-current="page"]{background:var(--side-hi)}
.side a.it[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.side a.it .chip{margin-left:auto}
.side .back{font-size:12px;color:var(--side-muted);text-decoration:none;padding:6px 10px}
.side .back:hover{color:var(--side-ink)}
.side .foot{margin-top:auto;padding-top:12px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--side-hi)}
.side .foot .av{width:32px;height:32px;border-radius:50%;background:#fff;color:#004ECC;display:grid;place-items:center;font-weight:700;font-size:12px}
.side .foot small{display:block;font-size:12px;color:var(--side-muted)}
.amain{min-width:0;display:flex;flex-direction:column}
.atop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.crumb{display:flex;gap:8px;align-items:center;color:var(--muted)}
.crumb b{color:var(--ink)}
.atop .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.view{padding:24px 32px 48px;max-width:1600px;width:100%;display:flex;flex-direction:column;gap:20px}
.vhead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
.vhead h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.vhead p{color:var(--muted);margin-top:4px;max-width:720px}
.vhead .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:700}
.card .ch{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.card .ch p{color:var(--muted);font-size:12px;width:100%}
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-num);font-size:20px;font-weight:600}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--err)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ia{background:var(--ia-soft);border-color:var(--ia-line);color:var(--ia-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.icon{padding:5px 8px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--soft);white-space:nowrap;font-weight:700;color:var(--ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.ia{background:var(--ia-soft);color:var(--ia-ink)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.fic{background:var(--warn-soft);color:var(--warn);font-weight:600}
.note{border-radius:10px;padding:10px 12px;font-size:12px;background:var(--soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ia{background:var(--ia-soft);color:var(--ia-ink);border:1px solid var(--ia-line)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.sm{font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea,.inp{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font-size:14px;font-weight:400}
label.f textarea{min-height:80px;resize:vertical;font-family:var(--f-num);font-size:12px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-weight:700;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.t{width:100%;border-collapse:collapse;min-width:640px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td .sm{display:block}
table.t tr.off td{opacity:.55}
table.t td.r,table.t th.r{text-align:right}
.sw{width:38px;height:22px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;flex:0 0 auto;transition:background .15s}
.sw span{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"] span{left:19px}
.vis{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.ia{background:var(--ia)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent);flex:0 0 auto}
.time{font-family:var(--f-num);font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 8px;text-align:center;min-width:64px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.blk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.blk.off{background:var(--soft)}
.blk.off b{text-decoration:line-through;color:var(--muted)}
.blk .grow{flex:1;min-width:0}
.prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.prev .bar2{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.prev .bar2 i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.prev .zoom{zoom:.5;max-height:1500px;overflow:auto;pointer-events:none}
.prev.mob .zoom{zoom:.62;width:390px;margin:0 auto}
.serp{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.serp .u{font-size:12px;color:var(--ok)}
.serp .tt{font-size:16px;color:#1A0DAB;font-weight:600}
:root[data-theme="dark"] .serp .tt{color:#8AB4F8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .serp .tt{color:#8AB4F8}}
.serp .dd{font-size:12px;color:var(--muted)}
.counter{font-family:var(--f-num);font-size:11px;color:var(--muted);align-self:flex-end}
.counter.over{color:var(--err)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.plan-ed{display:flex;flex-direction:column;gap:12px}
.plan-ed.star{border:2px solid var(--accent)}
.feat{display:flex;gap:8px;align-items:center}
.feat input{flex:1}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;text-align:center}
.cal .s{border-radius:8px;padding:6px;text-align:center;font-size:12px;font-family:var(--f-num);background:var(--soft);border:0}
.cal .s.on{background:var(--ok-soft);color:var(--ok);font-weight:600}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1E293B;color:#fff;padding:10px 14px;border-radius:10px;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100vw - 32px);font-size:14px}
@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .adm{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;gap:4px;align-items:center}
  .side .brand{border:0;padding:0 8px 0 0;margin:0}
  .side .brand div,.side .grp,.side .foot,.side .back{display:none}
  .side a.it{white-space:nowrap}
  .side a.it[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px;border-radius:3px 3px 0 0}
  .atop{padding:10px 16px}
  .view{padding:16px 16px 40px}
  .tbl-wrap{margin:0 -20px}
}

/* ============ SITIO PÚBLICO ============ */
/* Dirección: editorial y sobria. Fondo blanco, separaciones con líneas finas, una sola acción azul por bloque,
   sin etiquetas en mayúsculas ni tarjetas repetidas. El naranja queda para el logo y para Ana. */
.site{font-family:var(--f-body);font-size:16px;line-height:1.6;color:var(--ink);background:var(--panel)}
.site h1,.site h2,.site h3{font-family:var(--f-ui);line-height:1.15;text-wrap:balance}
.site h1{font-size:56px;font-weight:800;letter-spacing:-.035em}
.site h2{font-size:40px;font-weight:700;letter-spacing:-.025em}
.site h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
.site p{text-wrap:pretty}
.site .lead{font-size:20px;line-height:1.5;color:var(--muted);max-width:34em}
.site .in{max-width:1160px;margin:0 auto;padding:0 32px}
.site section{padding:96px 0;border-top:1px solid var(--line)}
.site section.first,.site .hero{border-top:0}
.site section.soft{background:var(--bg);border-top:0}
.site .btn{font-family:var(--f-ui);font-size:16px;padding:12px 20px;border-radius:8px}
.site .btn.sm{font-size:14px;padding:8px 14px}
.site a.more{font-family:var(--f-ui);font-weight:700;font-size:16px;text-decoration:none;border-bottom:2px solid currentColor;padding-bottom:2px}
.site .intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}
.site .intro .side-t p{color:var(--muted);margin-top:16px;max-width:26em}
.anuncio{background:var(--accent-soft);color:var(--ink);font-family:var(--f-ui);font-size:14px;text-align:center;padding:10px 48px;position:relative}
.anuncio a{color:var(--accent);font-weight:700;margin-left:8px}
.anuncio button{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:16px}
.shead{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.shead .in{display:flex;align-items:center;gap:32px;height:72px}
.shead .wm{display:flex;align-items:center;gap:10px;font-family:var(--f-ui);font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.shead .wm .logo{width:32px;height:32px;border-radius:8px}
.shead nav{display:flex;gap:24px;font-family:var(--f-ui);font-size:14px;font-weight:600}
.shead nav a{color:var(--muted);text-decoration:none;padding:8px 0;border-bottom:2px solid transparent}
.shead nav a:hover{color:var(--ink)}
.shead nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.shead .acts{margin-left:auto;display:flex;gap:16px;align-items:center}
.shead .acts .link{font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--ink);text-decoration:none}
.shead .lang{font-family:var(--f-ui);font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted)}
.shead .burger{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-family:var(--f-ui);font-size:14px;font-weight:600}
.hero{padding:88px 0 72px}
.hero .in{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:64px;align-items:center}
.hero .lead{margin-top:24px}
.hero .facts{margin-top:16px;color:var(--ink);font-size:16px}
.hero .cta{display:flex;gap:24px;flex-wrap:wrap;align-items:center;margin-top:36px}
.hero .lmsline{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);max-width:34em}
.shot{margin:0}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stage .scene{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px;align-items:center;background:#F5F7FA;border:1px solid var(--line);border-radius:8px;padding:20px;color:#102033}
.stage .scene .slide b{font-family:var(--f-ui);font-size:20px;display:block;margin-bottom:6px;line-height:1.25}
.stage .scene .slide p{font-size:14px;color:#3D4C63}
.stage .subs{background:#102033;color:#fff;border-radius:6px;padding:10px 14px;font-size:16px;min-height:48px;text-align:center}
.stage .subs span{opacity:.45}
.stage .subs span.said,.stage .subs span.now{opacity:1}
.stage .ctl{display:flex;gap:12px;align-items:center}
.stage .ctl button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 12px;font-family:var(--f-ui);font-size:14px;font-weight:600}
.stage .ctl span{font-size:14px;color:var(--muted)}
.shot figcaption{font-size:14px;color:var(--muted);margin-top:12px}
.proof{font-family:var(--f-ui);font-size:16px;color:var(--muted)}
.proof b{color:var(--ink)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.metrics div{padding:8px 32px 8px 0;margin-right:32px;border-right:1px solid var(--line)}
.metrics div:last-child{border-right:0;margin-right:0}
.metrics b{font-family:var(--f-ui);font-size:40px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.metrics span{display:block;margin-top:8px;font-size:16px;color:var(--muted);max-width:16em}
.logos-t{font-size:14px;color:var(--muted);margin-bottom:24px}
.logos{display:flex;flex-wrap:wrap;gap:16px 48px;align-items:center}
.logos span{font-family:var(--f-ui);font-weight:800;font-size:20px;letter-spacing:-.02em;color:#7A8699;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px;padding:28px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:0}
.steps li::before{counter-increment:st;content:counter(st);font-family:var(--f-ui);font-size:20px;font-weight:700;color:var(--accent)}
.steps p{color:var(--muted);margin-top:6px}
.feature{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:64px;align-items:center;padding:56px 0}
.feature + .feature{border-top:1px solid var(--line)}
.feature.rev .txt{order:2}
.feature .txt p{color:var(--muted);margin-top:16px}
.feature ul,.fgrid ul{margin:20px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.feature li::marker,.fgrid li::marker{color:var(--muted)}
.feature .txt .more{display:inline-block;margin-top:24px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 64px;padding-top:56px;border-top:1px solid var(--line)}
.fgrid p{color:var(--muted);margin-top:10px}
.fgrid ul{font-size:16px;color:var(--ink)}
.mock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;font-family:var(--f-ui);font-size:14px;min-width:0}
.mock .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-weight:700}
.mock .mh span:last-child{font-weight:400;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles div{background:#F5F7FA;border:1px solid var(--line);border-radius:6px;padding:10px;aspect-ratio:4/3;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}
.tiles div i{height:5px;border-radius:2px;background:#D5DCE6;display:block;margin-top:4px}
.tiles div em{font-style:normal;color:var(--muted)}
.tiles div em.ok{color:var(--ok)}
.mouths{display:flex;gap:6px;flex-wrap:wrap}
.mouths span{width:36px;height:36px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--muted)}
.mouths span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .grow{flex:1;min-width:0}
.mrow em{font-style:normal;font-size:14px;color:var(--muted)}
.mrow em.ok{color:var(--ok)}
.lmslist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px}
.lmslist div{padding:16px 0;border-top:1px solid var(--line)}
.lmslist b{display:block;font-family:var(--f-ui);font-size:16px}
.lmslist span{font-size:14px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:stretch}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:20px}
.plan.star{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.plan .rec{font-family:var(--f-ui);font-size:14px;font-weight:700;color:var(--accent)}
.plan .price{font-family:var(--f-ui);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.plan .price small{font-size:14px;color:var(--muted);font-family:var(--f-body);letter-spacing:0;font-weight:400}
.plan ul{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:8px;flex:1}
.plan li::marker{color:var(--muted)}
.plan p{color:var(--muted);font-size:16px;margin-top:8px}
.plan .fine{font-size:14px;color:var(--muted)}
.bill{display:flex;margin-bottom:40px}
.bill .seg{border-radius:8px}
.bill .seg button{font-family:var(--f-ui);font-size:14px;padding:8px 16px}
.lead-quote{max-width:880px}
.lead-quote blockquote{margin:0;font-family:var(--f-ui);font-size:26px;font-weight:600;line-height:1.4;letter-spacing:-.015em}
.lead-quote figcaption,.qgrid figcaption{margin-top:20px;font-size:16px;color:var(--muted)}
.lead-quote figcaption b,.qgrid figcaption b{color:var(--ink);font-family:var(--f-ui)}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 48px;margin-top:64px}
.qgrid figure{margin:0;padding-top:24px;border-top:1px solid var(--line)}
.qgrid blockquote{margin:0}
.qgrid figcaption{font-size:14px;margin-top:16px}
.faq details{border-top:1px solid var(--line);padding:20px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{font-family:var(--f-ui);font-weight:700;font-size:20px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:24px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-weight:400}
.faq details[open] summary::after{content:"−"}
.faq details p{margin-top:12px;color:var(--muted);max-width:40em}
.closing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.closing p{color:var(--muted);margin-top:16px;font-size:20px;max-width:30em}
.closing .row{gap:24px}
.sfoot{background:var(--bg);color:var(--muted);padding:64px 0 32px;font-size:14px;border-top:1px solid var(--line)}
.sfoot .cols{display:grid;grid-template-columns:1.4fr repeat(5,minmax(0,1fr));gap:32px}
.sfoot b{display:block;color:var(--ink);font-family:var(--f-ui);margin-bottom:12px;font-size:14px}
.sfoot a{color:var(--muted);text-decoration:none;display:block;padding:4px 0}
.sfoot a:hover{color:var(--ink)}
.sfoot .bottom{border-top:1px solid var(--line);margin-top:48px;padding-top:20px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:12px}
.cmp{width:100%;border-collapse:collapse;font-size:16px;min-width:620px}
.cmp th,.cmp td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-family:var(--f-ui);font-size:16px}
.vs2{display:grid;grid-template-columns:1fr 1fr;gap:64px}
.vs2 h3{padding-bottom:12px;border-bottom:1px solid var(--line)}
.vs2 .old h3{color:var(--muted)}
.vs2 ul{margin:16px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.vs2 .old li{color:var(--muted)}
.crumb-s{font-family:var(--f-ui);font-size:14px;color:var(--muted);margin-bottom:32px}
.crumb-s a{color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:4px 24px;border-bottom:1px solid var(--line);margin-bottom:40px;font-family:var(--f-ui)}
.cats button{border:0;background:none;padding:10px 0;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.cats button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.cats button span{font-weight:400}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px 40px}
.post{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit}
.post .img{aspect-ratio:16/9;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--muted)}
.post .cat{font-family:var(--f-ui);font-size:14px;font-weight:700;color:var(--accent)}
.post h3{transition:color .15s}
.post:hover h3{color:var(--accent)}
.post p{color:var(--muted)}
.post .meta{font-size:14px;color:var(--muted)}
.book{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:64px;align-items:start}
.book ul{padding-left:20px;display:flex;flex-direction:column;gap:8px;margin:24px 0 40px}
.book .lead-quote blockquote{font-size:20px}
.booker{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;font-family:var(--f-ui);font-size:14px;display:flex;flex-direction:column;gap:20px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .h{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.days button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-variant-numeric:tabular-nums}
.days button[disabled]{opacity:.35;cursor:not-allowed;background:var(--bg)}
.days button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{border:1px solid var(--line);color:var(--ink);background:var(--panel);border-radius:6px;padding:8px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.slots button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.booker label.f{font-size:14px}
.booker input,.booker select{font-size:16px}
.okbox{border-left:3px solid var(--ok);padding:4px 0 4px 16px}
.okbox h3{color:var(--ok)}

/* ---- Landing v5: estructura de las propuestas de Stitch, tonos claros y cálidos del sistema ---- */
.site,#layer{--f-ui:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;--f-body:"Source Serif 4",Georgia,serif;
  --orange:#FF6B35;--orange-ink:#AB3500;--peach:#FFF1EB;--peach-2:#FFE4D6;--peach-line:#FFD3C2;--amber:#FEF3C7;--amber-ink:#92400E;--mint:#CCFBF1;--mint-ink:#0F766E;--ice:#F8F9FF;--ice-2:#EFF4FF}
.site{font-family:var(--f-body);font-size:16px;line-height:1.65}
.site h1{font-weight:800;letter-spacing:-.04em;line-height:1.05}
.site h2{font-weight:800;letter-spacing:-.03em;line-height:1.1}
.site h3{font-weight:700;letter-spacing:-.015em}
.site section{border-top:0}
.site .btn,#layer .btn{border-radius:8px;font-weight:700}
.site .btn.primary{box-shadow:0 6px 16px -8px rgba(0,78,204,.6)}
.site .mock,.site .stage,.site .booker{border-radius:12px}
.site .bg-ice{background:var(--ice)}
.site .bg-ice2{background:var(--ice-2)}
.site .bg-peach{background:var(--peach)}
.tagp{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-ink);background:var(--peach);border:1px solid var(--peach-line);border-radius:999px;padding:5px 12px}
.tagp::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.tagp.blue{color:var(--accent);background:var(--accent-soft);border-color:#D3E2FF}
.tagp.blue::before{background:var(--accent)}
.sh{text-align:center;max-width:760px;margin:0 auto 48px}
.sh h2{margin-top:16px}
.sh p{color:var(--muted);font-size:20px;margin-top:14px}
.anuncio{background:var(--peach);color:var(--ink);border-bottom:1px solid var(--peach-line)}
.anuncio a{color:var(--orange-ink)}
.anuncio button{color:var(--orange-ink)}
/* Portada centrada con cifras y captura debajo (inicio de Stitch) */
.hero{padding:80px 0 72px;background:linear-gradient(180deg,var(--ice) 0%,#fff 100%)}
.hero .in{display:block;text-align:center}
.hero h1{max-width:15em;margin:20px auto 0}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{margin:24px auto 0;max-width:36em}
.hero .facts{margin-top:12px;color:var(--muted)}
.hero .cta{justify-content:center;margin-top:32px}
.hero .shot{max-width:880px;margin:56px auto 0;text-align:left}
.hero .stage{background:#fff;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(11,28,48,.35);padding:0;overflow:hidden;gap:0}
.hero .stage .bar5{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ice-2);border-bottom:1px solid var(--line);font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.hero .stage .bar5 b{color:var(--ink)}
.hero .stage .bar5 .tagp{margin-left:auto;padding:2px 10px;font-size:11px}
.hero .stage .scene{border:0;border-radius:0;padding:28px;grid-template-columns:160px minmax(0,1fr);background:#fff}
.hero .stage .scene .slide b{font-size:26px}
.hero .stage .subs{margin:0 16px;border-radius:8px}
.hero .stage .ctl{padding:12px 16px 16px}
.hero .shot figcaption{text-align:center}
.hero .lmsline{border:0;margin:20px auto 0;padding:0;text-align:center}
.statrow{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:40px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 20px;min-width:170px;text-align:center}
.stat b{display:block;font-family:var(--f-ui);font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-top:2px;max-width:16em}
.stat:nth-child(2){background:var(--peach);border-color:var(--peach-line)}
.stat:nth-child(2) b{color:var(--orange-ink)}
.stat:nth-child(3){background:var(--mint);border-color:#A7EADB}
.stat:nth-child(3) b{color:var(--mint-ink)}
.proof{text-align:center}
.logos{justify-content:center}
.logos-t{text-align:center}
/* Pasos en tarjetas, la del medio en tono IA (Stitch) */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:10px}
.pcard .n{font-family:var(--f-ui);font-size:14px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:8px;width:40px;height:40px;display:grid;place-items:center}
.pcard p{color:var(--muted)}
.pcard.ia{background:var(--peach);border-color:var(--peach-line)}
.pcard.ia .n{background:var(--orange);color:#fff}
/* Funcionalidades: dos destacadas y el resto en tarjetas con icono */
.feature{padding:48px 0}
.feature + .feature{border-top:0}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:24px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
.fcard .ic{width:40px;height:40px;border-radius:10px;background:var(--peach);color:var(--orange-ink);display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;margin-bottom:14px}
.fcard:nth-child(3n+2) .ic{background:var(--accent-soft);color:var(--accent)}
.fcard:nth-child(3n) .ic{background:var(--mint);color:var(--mint-ink)}
.fcard p{color:var(--muted);margin-top:8px}
.fcard ul{margin:14px 0 0;padding-left:18px;font-size:16px}
/* LMS en tarjetas sobre banda clara (Stitch) */
.lmscards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.lmscards div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
.lmscards b{display:block;font-family:var(--f-ui);font-size:16px}
.lmscards span{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
/* Planes (Stitch): tarjetas con insignia en la destacada */
.site .plan{border-radius:16px;position:relative}
.site .plan.star{border:2px solid var(--accent);box-shadow:0 24px 48px -28px rgba(0,78,204,.45)}
.site .plan .badge5{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:4px 12px;white-space:nowrap}
.site .plan .price{color:var(--ink)}
.site .plan.star .price{color:var(--accent)}
.site .bill{justify-content:center}
.site .seg{border-radius:999px;overflow:hidden}
/* Testimonios en tarjetas sobre fondo durazno */
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.tcard{margin:0;background:#fff;border:1px solid var(--peach-line);border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:16px}
.tcard .q{font-family:var(--f-ui);font-size:40px;line-height:.6;color:var(--orange);height:20px}
.tcard blockquote{margin:0;flex:1}
.tcard figcaption{font-size:14px;color:var(--muted);border-top:1px solid var(--peach);padding-top:14px;font-family:var(--f-ui)}
.tcard figcaption b{display:block;color:var(--ink);font-size:14px}
/* Preguntas en filas con borde (Stitch) */
.faq{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq details,.faq details:last-child{border:1px solid var(--line);border-radius:12px;padding:18px 22px;background:#fff}
.faq details[open]{border-color:var(--peach-line);background:var(--peach)}
.faq summary{font-size:16px}
/* Llamada final: recuadro claro y cálido, centrado (personaje de Stitch) */
.ctabox{background:linear-gradient(135deg,var(--peach) 0%,#fff 55%,var(--ice-2) 100%);border:1px solid var(--peach-line);border-radius:20px;padding:56px 32px;text-align:center}
.ctabox h2{max-width:16em;margin:16px auto 0}
.ctabox p{color:var(--muted);font-size:20px;margin:14px auto 0;max-width:30em}
.ctabox .row{justify-content:center;margin-top:28px;gap:12px}
/* Antes y ahora (Stitch) */
.vs2 > div{border-radius:14px;padding:28px;border:1px solid var(--line)}
.vs2 .old{background:#fff}
.vs2 .new{background:var(--ice-2);border-color:#D3E2FF}
.vs2 h3{border:0;padding:0}
.vs2 .old li::marker{color:var(--err)}
.vs2 .new li::marker{color:var(--accent)}
/* Medios de pago (precios de Stitch) */
.pagos{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.pagos span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-family:var(--f-ui);font-size:14px;font-weight:700}
.pagos span small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cmp tr.grp td{background:var(--ice-2);font-family:var(--f-ui);font-weight:700;color:var(--accent);text-align:left}
/* Pie de color, claro y cálido */
.sfoot{background:var(--peach-2);color:#5B3A28;border-top:1px solid var(--peach-line)}
.sfoot b,.sfoot .flogo{color:var(--ink)!important}
.sfoot a{color:#5B3A28}
.sfoot a:hover{color:var(--orange-ink)}
.sfoot .bottom{border-top-color:var(--peach-line)}
.post .img{border-radius:12px;background:var(--peach);border-color:var(--peach-line);color:var(--orange-ink)}
.site .booker{box-shadow:0 24px 48px -32px rgba(11,28,48,.35)}
.days button[aria-pressed="true"],.slots button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
/* ---- Landing v6: más juego de azules; el naranja solo como acento de IA ---- */
.site,#layer{--b900:#003EA3;--b700:#004ECC;--b200:#C9D9FF;--b100:#DCE6FF;--b50:#EFF4FF}
.tagp{color:var(--b700);background:var(--b50);border-color:var(--b200)}
.tagp::before{background:var(--b700)}
.hero .stage .bar5 .tagp{color:var(--orange-ink);background:var(--peach);border-color:var(--peach-line)}
.hero .stage .bar5 .tagp::before{background:var(--orange)}
.anuncio{background:var(--b700);color:#fff;border-bottom:0}
.anuncio a,.anuncio button{color:#fff}
.hero{background:linear-gradient(180deg,var(--b50) 0%,#fff 100%)}
.hero .stage .bar5{background:var(--b100)}
.stat:nth-child(n){background:#fff;border-color:var(--b200)}
.stat:nth-child(n) b{color:var(--b700)}
.stat:nth-child(2){background:var(--b700);border-color:var(--b700)}
.stat:nth-child(2) b{color:#fff}
.stat:nth-child(2) span{color:#DCE6FF}
.stat:nth-child(3){background:var(--b100);border-color:var(--b200)}
.stat:nth-child(3) b{color:var(--b900)}
.site .bg-ice{background:var(--b50)}

function lineChart(){
 const N=30,a=[],b=[];for(let i=0;i<N;i++){const w=[.82,1,1.04,1.02,.98,.7,.6][i%7];a.push(Math.round((520+i*9+Math.sin(i*.9)*60)*w));b.push(Math.round(a[i]*(.018+.006*Math.sin(i*.5))+ (i===18?14:0)))}
 const W=720,H=220,P=28,mx=Math.max(...a)*1.1,mb=Math.max(...b)*1.3;
 const x=i=>P+i*(W-2*P)/(N-1),ya=v=>H-P-(v/mx)*(H-2*P),yb=v=>H-P-(v/mb)*(H-2*P);
 const pa=a.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${ya(v).toFixed(1)}`).join(""),pb=b.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${yb(v).toFixed(1)}`).join("");
 const lab=["4 oct.","11 oct.","18 oct.","25 oct.","2 nov."];
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas diarias y conversiones de los últimos 30 días">${[0,1,2,3].map(k=>`<line x1="${P}" x2="${W-P}" y1="${P+k*(H-2*P)/3}" y2="${P+k*(H-2*P)/3}" stroke="var(--line)"/>`).join("")}<path d="${pa} L${x(N-1)} ${H-P} L${P} ${H-P}Z" fill="var(--accent)" opacity=".08"/><path d="${pa}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="${pb}" fill="none" stroke="var(--ia)" stroke-width="2.5" stroke-dasharray="5 4"/>${lab.map((l,k)=>`<text x="${x(k*7)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="middle" font-family="var(--f-ui)">${l}</text>`).join("")}<circle cx="${x(18)}" cy="${yb(b[18])}" r="5" fill="var(--ia)"/></svg><div class="legend"><span><i style="background:var(--accent)"></i>Visitas</span><span><i style="background:var(--ia)"></i>Conversiones (leads + demos)</span></div></div>`;
}

 <div class="split"><div class="card"><div class="ch"><h2>Visitas y conversiones</h2><span class="chip ia">✦ Pico el 22 oct. con el artículo de SCORM 1.2</span></div>${lineChart()}</div>

/* ---------- Render y rutas ---------- */
let anaTimer=null;
function route(){const h=(location.hash||"#panel-resumen").slice(1);return h}
function render(keepScroll){
 const r=route();const y=keepScroll?window.scrollY:0;
 clearInterval(anaTimer);anaTimer=null;
 const app=$("#app");
 if(r.startsWith("panel-")){app.innerHTML=renderAdmin(r.slice(6));$("#layer").innerHTML="";}
 else{const base=r.split("#")[0]||"sitio";app.innerHTML=renderSite(base.startsWith("sitio")?base:"sitio");$("#layer").innerHTML=siteOverlays(base);startAna();const anchor=r.includes("#")?r.split("#")[1]:null;if(anchor&&!keepScroll){const el=document.getElementById(anchor);if(el){el.scrollIntoView();return}}}
 window.scrollTo(0,y);
 const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight;
}
function renderLayer(){const r=route();if(!r.startsWith("panel-"))$("#layer").innerHTML=siteOverlays(r.split("#")[0]);const m=$("#msgs");if(m)m.scrollTop=m.scrollHeight}

function startAna(){
 const st=$("#ana-stage");if(!st)return;const mouth=st.querySelector(".mouth");const words=[...document.querySelectorAll("#subs span")];const vt=[...document.querySelectorAll("#vtrack i")];const btn=$("#ana-play");const tt=$("#ana-t");
 const frames=[];GUION.forEach((w,i)=>w[1].forEach(v=>frames.push([i,v])));for(let k=0;k<6;k++)frames.push([-1,"X"]);
 let f=0,playing=!matchMedia("(prefers-reduced-motion: reduce)").matches;
 const draw=()=>{const [wi,v]=frames[f];mouth.innerHTML=BOCAS[v];words.forEach((s,i)=>{s.classList.toggle("now",i===wi);s.classList.toggle("said",wi<0||i<wi)});vt.forEach(x=>x.classList.toggle("now",x.dataset.v===v));const sec=Math.floor(f*0.09);if(tt)tt.textContent=`0:0${Math.min(sec,4)} / 0:04`};
 const tick=()=>{f=(f+1)%frames.length;draw()};
 draw();if(playing)anaTimer=setInterval(tick,90);
 btn.textContent=playing?"Pausar":"Reproducir";
 btn.onclick=()=>{playing=!playing;btn.textContent=playing?"Pausar":"Reproducir";clearInterval(anaTimer);if(playing)anaTimer=setInterval(tick,90)};
}

 if(l.includes("plan")||l.includes("precio")){const p=vis(DB.planes).filter(x=>!x.aMedida);a={r:"bot",html:`Tenemos ${p.map(x=>`<b>${esc(x.nombre)}</b> a ${sol(x.precio)} al mes (${x.capsulas} cápsulas)`).join(" y ")}, más el plan Empresa a medida. <a href="#sitio-precios">Ver precios</a>`}}
 else if(l.includes("agend")||l.includes("demo")){a={r:"bot",html:`Tengo estos horarios mañana (hora de Lima): ${DB.agenda.horas.slice(0,3).map(h=>`<button class="btn sm" data-qr="Reservar ${h}">${h}</button>`).join(" ")}`}}
 else if(l.startsWith("reservar")){const h=q.split(" ")[1];DB.agenda.citas.unshift({id:"r"+Date.now(),dia:"Mañana",hora:h,org:"Visitante del chat",con:"Por confirmar",tipo:"Demo del generador",estado:"Pendiente"});addLead("Visitante del chat","—","—","Chatbot",route());save();a={r:"bot",card:true,html:`<b>Demo reservada</b><br>Mañana ${esc(h)} · 30 min · Google Meet. Te pido tu correo para enviarte la invitación.`}}
 else if(l.includes("moodle")||l.includes("lms")){a={r:"bot",t:"Sí. El paquete cumple SCORM 1.2 de forma estricta y tenemos recomendaciones para Moodle 4.5 o superior. ¿Quieres probarlo con tu material en una demo?"}}
 else if(l.includes("whatsapp")){a={r:"bot",html:`Claro, escríbenos al <a href="https://wa.me/51900000000" target="_blank" rel="noopener">${esc(DB.sitio.whatsapp)}</a>. Te responde una persona de ${esc(DB.chatbot.traspaso)}.`}}
 else a={r:"bot",t:"Puedo contarte de los planes, la compatibilidad con tu LMS o agendarte una demo de 30 minutos. ¿Qué prefieres?"};
 S.msgs.push(a);renderLayer()}
function pagar(){const co=S.checkout;const n=String(432+DB.comprobantes.filter(c=>c.tipo!=="Nota de crédito").length-7).padStart(8,"0");const serie=co.ruc?DB.fiscal.serieF:DB.fiscal.serieB;co.comp=`${serie}-${n}`;const p=plan(co.plan);const anual=S.anual&&DB.planesConfig.mostrarAnual;const pm=anual?Math.round(p.precio*(1-DB.planesConfig.descuentoAnual/100)):p.precio;
 DB.suscriptores.unshift({id:"s"+Date.now(),org:co.org,ruc:co.ruc||"—",plan:p.id,monto:pm,ciclo:anual?"Anual":"Mensual",estado:"Activa",proximo:anual?"3 nov. 2027":"3 dic. 2026",pasarela:co.pay,usadas:0,cuota:p.capsulas});
 DB.comprobantes.unshift({id:co.comp,tipo:co.ruc?"Factura":"Boleta",org:co.org,fecha:"3 nov. 2026",base:anual?pm*12:pm,estado:"Aceptado",pasarela:co.pay});
 addLead(co.org,co.org,co.correo,"Suscripción","/precios");co.paso=4;save();renderLayer()}

/* Disparadores de popups en el sitio */
document.addEventListener("mouseout",e=>{if(route().startsWith("panel-")||e.relatedTarget||e.clientY>0)return;const p=DB.popups.find(x=>x.visible&&x.tipo==="Modal"&&x.disparador==="Intención de salida");if(p&&!S.shown[p.id]&&!S.checkout){S.shown[p.id]="open";renderLayer()}});
window.addEventListener("scroll",()=>{if(route().startsWith("panel-"))return;const p=DB.popups.find(x=>x.visible&&x.tipo==="Deslizable");if(!p||S.shown[p.id])return;const r=route();if(p.paginas==="Producto"&&r!=="sitio-personaje")return;const pct=(window.scrollY+innerHeight)/document.body.scrollHeight;if(pct>(parseInt(p.valor)||50)/100){S.shown[p.id]="open";renderLayer()}},{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.checkout){S.checkout=null;renderLayer()}else if(S.popupForzado||Object.values(S.shown).includes("open")){Object.keys(S.shown).forEach(k=>{if(S.shown[k]==="open")S.shown[k]="closed"});S.popupForzado=null;renderLayer()}else if(S.chat){S.chat=false;renderLayer()}}});
window.addEventListener("hashchange",()=>{S.menu=false;render(false)});
render(false);
</script>

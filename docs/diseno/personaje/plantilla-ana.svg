<svg xmlns="http://www.w3.org/2000/svg" id="ana" viewBox="0 0 300 400" width="300" height="400">
  <title>Ana · plantilla técnica de capas (no es el arte final)</title>
  <!-- Colores del kit: #0000FE = primario, #00FE00 = secundario, #FE0000 = acento. El sistema los reemplaza por los del cliente. -->

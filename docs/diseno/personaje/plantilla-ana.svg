      <g id="brazos_explicando"><path d="M18 58L12 82" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="12" cy="82" r="3.6" fill="#C68B62"/><path d="M54 58L66 46" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="66" cy="46" r="3.6" fill="#C68B62"/></g>
    </g>

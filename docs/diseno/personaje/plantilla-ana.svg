      <g id="brazos_celebrando"><path d="M18 58L8 36" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="8" cy="36" r="3.6" fill="#C68B62"/><path d="M54 58L64 36" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="64" cy="36" r="3.6" fill="#C68B62"/></g>
    </g>

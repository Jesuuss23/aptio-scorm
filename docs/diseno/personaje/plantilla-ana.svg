    <g id="pose_neutral">
      <g id="cuerpo_neutral"><rect x="16" y="52" width="40" height="44" rx="12" fill="#0000FE"/><rect x="31" y="52" width="10" height="16" fill="#FE0000"/><rect x="16" y="78" width="40" height="3" fill="#00FE00"/></g>
      <g id="brazos_neutral"><path d="M18 58L12 82" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="12" cy="82" r="3.6" fill="#C68B62"/><path d="M54 58L60 82" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="60" cy="82" r="3.6" fill="#C68B62"/></g>
    </g>
    <g id="pose_explicando" display="none">

      <g id="brazos_advirtiendo"><path d="M18 58L12 82" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="12" cy="82" r="3.6" fill="#C68B62"/><path d="M54 58L62 40" stroke="#0000FE" stroke-width="7" stroke-linecap="round"/><circle cx="62" cy="40" r="3.6" fill="#C68B62"/><rect x="58" y="31" width="8" height="8" rx="2" fill="#C68B62"/></g>
    </g>

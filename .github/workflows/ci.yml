# Integración continua (HU-0107, CP-018): lint, tipos, pruebas, casos de IA, contrato y flujos.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: aptio_scorm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      # S3 y KMS locales para el almacenamiento cifrado (HU-1404, SUP-08).
      localstack:
        image: localstack/localstack:3.8.0
        env:
          SERVICES: s3,kms
          AWS_DEFAULT_REGION: us-east-1
        ports: ['9000:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Solo para la base efímera de CI; no es un secreto.
      DATABASE_URL: postgresql://postgres:password123@localhost:5432/aptio_scorm?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      PROVEEDORES_MODO: simulado
      # Credenciales ficticias de LocalStack; no son secretos.
      AWS_ENDPOINT: http://localhost:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      KMS_KEY_ID: alias/aptio-documentos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Cliente de Prisma
        run: pnpm db:generate
      - name: Tipos
        run: pnpm typecheck
      - name: Migraciones y datos de ejemplo
        run: pnpm db:deploy && pnpm db:seed
      - name: Almacenamiento cifrado
        run: pnpm almacen:preparar
      - name: ffmpeg para la transcripción de video y audio (HU-0305)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Pruebas (Vitest)
        run: pnpm test
      - name: Salidas de IA del caso LOTO
        run: pnpm ia:casos
      - name: Contrato OpenAPI
        run: pnpm openapi:lint

  flujos:
    name: Flujos de la web (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navegador
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Auditoría visual y acceso
        run: pnpm web:e2e
      - name: Resultados si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: apps/web/test-results
          retention-days: 7
